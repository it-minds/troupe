# Keeping the ecosystems this repository actually has from rotting: the workflows' actions,
# the GUI's npm packages and the desktop app's crates (from the GUI's own configuration,
# which came with it), the two Mix projects, and what builds the documentation site.
#
# The GUI had no configuration at first, so only GitHub's default security updates ran —
# and those produced one thing: a weekly failure on a `glib` advisory with no version that
# fixes it. Meanwhile every workflow action sat on a major pinned to a Node runtime
# GitHub is removing, which nothing was watching at all.
#
# Grouped and monthly on purpose. A pull request per patch bump is how a repository
# learns to ignore Dependabot, and an ignored bot is worse than no bot.

version: 2

# Tauri's crates and its npm packages, in one pull request. The Tauri CLI refuses a build
# whose `tauri` crate and `@tauri-apps/api`, or a plugin's crate and its package, differ in
# their minor (Decision 717). In two groups, one per ecosystem, a pull request could move
# one half alone, and #120 did. The npm and cargo entries further down ignore these, so
# this group's pull request is the only one that moves them (Decision 729).
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

updates:
  # The one that actually broke. An action pinned to a major whose Node runtime is
  # removed stops working on a schedule GitHub chooses, not one we do.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /clients/gui
    schedule:
      interval: monthly
    groups:
      # React and Vite move together often enough that separate pull requests mean
      # resolving the same lockfile twice.
      frontend:
        patterns: ["react*", "@types/react*", "vite", "@vitejs/*"]
      tooling:
        patterns: ["typescript", "tsx", "@types/node"]
    ignore:
      # Moved by the `tauri` group, at the top.
      - dependency-name: "@tauri-apps/*"
      # The types of the Node the tools run on, which is `.tool-versions`' major, not the
      # newest: 26's describe what 24 does not have. The major moves by hand, with that
      # line (Decision 729).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /clients/gui
    patterns: ["@tauri-apps/*"]
    multi-ecosystem-group: tauri

  - package-ecosystem: cargo
    directory: /clients/gui/apps/desktop/src-tauri
    patterns: ["tauri*"]
    multi-ecosystem-group: tauri

  - package-ecosystem: cargo
    directory: /clients/gui/apps/desktop/src-tauri
    schedule:
      interval: monthly
    ignore:
      # Moved by the `tauri` group, at the top.
      - dependency-name: "tauri*"
      # `glib` 0.18 arrives through gtk3 and webkit2gtk, which is the stack Tauri 2 uses
      # on Linux. There is no 0.18.x that answers the advisory and no 0.19 that Tauri
      # will accept, so Dependabot cannot produce an update and errors out every time it
      # tries. Ignored until Tauri's Linux backend moves; revisit on the next Tauri major
      # rather than on the next advisory.
      - dependency-name: glib
        versions: ["0.18.x"]
    commit-message:
      prefix: deps

  # The umbrella and the TUI lock 25 packages in common, and `scripts/locks-agree.exs`
  # fails CI when they drift, so the two are updated together: one group each, the same
  # month, and a pull request that bumps one lock and not the other is caught by CI.
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: monthly
    groups:
      hex:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: mix
    directory: /clients/tui
    schedule:
      interval: monthly
    groups:
      hex:
        patterns: ["*"]
    commit-message:
      prefix: deps

  # MkDocs and its theme, pinned in docs/requirements.txt; .github/workflows/pages.yml
  # builds the site with them on every pull request, so a bump that breaks it says so.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: deps
