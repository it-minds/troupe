# Continuous integration for the whole repository — the platform, the daemon, and the two
# clients. `docs/developer/ci.md` has the picture; this is the detail.
#
# One workflow and one required check, `ci-ok`, in two modes:
#
#   * **Focused** — a pull request, and every push to `main`. `changes` works out what the
#     change can have broken and only that runs: a GUI change builds and tests the GUI, a
#     daemon change tests the daemon, and a change to `troupe_core` tests core and every
#     app that depends on it. The filters are on jobs and not on the workflow because a
#     workflow skipped by `paths:` leaves a required check pending forever, while a job
#     skipped by `if:` reports success. A push to `main` also publishes the five images to
#     ghcr.io as `sha-<short>` once what it changed has passed.
#
#   * **Full** — called by `nightly.yml` and `release.yml` with `full: true`: every job,
#     whatever changed, plus the soak (`soak` more runs of each app's suite) and the
#     cluster suite when asked. That is what a release has passed.
#
# The cluster suite (`cluster.yml`) is also focused: a pull request that changes what the
# cluster runs - the chart, its CRDs and admission policy, the operator, the images, the
# kind cluster - runs it, so a rule the API server refuses fails that pull request and not
# the release after it.
#
# Releases are not cut here: `release.yml` (a merged change to VERSION: the full suite,
# then tag and publish) and `prerelease.yml` (by hand: an untested build of any commit,
# published as a pre-release) do that. Nothing in this repository deploys.
#
# GitHub Actions syntax, which Forgejo Actions also runs. Nothing here depends on
# github.com specifically except the marketplace actions, which Forgejo resolves from
# its own configured registry.
name: ci

# A push to a branch runs nothing: the pull request for that branch runs the gate, and
# running it twice for every push measured the same thing twice.
#
# Only a pull request into `main` runs it. One into anything else - a `development-*`
# chunk (docs/developer/fixing-issues.md), or a branch it is stacked on - gets the light
# `dev-check.yml`, and this gate runs once for the whole chunk, on its pull request into
# `main`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run every job, whatever changed.
        type: boolean
        default: false
      soak:
        description: Run each app's suite this many more times, for the race that shows one time in five.
        type: number
        default: 0
      hunt:
        description: The nightly's flake hunt - the TUI's suite 3 more times and the GUI's 5, besides the soak.
        type: boolean
        default: false
      cluster:
        description: Run the suite that needs a Kubernetes cluster (twenty minutes).
        type: boolean
        default: false

# A pull request under active work can have several pipelines in flight at once, all
# measuring the same thing and only the last of them answering a question anyone still
# has. Superseded runs are cancelled; `main` is not, and neither is a full run, because
# a release or the nightly is waiting on it. A full run has its own group, so a release
# does not queue behind the focused run of the push that started it.
concurrency:
  group: ci-${{ inputs.full && 'full' || 'focused' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !inputs.full }}

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.5"
  ZIG_VERSION: "0.16.0"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      server: ${{ steps.plan.outputs.server }}
      chart: ${{ steps.plan.outputs.chart }}
      protocol: ${{ steps.plan.outputs.protocol }}
      tui: ${{ steps.plan.outputs.tui }}
      gui: ${{ steps.plan.outputs.gui }}
      gui_e2e: ${{ steps.plan.outputs.gui_e2e }}
      desktop: ${{ steps.plan.outputs.desktop }}
      vscode: ${{ steps.plan.outputs.vscode }}
      native: ${{ steps.plan.outputs.native }}
      images: ${{ steps.plan.outputs.images }}
      cluster: ${{ steps.plan.outputs.cluster }}
    steps:
      - uses: actions/checkout@v7

      # On a pull request, against its base; on a push, against what `main` was before it.
      # A full run asks nothing: everything runs.
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ !inputs.full }}
        with:
          filters: |
            # The one contract every part of this repository is on one side of, the
            # version, the toolchain and CI itself: a change to any of them runs everything.
            shared:
              - PROTOCOL.md
              - protocol/**
              - VERSION
              - .tool-versions
              - .github/workflows/**
            # Shared by every umbrella app: a change here tests all of them.
            umbrella:
              - config/**
              - mix.exs
              - mix.lock
              - test/**
              - fixtures/**
              - .credo.exs
              - .formatter.exs
              - scripts/dev-up
              - dev/docker-compose.yml
            troupe_protocol: [apps/troupe_protocol/**]
            troupe_core: [apps/troupe_core/**]
            troupe_gateway: [apps/troupe_gateway/**]
            troupe_daemon: [apps/troupe_daemon/**]
            # The front page's stylesheet and the TUI's palette are generated from the
            # GUI's theme files (Decision 716), so a token changed there checks both.
            troupe_plane: [apps/troupe_plane/**, clients/gui/docs/design/themes/**]
            troupe_operator: [apps/troupe_operator/**]
            troupe_worker: [apps/troupe_worker/**]
            troupe_a2a: [apps/troupe_a2a/**]
            chart:
              - charts/**
              - docker/**
              - dev/kind/**
              - scripts/remote-up
              - scripts/build-images
            # The command reference is generated from the TUI's tables (Decision 767), so
            # a hand edit to it is checked as the palette is.
            tui:
              - clients/tui/**
              - clients/gui/docs/design/themes/**
              - docs/user/cli-reference.md
              - scripts/locks-agree.exs
            gui:
              - clients/gui/**
              - scripts/version.exs
            gui_e2e:
              - clients/gui/packages/client/**
              - clients/gui/dev/**
            # The desktop app's Rust: finding and starting the daemon, the update, the
            # sign-in's keychain entry.
            desktop:
              - clients/gui/apps/desktop/src-tauri/**
            vscode:
              - clients/vscode/**
              - scripts/version.exs
            native:
              - clients/tui/**
              - clients/gui/apps/desktop/**
              - clients/gui/packages/client/**
              - apps/troupe_daemon/**
              - .github/workflows/native.yml
            # What the cluster suite deploys or is: the chart with its CRDs and admission
            # policy, the images, the kind cluster and the scripts that build it, the
            # operator and its suite. `dev-check.yml` has the same list.
            cluster:
              - charts/**
              - docker/**
              - dev/kind/**
              - scripts/kind-up
              - scripts/remote-up
              - scripts/build-images
              - scripts/kind-upgrade-check
              - apps/troupe_operator/**
              - .github/workflows/cluster.yml
              # What the upgrade from the previous release runs: the plane's migrations, and the
              # version, which a release commit changes.
              - apps/troupe_plane/priv/repo/migrations/**
              - VERSION
              # The images it builds: the GUI's, and what every image build's context leaves out.
              - clients/gui/Dockerfile
              - .dockerignore

      # Which umbrella apps to test follows the dependency graph, read from the apps' own
      # `mix.exs` rather than written down here, so it cannot drift: a change to an app
      # tests it and every app that depends on it, directly or not. Today that is
      #
      #   troupe_protocol  <- every app
      #   troupe_core      <- troupe_gateway, troupe_daemon, troupe_worker
      #   troupe_gateway   <- troupe_daemon, troupe_worker
      #   troupe_plane     <- troupe_worker
      #
      # and the rest are leaves.
      - name: Plan
        id: plan
        env:
          FULL: ${{ inputs.full && 'true' || 'false' }}
          CLUSTER: ${{ inputs.cluster && 'true' || 'false' }}
          EVENT: ${{ github.event_name }}
          F: ${{ toJSON(steps.filter.outputs) }}
        run: |
          on() { [ "$FULL" = true ] || [ "$(echo "$F" | jq -r --arg k "$1" '.[$k] // "false"')" = true ]; }
          deps_of() { grep -oE '\{:troupe_[a-z0-9_]+, in_umbrella: true' "apps/$1/mix.exs" | sed -E 's/\{:([a-z0-9_]+).*/\1/'; }

          all=$(ls apps)
          if on shared || on umbrella; then
            apps="$all"
          else
            apps=""
            for app in $all; do on "$app" && apps="$apps $app"; done
            # Add every app that depends on one already in the set, until nothing changes.
            grew=true
            while $grew; do
              grew=false
              for app in $all; do
                case " $apps " in *" $app "*) continue ;; esac
                for dep in $(deps_of "$app"); do
                  case " $apps " in *" $dep "*) apps="$apps $app"; grew=true; break ;; esac
                done
              done
            done
          fi
          json=$(printf '%s\n' $apps | jq -R . | jq -cs 'map(select(. != "")) | sort')
          has() { echo "$json" | jq -e --arg a "$1" 'index($a) != null' >/dev/null; }
          flag() { if "$@"; then echo true; else echo false; fi; }

          server=$(flag test "$json" != "[]")
          chart=$(flag eval 'on shared || on chart')
          # The schema and the Python client stand on the protocol and the harness.
          protocol=$(flag eval 'has troupe_protocol || has troupe_gateway')
          # The TUI builds the harness apps by path.
          tui=$(flag eval 'on shared || on tui || has troupe_gateway')
          gui=$(flag eval 'on shared || on gui')
          # The client against a plane built from this commit.
          gui_e2e=$(flag eval 'on shared || on gui_e2e || on chart || has troupe_plane || has troupe_gateway')
          desktop=$(flag eval 'on shared || on desktop')
          vscode=$(flag eval 'on shared || on vscode')
          # Native builds on a pull request that touches them; a full run leaves them to
          # its caller, which attaches them to what it publishes.
          native=$(flag eval '[ "$EVENT" = pull_request ] && on native')
          # Every merged commit that changed something an image is built from.
          images=$(flag eval '[ "$FULL" = false ] && [ "$EVENT" = push ] && { [ "$server" = true ] || on gui || on chart; }')
          # The cluster suite: in a full run that asks for it, and on a pull request that
          # changes what it deploys. Not for a change to the workflows in general, which
          # runs everything else, and not on a push to `main`, whose pull request ran it.
          cluster=$(flag eval '[ "$CLUSTER" = true ] || { [ "$FULL" = false ] && [ "$EVENT" = pull_request ] && on cluster; }')

          {
            echo "apps=$json"
            echo "server=$server"
            echo "chart=$chart"
            echo "protocol=$protocol"
            echo "tui=$tui"
            echo "gui=$gui"
            echo "gui_e2e=$gui_e2e"
            echo "desktop=$desktop"
            echo "vscode=$vscode"
            echo "native=$native"
            echo "images=$images"
            echo "cluster=$cluster"
          } | tee -a "$GITHUB_OUTPUT"

          {
            echo "### What runs"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| umbrella apps | \`$json\` |"
            for k in chart protocol tui gui gui_e2e desktop vscode native images cluster; do echo "| $k | ${!k} |"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # Compile, format, credo, generated assets and boundaries: once, for the whole
  # umbrella, whenever any app is under test. None of it needs a database.
  lint:
    name: compile, format, credo, boundaries
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --force --warnings-as-errors

      - run: mix format --check-formatted
      - run: mix credo --strict

      # Files that are generated and committed: the console's bundle, its design tokens,
      # the theme stylesheet a browser is served, and the config.yaml schema with its key
      # reference. Each task's own moduledoc says CI checks it with `--check` — so a token
      # changed without regenerating fails here rather than reaching a browser as a colour
      # that is slightly wrong, and a config key cannot be added without its schema.
      - name: Generated assets are current
        run: |
          MIX_ENV=test mix troupe.admin.assets --check
          MIX_ENV=test mix troupe.admin.tokens --check
          MIX_ENV=test mix troupe.theme --check
          MIX_ENV=test mix troupe.config.schema --check

      # The architecture is a claim about coupling, and claims like that decay
      # silently. This is the thing that makes it fail loudly instead.
      - name: Boundaries
        run: MIX_ENV=test mix troupe.boundaries

      # `troupe bench`'s offline suite (Decision 772): what a turn costs and does, against
      # a scripted model, held to the budgets in apps/troupe_core/priv/bench/budgets.json.
      # A few seconds. The table goes into the run's summary and the JSON is kept, so two
      # runs can be compared.
      - name: The bench is within its budgets
        run: |
          status=0
          MIX_ENV=test mix troupe.bench --json bench.json > bench.md || status=$?
          cat bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore

      # The clients depend on the platform — the TUI on the harness apps, by path — and
      # never the other way: nothing under `apps/` may name anything under `clients/`.
      # `troupe.boundaries` sees only the umbrella, so this is the check for the direction
      # it cannot see (Decision 666).
      - name: Nothing in the umbrella depends on a client
        run: |
          if grep -nE 'path:[^,}]*clients/' mix.exs apps/*/mix.exs; then
            echo "an umbrella mix.exs depends on a client"
            exit 1
          fi

  # One leg per app the change can have broken, in parallel. Each leg compiles the
  # umbrella (from the cache) and runs that app's suite, which is what `mix test` at the
  # root does one app after another.
  test:
    name: test ${{ matrix.app }}
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-26.04
    # One pass of the slowest suite is a few minutes; a full run's ten passes of the
    # worker's take about twenty.
    timeout-minutes: ${{ inputs.soak > 0 && 60 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # inotify-tools: the native watch backend needs it; without it those tests skip
      # and the polling backend is all that gets covered — and the done item that says
      # a written file reaches subscribers inside a second is not met by polling.
      # bubblewrap: `Troupe.SandboxTest` is the only thing that proves one session
      # cannot see another's workspace, and it needs a real sandbox to prove it in.
      - name: Install inotify-tools and bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y inotify-tools bubblewrap

          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and
          # an unprivileged user namespace is the whole of how bubblewrap builds a
          # sandbox without being root. Left on, bwrap answers every one of those tests
          # with "setting up uid map: Permission denied" — which looks like a sandbox
          # that refused, and is a runner that refused.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Postgres, MinIO and OpenBao, from the same compose file a laptop uses, on the
      # same ports `config/config.exs` names. Not three `services:` blocks: the bucket
      # needs versioning enabled and OpenBao needs a transit engine and a signing key
      # before anything can mint a token, and `services:` has nowhere to put that.
      - name: Postgres, MinIO and OpenBao
        run: scripts/dev-up

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # The same two commands `test_helper.exs` tells a developer to run when it finds
      # no database; the sandbox then owns every transaction the suite opens.
      - name: Migrate the plane's test database
        run: MIX_ENV=test mix ecto.create --quiet && MIX_ENV=test mix ecto.migrate --quiet

      # From the umbrella's root with the app's own test directory, not from inside the
      # app: some suites read across the umbrella — `troupe_protocol`'s checks every
      # app's version and borrows the operator's fixtures — and only the root loads it all.
      - name: Test
        id: test
        run: mix test "apps/${{ matrix.app }}/test"

      # A full run's soak: the suite is concurrent, and a race that shows up one time in
      # five is a bug this project cares about. The nightly and a release owe it; a pull
      # request and an ordinary merge do not. Every run goes on whatever the last did
      # (each with a seed of its own), also after the first pass failed, and the step
      # names every test that failed in any of them (`scripts/flake-hunt`).
      - name: Test, ${{ inputs.soak }} more times
        if: inputs.soak > 0 && (success() || steps.test.outcome == 'failure')
        env:
          SOAK: ${{ inputs.soak }}
          APP: ${{ matrix.app }}
        run: scripts/flake-hunt "$SOAK" mix test "apps/$APP/test"

  chart:
    name: helm lint, render, kubeconform
    needs: [changes]
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint, with each values file that is meant to install
        run: |
          helm lint charts/troupe
          helm lint charts/troupe --values charts/troupe/values.small.yaml
          helm lint charts/troupe --values charts/troupe/values.example.yaml
          helm lint charts/troupe --set gui.enabled=false --set plane.appUrl=https://gui.example.test
          helm lint charts/troupe --set console.enabled=false

      # The console is an app of its own on the plane's host, from the GUI's image: it has an
      # Ingress at a path of its own, it stays when the GUI is turned off, and it is refused
      # at the root of the host or at the GUI's path.
      - name: The chart serves the console at its own path
        run: |
          rendered=$(helm template troupe charts/troupe --show-only templates/gui-deployment.yaml)
          if ! grep -q 'name: troupe-console' <<<"$rendered" || ! grep -qF 'path: "/console(/|$)(.*)"' <<<"$rendered"; then
            echo "the chart serves no console at /console"
            exit 1
          fi
          alone=$(helm template troupe charts/troupe --set gui.enabled=false --set plane.appUrl=https://gui.example.test \
            --show-only templates/gui-deployment.yaml)
          if ! grep -q 'kind: Deployment' <<<"$alone" || ! grep -q 'name: troupe-console' <<<"$alone"; then
            echo "gui.enabled=false took the console with it"
            exit 1
          fi
          for bad in console.basePath=/ console.basePath=/app; do
            if helm template troupe charts/troupe --set "$bad" >/dev/null 2>&1; then
              echo "$bad rendered; the chart must refuse it"
              exit 1
            fi
          done

      # The one combination the chart refuses on purpose — replicas that do not form an
      # Erlang cluster — has to keep being refused, or the check is decoration.
      - name: The chart refuses unclustered replicas
        run: |
          if helm template troupe charts/troupe --set plane.replicas=2 --set plane.distribution=none >/dev/null 2>&1; then
            echo "plane.replicas=2 with plane.distribution=none rendered; the chart must refuse it"
            exit 1
          fi

      # A worker's seccomp profile the kubelet would not take is a pod that never starts, and
      # the installer mounts the profile's own directory from every node, so a path that
      # climbs out of the kubelet's seccomp directory would mount another.
      - name: The chart refuses a worker seccomp profile no kubelet takes, or one outside its directory
        run: |
          for bad in worker.seccomp.type=unconfined worker.seccomp.localhostProfile= \
              worker.seccomp.localhostProfile=worker.json worker.seccomp.localhostProfile=../../etc/x.json \
              worker.seccomp.install.kubeletSeccompDir=/var/lib/kubelet/../../etc; do
            if helm template troupe charts/troupe --set "$bad" >/dev/null 2>&1; then
              echo "$bad rendered; the chart must refuse it"
              exit 1
            fi
          done
          rendered=$(helm template troupe charts/troupe --values dev/kind/values.yaml)
          if grep -q 'name: troupe-worker-seccomp' <<<"$rendered"; then
            echo "an Unconfined worker still renders the profile's installer"
            exit 1
          fi
          # A string "false" is true to a template, and would turn user namespaces on.
          if helm template troupe charts/troupe --set-string worker.userNamespaces=false >/dev/null 2>&1; then
            echo "worker.userNamespaces as a string rendered; the chart must refuse it"
            exit 1
          fi

      # The worker's AppArmor profile is a name the kubelet takes, never a type: no value makes
      # the worker container Unconfined. On by default, its loader beside the seccomp
      # installer; off, the operator is told no profile.
      - name: The chart gives workers its AppArmor profile, by a name, and refuses another
        run: |
          for bad in worker.appArmor.profile= worker.appArmor.profile=../x worker.appArmor.profile=-x \
              "worker.appArmor.profile=un confined"; do
            if helm template troupe charts/troupe --set "$bad" >/dev/null 2>&1; then
              echo "$bad rendered; the chart must refuse it"
              exit 1
            fi
          done
          for bad in worker.appArmor.enabled=false worker.appArmor.install.enabled=false; do
            if helm template troupe charts/troupe --set-string "$bad" >/dev/null 2>&1; then
              echo "$bad as a string rendered; the chart must refuse it"
              exit 1
            fi
          done
          rendered=$(helm template troupe charts/troupe)
          if ! grep -q 'name: troupe-worker-apparmor' <<<"$rendered" \
              || ! grep -qF 'apparmor_parser --replace --skip-cache /profile/troupe-worker' <<<"$rendered"; then
            echo "the default values load no AppArmor profile for workers"
            exit 1
          fi
          off=$(helm template troupe charts/troupe --set worker.appArmor.enabled=false \
            --show-only templates/operator-deployment.yaml)
          if ! grep -A1 'name: TROUPE_WORKER_APPARMOR_PROFILE' <<<"$off" | grep -q 'value: ""'; then
            echo "worker.appArmor.enabled=false still names a profile to the operator"
            exit 1
          fi

      # The operator copies the control certificate's CA into every worker namespace, and it
      # is given that one key of the Secret, never the certificate's key. A control port
      # told to take TLS only with no certificate would enrol nobody, and a string "false"
      # would read as on.
      - name: The chart gives the operator the control CA alone, and refuses TLS-only without TLS
        run: |
          operator=$(helm template troupe charts/troupe --show-only templates/operator-deployment.yaml)
          if ! grep -q 'name: TROUPE_PLANE_CONTROL_CA' <<<"$operator" \
              || ! grep -qx '              - key: ca.crt' <<<"$operator" \
              || grep -q 'key: tls.key' <<<"$operator"; then
            echo "the operator is not given ca.crt alone from the control certificate's Secret"
            exit 1
          fi
          # TLS only by default, and so TLS off alone is TLS-only without TLS. Turned off, it
          # is said as "false": the plane with a certificate and nothing said takes TLS only.
          if ! helm template troupe charts/troupe --show-only templates/plane-deployment.yaml \
              | grep -A1 'name: TROUPE_PLANE_CONTROL_REQUIRE_TLS' | grep -q 'value: "true"'; then
            echo "the plane does not take TLS only by default"
            exit 1
          fi
          if ! helm template troupe charts/troupe --set plane.controlTls.requireTls=false \
              --show-only templates/plane-deployment.yaml \
              | grep -A1 'name: TROUPE_PLANE_CONTROL_REQUIRE_TLS' | grep -q 'value: "false"'; then
            echo "plane.controlTls.requireTls=false does not tell the plane so"
            exit 1
          fi
          for bad in "--set plane.controlTls.requireTls=true --set plane.controlTls.enabled=false" \
              "--set plane.controlTls.enabled=false" \
              "--set-string plane.controlTls.requireTls=false"; do
            # shellcheck disable=SC2086
            if helm template troupe charts/troupe $bad >/dev/null 2>&1; then
              echo "$bad rendered; the chart must refuse it"
              exit 1
            fi
          done

      # The GUI shares the plane's host, and the root of that host is the plane's.
      - name: The chart refuses a GUI mounted at /
        run: |
          if helm template troupe charts/troupe --set gui.basePath=/ >/dev/null 2>&1; then
            echo "gui.basePath=/ rendered; the chart must refuse it"
            exit 1
          fi

      # An uninstall, a reinstall, or a GitOps controller's remediation that uninstalls must
      # not delete the namespace, because more than the chart lives in it. And a chart told
      # not to make the namespace makes none. Each render is kept in a variable rather than
      # piped: under `pipefail`, `grep -q` leaving early fails the pipe and reads as no match.
      - name: The namespace outlives the chart
        run: |
          for values in values.yaml values.small.yaml values.example.yaml; do
            namespace=$(helm template troupe charts/troupe --values "charts/troupe/$values" \
              --show-only templates/namespace.yaml)
            if ! grep -qx '    helm.sh/resource-policy: keep' <<<"$namespace"; then
              echo "$values: the namespace renders without helm.sh/resource-policy: keep"
              exit 1
            fi
          done
          rendered=$(helm template troupe charts/troupe --set createNamespace=false)
          if grep -qx 'kind: Namespace' <<<"$rendered"; then
            echo "createNamespace=false rendered a Namespace"
            exit 1
          fi

      # The Pod Security labels: the chart's namespace at the lowest level its own pods need,
      # `privileged` while the DaemonSet that puts the workers' profiles on the nodes runs and
      # `restricted` without it, the level named when one is, none when they are off; and the
      # operator told whether to label the worker namespaces and whether the plane takes TLS
      # only, which decides whether it replaces a pod that dials in plaintext. The cluster
      # job checks the levels against an API server.
      - name: The chart labels its namespace with the Pod Security level its pods need
        run: |
          level() {
            rendered=$(helm template troupe charts/troupe --show-only templates/namespace.yaml "$@")
            grep -m1 'pod-security.kubernetes.io/enforce:' <<<"$rendered" | awk '{print $2}'
          }
          [ "$(level)" = privileged ] || { echo "the defaults label the namespace $(level)"; exit 1; }
          [ "$(level --set worker.seccomp.install.enabled=false --set worker.appArmor.install.enabled=false)" = restricted ] \
            || { echo "without the DaemonSet the namespace is not restricted"; exit 1; }
          [ "$(level --set podSecurity.level=baseline)" = baseline ] || { echo "podSecurity.level is not used"; exit 1; }
          [ -z "$(level --set podSecurity.labels=false)" ] || { echo "podSecurity.labels=false still labels"; exit 1; }
          for bad in "--set podSecurity.level=lenient" "--set-string podSecurity.labels=false"; do
            # shellcheck disable=SC2086
            if helm template troupe charts/troupe $bad >/dev/null 2>&1; then
              echo "$bad rendered; the chart must refuse it"
              exit 1
            fi
          done
          operator=$(helm template troupe charts/troupe --show-only templates/operator-deployment.yaml)
          for env in TROUPE_POD_SECURITY_LABELS TROUPE_PLANE_CONTROL_REQUIRE_TLS; do
            if ! grep -A1 "name: $env" <<<"$operator" | grep -q 'value: "true"'; then
              echo "the operator is not told $env by default"
              exit 1
            fi
          done

      # Rendered and checked against the Kubernetes API schemas, which is what catches a
      # misspelled field before a cluster does. The CRDs are included so a TroupePolicy
      # and a WorkerProfile are checked against their own schemas; the kinds no schema
      # is published for are skipped rather than failed.
      - name: Render and validate
        run: |
          for values in values.small.yaml values.example.yaml; do
            echo "=== $values"
            helm template troupe charts/troupe \
              --namespace troupe-system --include-crds \
              --values "charts/troupe/$values" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                  -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          done
          echo "=== values.small.yaml, bringing its own client"
          helm template troupe charts/troupe \
            --namespace troupe-system --include-crds \
            --values charts/troupe/values.small.yaml --set gui.enabled=false \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          # Neither values file names a pull secret, since the published images need none.
          # A registry of one's own does, and the API server's shape for one is checked
          # here: the GUI's was wrong for a release and nothing saw it.
          echo "=== values.example.yaml, with a pull secret"
          helm template troupe charts/troupe \
            --namespace troupe-system --include-crds \
            --values charts/troupe/values.example.yaml --set "imagePullSecrets[0]=registry-pull" \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0

  protocol:
    name: schema compatibility and the Python client
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # Fields may be added; they may not be removed, renamed, retyped, or newly made
      # required. A published protocol is a promise to people who are not in this
      # repository, and this is what keeps it.
      - name: Schema compatibility
        run: mix troupe.schema.diff

      - name: Committed schema is current
        run: |
          mix troupe.schema.gen
          git diff --exit-code protocol/schema/v1 \
            || { echo "protocol/schema/v1 is stale: run mix troupe.schema.gen and commit"; exit 1; }

      # A client written against PROTOCOL.md in another language, with no access to this
      # source. The TUI and the GUI live in this repository now, so this is the check that
      # proves the protocol alone is enough to be a client — the one that bring-your-own
      # clients rely on (Decision 673).
      - name: Python reference client, end to end
        run: mix test apps/troupe_gateway/test/troupe/gateway/python_client_test.exs --trace

  tui:
    name: the TUI — compile, format, credo, xref, test
    needs: [changes]
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-24.04
    # The flake hunt's three more runs of the suite take about seven minutes.
    timeout-minutes: ${{ inputs.hunt && 35 || 20 }}
    defaults:
      run:
        working-directory: clients/tui
    env:
      MIX_ENV: test
      # The idle-shutdown test waits a minute without it.
      TROUPE_IDLE_TEST_MS: "1000"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # The harness is a path dependency on `apps/`, and `troupe_core` builds the reaper
      # when it compiles; without Zig every OS-process test would fail on a missing helper.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            clients/tui/deps
            clients/tui/_build
          key: ${{ runner.os }}-tui-${{ hashFiles('clients/tui/mix.lock', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-tui-

      # The TUI locks the 25 packages it shares with the umbrella in its own `mix.lock`;
      # a harness built against one version on a laptop and another in a pod is the drift
      # this repository exists to end.
      - name: The two Mix locks agree
        working-directory: .
        run: elixir scripts/locks-agree.exs

      - run: mix deps.get
      - run: mix check
        id: check

      # The nightly's flake hunt: the suite three more times, each with a seed of its own,
      # naming every test that failed in any of them (`scripts/flake-hunt`).
      - name: Test, 3 more times
        if: inputs.hunt && (success() || steps.check.outcome == 'failure')
        run: ../../scripts/flake-hunt 3 mix test

  gui:
    name: the GUI — tokens, typecheck, build, test
    needs: [changes]
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-26.04
    # The flake hunt's five more runs of the suites take about ten minutes.
    timeout-minutes: ${{ inputs.hunt && 30 || 15 }}
    defaults:
      run:
        working-directory: clients/gui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/gui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/gui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The generated stylesheet is committed, so a design token changed without running
      # `pnpm tokens` would otherwise reach a deployment as a file nobody regenerated.
      - name: The committed design tokens match the design file
        run: pnpm tokens:check

      # The bundler needs the desktop app's icons as files, so they are committed too,
      # generated from the same design file. After the tokens, so that a stale `mark.ts`
      # is reported as itself and not as nineteen wrong icons.
      - name: The committed desktop icons are the mask
        run: pnpm icons:check

      - run: pnpm typecheck

      # The protocol client has to be built before the app typechecks against its types
      # in a clean checkout, and building it is most of what `pnpm build` does anyway.
      - run: pnpm build

      - run: pnpm test
        id: test

      # The nightly's flake hunt: the suites five more times, the apps' files and tests in
      # an order of their own each time, naming every test that failed in any of them.
      - name: Test, 5 more times
        if: inputs.hunt && (success() || steps.test.outcome == 'failure')
        env:
          TROUPE_TEST_SHUFFLE: "1"
        run: ../../scripts/flake-hunt 5 pnpm test

  # The desktop crate's own tests, which nothing else runs: the native build compiles it
  # and the GUI's tests are the web bundle's. On Linux, with the system libraries Tauri
  # links, and a `dist` the context macro can embed, since the tests need no bundle.
  desktop:
    name: the desktop app's Rust — cargo test
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: clients/gui/apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libdbus-1-dev libssl-dev pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/gui/apps/desktop/src-tauri -> target

      - name: A web bundle to embed
        run: mkdir -p ../dist && echo '<!doctype html><title>Troupe</title>' > ../dist/index.html

      - run: cargo test --locked

  gui-e2e:
    name: the GUI against a plane built from this commit
    needs: [changes]
    if: needs.changes.outputs.gui_e2e == 'true'
    runs-on: ubuntu-26.04
    # Three minutes as a rule; above the stack's own ten-minute wait, so a plane that never
    # comes up still reaches the step that prints its log.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/gui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/gui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: clients/gui

      - uses: docker/setup-buildx-action@v4

      # Postgres, OpenBao, Dex and the plane — built from `docker/Dockerfile` here, not
      # pulled — in one compose project with no Kubernetes. The test drives Dex's device
      # flow headlessly, so "sign in" is a test rather than something somebody sits
      # through (clients/gui/docs/e2e.md).
      - name: A plane from this commit
        working-directory: clients/gui
        run: docker compose -f dev/plane-stack.yml up -d --wait --wait-timeout 600 --build

      - name: The client against it
        working-directory: clients/gui/packages/client
        env:
          TROUPE_E2E_PLANE: http://localhost:4020
        run: node --test --import tsx --test-reporter=spec test/e2e.plane.test.ts

      # The plane's own log, and the migration's apart from it: together, the migration's
      # hundred lines of `create table` are all a tail of the pair would show.
      - name: The plane's log, on failure
        if: failure()
        working-directory: clients/gui
        run: |
          docker compose -f dev/plane-stack.yml ps --all
          docker compose -f dev/plane-stack.yml logs --no-color plane | tail -200
          docker compose -f dev/plane-stack.yml logs --no-color plane-migrate | tail -20

  # The VS Code extension (clients/vscode): its unit tests, which put the line it types
  # through each shell the runner has; its suite inside a real VS Code, downloaded, against
  # a fake `troupe`, where the shell is bash on Linux and PowerShell on Windows; and the
  # `.vsix`, kept as the run's artifact; a release builds its own and attaches it (Decision
  # 765). macOS only in a full run, for the reason `native` gives.
  vscode:
    name: the VS Code extension — test, package (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.vscode == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-26.04", "windows-latest", "macos-latest"]' || '["ubuntu-26.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/vscode/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/vscode/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # A runner has no display: Linux's VS Code gets a virtual one.
      - name: A virtual display
        if: runner.os == 'Linux'
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: The suite inside VS Code
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm test:vscode

      - name: The .vsix
        if: runner.os == 'Linux'
        run: pnpm package

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: troupe-vscode
          path: clients/vscode/troupe.vsix
          if-no-files-found: error

  # The chart, the GUI's packages and the desktop app repeat VERSION because they cannot
  # read it; a copy nobody checks is how four numbers came to have no relation. And a
  # Markdown link goes dead when any file moves, whatever the change was, so it is checked
  # here too, as is a deployment's own name finding its way back into the product
  # (Decision 734), and a decision whose `paths` no longer match (Decision 790). All cheap,
  # so this runs whatever the change touched.
  versions:
    name: every copy of the version agrees, every doc link resolves, no deployment is named
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit under test and its first parent, which for a pull request is the
          # base it merges into: what the citation check compares with.
          fetch-depth: 2
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: elixir scripts/version.exs check
      - run: elixir scripts/doc-links.exs
      - run: elixir scripts/check-neutral.exs
      # Code states its own invariants and cites no decision by number; the citations
      # already there go as their files are touched (#422). Here and not in `lint`, which
      # runs only when an umbrella app changed, because the clients' code counts too.
      - name: No change adds a decision number to code
        run: elixir scripts/decision-citations.exs --base HEAD^1
      # Every decision file: its front matter, a number of its own, and every `paths` glob
      # still matching (Decision 790). Here and not in `lint`, which runs only when an app
      # changed, because a glob breaks when any file moves. The task needs no dependency,
      # so a bare `elixir` runs it and nothing is compiled.
      - name: Every decision is well formed and governs paths that exist
        run: >-
          elixir -r apps/troupe_protocol/lib/mix/tasks/troupe.decisions.ex
          -e 'Mix.Tasks.Troupe.Decisions.run(System.argv())' -- --check

  # Without macOS: a macOS runner costs about ten Linux ones, and the nightly and every
  # release build both macOS targets anyway.
  native:
    name: native builds
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native.yml
    with:
      macos: false

  # Twenty-five minutes on a kind cluster (`cluster.yml`, which `dev-check.yml` calls too):
  # the nightly and a release ask for it, and a pull request that changes what it deploys
  # runs it. After the jobs that check the same change for less, so a change they refuse
  # does not also spend a cluster; one they skipped, because its part did not change, is
  # no reason to wait.
  cluster:
    name: the suite that needs a cluster
    needs: [changes, lint, test, chart]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.cluster == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    uses: ./.github/workflows/cluster.yml
    permissions:
      contents: read

  # The one required check. Every job a run can have is under it, and it fails when any
  # of them failed or was cancelled; a job skipped because its part of the repository
  # did not change counts as passing, which is the point of skipping it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, versions, lint, test, chart, protocol, tui, gui, gui-e2e, desktop, vscode, native, cluster]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job this run needed did not pass"
            exit 1
          fi

  # Every merged commit that changed something an image is built from is pullable as
  # `sha-<short>`, once what it changed has passed. Not a release: `release.yml` builds
  # and tags a version, and nothing here deploys.
  images:
    name: images
    needs: [changes, ci-ok]
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && needs.changes.outputs.images == 'true' }}
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
