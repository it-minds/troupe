# Continuous integration: the quality gate on one runner, then a build matrix with
# one target per native runner.
#
# GitHub Actions syntax, which Forgejo Actions also runs. Nothing here depends on
# github.com specifically except the marketplace actions, which Forgejo resolves from
# its own configured registry.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.5"
  ZIG_VERSION: "0.16.0"

jobs:
  check:
    name: compile, format, credo, boundaries, test
    runs-on: ubuntu-latest
    # The plane is the one app that needs a database, and without one its suite skips
    # itself — loudly in the log, silently in the exit code, so a green run proved
    # nothing about the plane. `config/config.exs` points the test repo at
    # localhost:55432, the port `scripts/dev-up` uses so a laptop's own Postgres is
    # left alone, and the service is mapped onto that same port so CI and a laptop run
    # from one configuration. (`DATABASE_URL` is read only by a `prod` release and
    # would be ignored here.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: troupe
          POSTGRES_PASSWORD: troupe
          POSTGRES_DB: troupe_plane_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U troupe -d troupe_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The native watch backend needs this; without it those tests skip and the
      # polling backend is all that gets covered.
      - name: Install inotify-tools
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --force --warnings-as-errors

      - run: mix format --check-formatted
      - run: mix credo --strict

      # The architecture is a claim about coupling, and claims like that decay
      # silently. This is the thing that makes it fail loudly instead.
      - name: Boundaries
        run: MIX_ENV=test mix troupe.boundaries

      # The same two commands `test_helper.exs` tells a developer to run when it finds
      # no database; the sandbox then owns every transaction the suite opens.
      - name: Migrate the plane's test database
        run: MIX_ENV=test mix ecto.create --quiet && MIX_ENV=test mix ecto.migrate --quiet

      # Ten runs, because the suite is concurrent and a race that shows up one time
      # in five is a bug this project cares about.
      - name: Test (10 consecutive runs)
        run: for i in $(seq 10); do mix test || exit 1; done

  chart:
    name: helm lint, render, kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint, with each values file that is meant to install
        run: |
          helm lint charts/troupe
          helm lint charts/troupe --values charts/troupe/values.small.yaml
          helm lint charts/troupe --values charts/troupe/values.scaleway.yaml

      # The one combination the chart refuses on purpose — replicas that do not form an
      # Erlang cluster — has to keep being refused, or the check is decoration.
      - name: The chart refuses unclustered replicas
        run: |
          if helm template troupe charts/troupe --set plane.replicas=2 --set plane.distribution=none >/dev/null 2>&1; then
            echo "plane.replicas=2 with plane.distribution=none rendered; the chart must refuse it"
            exit 1
          fi

      # Rendered and checked against the Kubernetes API schemas, which is what catches a
      # misspelled field before a cluster does. The CRDs are included so a TroupePolicy
      # and a WorkerProfile are checked against their own schemas; the kinds no schema
      # is published for are skipped rather than failed.
      - name: Render and validate
        run: |
          for values in values.small.yaml values.scaleway.yaml; do
            echo "=== $values"
            helm template troupe charts/troupe \
              --namespace troupe-system --include-crds \
              --values "charts/troupe/$values" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                  -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          done

  images:
    name: image ${{ matrix.release }}
    needs: [check, protocol]
    # A push needs a credential and a pull request from a fork has none, so images are
    # built from pushes — which is also when there is a commit worth naming a tag after.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        release: [troupe_operator, troupe_plane, troupe_worker, troupe_a2a]
    steps:
      - uses: actions/checkout@v4

      # Where the images go. Three secrets — `REGISTRY`, `REGISTRY_USERNAME`,
      # `REGISTRY_PASSWORD` — name a registry and how to log in to it, and a fourth,
      # `REGISTRY_NAMESPACE`, the path under it (Scaleway's registry wants its
      # namespace there, not the GitHub owner). Without them the images go to this
      # repository's own packages on ghcr.io with the workflow's token, which is what a
      # fork or a first run wants.
      - name: Resolve the registry and the tags
        id: registry
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
          RELEASE: ${{ matrix.release }}
        run: |
          registry="${REGISTRY:-ghcr.io}"
          namespace="${REGISTRY_NAMESPACE:-${GITHUB_REPOSITORY_OWNER}}"
          # Registries want lower case, and a GitHub owner need not be.
          image=$(echo "${registry}/${namespace}/${RELEASE//_/-}" | tr '[:upper:]' '[:lower:]')

          # `sha-<short>` on every push, so every commit is pullable; and the version on
          # a release tag, without its `v`, because that is what the values files write.
          tags="${image}:sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${tags},${image}:${GITHUB_REF_NAME#v}" ;;
          esac

          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      # linux/amd64 only: that is what the node pool is, and an arm64 build of the
      # umbrella under emulation is an hour nobody has asked for. The three images share
      # every layer up to `mix release`, so one cache serves the whole matrix.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: RELEASE=${{ matrix.release }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  protocol:
    name: schema compatibility and the Python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # Fields may be added; they may not be removed, renamed, retyped, or newly made
      # required. A published protocol is a promise to people who are not in this
      # repository, and this is what keeps it.
      - name: Schema compatibility
        run: mix troupe.schema.diff

      - name: Committed schema is current
        run: |
          mix troupe.schema.gen
          git diff --exit-code protocol/schema/v1 \
            || { echo "protocol/schema/v1 is stale: run mix troupe.schema.gen and commit"; exit 1; }

      # A client written against PROTOCOL.md in another language, with no access to
      # this source. It is the only check that actually proves the built-in clients
      # have no private access.
      - name: Python reference client, end to end
        run: mix test apps/troupe_gateway/test/troupe/gateway/python_client_test.exs --trace

  build:
    name: build ${{ matrix.target }}
    needs: [check, protocol]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One target per native runner. Cross-building is possible for the Zig
          # wrapper but not for the payload: rustler_precompiled resolves the
          # ExRatatui NIF against the build host, so a macOS binary built on Linux
          # would carry a Linux .so and fail at NIF load.
          - { os: ubuntu-latest, target: linux_x86_64, ext: "" }
          - { os: ubuntu-24.04-arm, target: linux_aarch64, ext: "" }
          - { os: macos-15-intel, target: macos_x86_64, ext: "" }
          - { os: macos-14, target: macos_aarch64, ext: "" }
          - { os: windows-latest, target: windows_x86_64, ext: ".exe" }

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install xz (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install xz || true

      - name: Install xz and 7zip (Windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install -y xz 7zip

      - run: mix deps.get

      - name: Build the release
        shell: bash
        env:
          MIX_ENV: prod
          BURRITO_TARGET: ${{ matrix.target }}
          TROUPE_REAPER_TARGETS: all
        run: |
          # Burrito's Linux wrapper carries a musl ERTS, so the bundled NIF must be
          # the musl variant; a glibc .so cannot load there.
          case "${{ matrix.target }}" in
            linux_*) export TARGET_ABI=musl ;;
          esac

          # Zig 0.16 uses renameat2 flags that some filesystems reject with EINVAL,
          # which it treats as a programmer bug and aborts on.
          export ZIG_LOCAL_CACHE_DIR="${RUNNER_TEMP}/zig-local"
          export ZIG_GLOBAL_CACHE_DIR="${RUNNER_TEMP}/zig-global"
          mkdir -p "$ZIG_LOCAL_CACHE_DIR" "$ZIG_GLOBAL_CACHE_DIR"

          mix release --overwrite

      - name: Name the artifact
        id: artifact
        shell: bash
        run: |
          version=$(mix run --no-start -e 'IO.write(Mix.Project.config()[:version])')
          name="troupe-${version}-${{ matrix.target }}${{ matrix.ext }}"
          mv "burrito_out/troupe_${{ matrix.target }}${{ matrix.ext }}" "burrito_out/${name}"
          chmod +x "burrito_out/${name}" || true
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the artifact
        shell: bash
        run: |
          set -euo pipefail
          binary="burrito_out/${{ steps.artifact.outputs.name }}"

          "./$binary" --version

          mkdir -p smoke/ws
          cat > smoke/script.json <<'JSON'
          {"steps": [
            {"tools": [{"name": "write_file", "input": {"path": "hello.txt", "content": "packaged\n"}}]},
            {"tools": [{"name": "shell", "input": {"command": "echo shell-ran-ok"}}]},
            {"text": "Both tools worked."}
          ]}
          JSON

          TROUPE_PROVIDER=fake TROUPE_FAKE_SCRIPT="$PWD/smoke/script.json" \
            "./$binary" run "smoke" --headless --workspace smoke/ws --auto-approve

          # write_file went through the tool; shell went through reaper.
          grep -q packaged smoke/ws/hello.txt

          # And the same binary is the daemon: a client run finds or starts one, and
          # `troupe sessions` then lists what it did.
          TROUPE_PROVIDER=fake TROUPE_FAKE_SCRIPT="$PWD/smoke/script.json" \
            "./$binary" sessions --workspace smoke/ws | grep -q "Sessions for\|No sessions" 

      - name: Report size and start-up cost
        shell: bash
        run: |
          binary="burrito_out/${{ steps.artifact.outputs.name }}"
          size=$(wc -c < "$binary")
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- binary size: $((size / 1024 / 1024)) MiB ($size bytes)" >> "$GITHUB_STEP_SUMMARY"

          # The first run pays for extraction; the second is the warm path.
          "./$binary" maintenance uninstall >/dev/null 2>&1 <<< "y" || true
          cold_start=$(date +%s%N)
          "./$binary" --version > /dev/null
          cold_end=$(date +%s%N)
          warm_start=$(date +%s%N)
          "./$binary" --version > /dev/null
          warm_end=$(date +%s%N)

          echo "- cold start: $(( (cold_end - cold_start) / 1000000 )) ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- warm start: $(( (warm_end - warm_start) / 1000000 )) ms" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: burrito_out/${{ steps.artifact.outputs.name }}
          if-no-files-found: error

  containers:
    name: clean-container check (linux x86_64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*-linux_x86_64
          merge-multiple: true
          path: dist

      - name: Run in glibc and musl containers with nothing installed
        run: |
          set -euo pipefail
          binary=$(ls dist/troupe-*-linux_x86_64)
          chmod +x "$binary"
          cp "$binary" ./troupe

          cat > check.sh <<'SH'
          #!/bin/sh
          set -e
          cd /work
          for c in erl elixir mix inotifywait; do
            command -v $c >/dev/null 2>&1 && { echo "$c unexpectedly present"; exit 1; }
          done
          ./troupe --version
          rm -rf ws && mkdir ws
          TROUPE_PROVIDER=fake TROUPE_FAKE_SCRIPT=/work/script.json \
            ./troupe run "smoke" --headless --workspace ws --auto-approve
          grep -q packaged ws/hello.txt
          # Watch mode has to fall back to polling with no inotify-tools installed.
          rm -rf wws && mkdir wws
          TROUPE_PROVIDER=fake TROUPE_FAKE_SCRIPT=/work/script.json \
            ./troupe run "watch" --headless --watch --workspace wws --auto-approve | grep -q "polling for changes"
          SH
          chmod +x check.sh

          cat > script.json <<'JSON'
          {"steps": [
            {"tools": [{"name": "write_file", "input": {"path": "hello.txt", "content": "packaged\n"}}]},
            {"tools": [{"name": "shell", "input": {"command": "echo ok"}}]},
            {"text": "done"}
          ]}
          JSON

          for image in ubuntu:24.04 alpine:latest; do
            echo "=== $image"
            docker run --rm -v "$PWD:/work" "$image" /work/check.sh
          done

  installer-sh:
    name: install.sh (clean ubuntu container, zsh user)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*-linux_x86_64
          merge-multiple: true
          path: dist

      - name: Install, upgrade, reject a corrupt artifact, uninstall
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/troupe-*-linux_x86_64 release/
          (cd release && sha256sum troupe-* > SHA256SUMS)

          docker run --rm -v "$PWD:/src" ubuntu:24.04 /src/scripts/test-install.sh

  installer-ps1:
    name: install.ps1 (windows runner)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*-windows_x86_64.exe
          merge-multiple: true
          path: dist

      - name: Install, upgrade, reject a corrupt artifact, uninstall
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/troupe-*-windows_x86_64.exe release/
          Push-Location release
          Get-ChildItem troupe-* | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS
          Pop-Location

          ./scripts/test-install.ps1 -ReleaseDir release

  release:
    name: publish
    needs: [build, containers, installer-sh, installer-ps1]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum troupe-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/troupe-*
            dist/SHA256SUMS
