# The suite that needs a Kubernetes cluster, on kind, as one job both gates call.
#
# `ci.yml` calls it on a pull request into `main` and in a full run that asks for it (the
# nightly and a release); `dev-check.yml` on a pull request into a `development-*` chunk.
# Either calls it only when the change touches what the cluster runs: the chart and its
# CRDs and admission policy, the operator and its suite, the images, the kind cluster and
# the scripts that bring it up, the plane's migrations, VERSION, and this file.
# `docs/developer/ci.md` has the picture.
#
# Two jobs, side by side: the fresh install and its suite (`kind`), and the release before
# this one upgraded to this one (`upgrade`), which is what a deployment does with every
# release and what nothing else tests.
#
# About twenty-five minutes, most of it building the five images and the suite itself. So
# the CRDs and the admission policy go to the API server first, before anything is built:
# a rule the API server refuses fails the job in a minute, which is the failure a release
# once met ten minutes into this job, and no check before it had.
name: cluster

on:
  workflow_call:

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.5"

jobs:
  kind:
    name: kind, the chart, mix troupe.e2e
    # On Ubuntu 24.04 while the rest is on 26.04: kind and Cilium lean on the kernel more
    # than anything else here, and the trial that moved the rest did not run this.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # `kind` and `kubectl` only; the cluster is `scripts/kind-up`'s. kind-action used to
      # create it from `dev/kind/cluster.yaml` alone, which keeps kind's own CNI — the
      # `disableDefaultCNI` that makes Cilium the only one is appended by `kind-up`. So
      # CI's cluster enforced no NetworkPolicy, and the egress test failed on every run it
      # reached, hidden until now behind the token that expired mid-suite (#47).
      - uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: azure/setup-helm@v5

      # The runner's kernel is the node's, and it is left as Ubuntu 24.04 has it: AppArmor
      # enforced, and unprivileged user namespaces restricted
      # (`kernel.apparmor_restrict_unprivileged_userns=1`), as on an Ubuntu node pool. A
      # worker's bubblewrap builds the sandbox every command on a pod runs in from a user
      # namespace, and the chart's AppArmor profile is what lets it there; `kind-up` gives the
      # nodes the parser their runtime needs to apply one. Said here, so a runner image that
      # changes either shows in the log.
      - name: The runner's kernel, as an Ubuntu node's
        run: |
          echo "kernel $(uname -r)"
          echo "AppArmor enabled: $(cat /sys/module/apparmor/parameters/enabled)"
          echo "$(apparmor_parser --version | head -1)"
          echo "parser.conf: $(grep -v '^#' /etc/apparmor/parser.conf | grep . | tr '\n' ' ')"
          restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)
          echo "kernel.apparmor_restrict_unprivileged_userns=$restrict"
          if [ "$restrict" != 1 ]; then
            echo "the runner does not restrict unprivileged user namespaces, so it proves nothing about a node that does"
            exit 1
          fi

      # What the worker's AppArmor profile does on this kernel, before any cluster: bubblewrap
      # run on the runner itself as its unprivileged user, with a unix socket, unconfined
      # and under the profile as each parser compiles it, the runner's (Ubuntu's) and the
      # one the chart's loader runs (Debian 12's, in the operator image). Says what it
      # found and fails nothing: the cluster below is the proof.
      - name: The worker's AppArmor profile on this kernel, as each parser compiles it
        run: |
          sudo apt-get install -y -qq --no-install-recommends bubblewrap >/dev/null 2>&1 || true
          dir="$RUNNER_TEMP/apparmor"; mkdir -p "$dir"
          named() { sed -E "s/(profile |peer=)troupe-worker([ ,])/\1$1\2/" charts/troupe/files/worker-apparmor; }
          named troupe-worker-ubuntu > "$dir/ubuntu"
          named troupe-worker-debian12 > "$dir/debian12"
          sudo apparmor_parser --replace --skip-cache "$dir/ubuntu" && echo "loaded with the runner's parser"
          docker run --rm --privileged -v /sys/kernel/security:/sys/kernel/security -v "$dir:/p:ro" \
            debian:bookworm-slim sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends apparmor >/dev/null 2>&1 &&
              apparmor_parser --version | head -1 && apparmor_parser --replace --skip-cache /p/debian12' \
            && echo "loaded with Debian 12's parser"
          cat > "$dir/probe.sh" <<'PROBE'
          attr=/proc/self/attr/apparmor/exec; [ -e "$attr" ] || attr=/proc/self/attr/exec
          if [ -n "$1" ]; then echo "exec $1" > "$attr" || echo "could not ask for $1"; fi
          exec /bin/sh -c '
            cat /proc/self/attr/current
            python3 -c "import socket; socket.socketpair(); print(\"unix socket ok\")" 2>&1 | tail -1
            bwrap --die-with-parent --unshare-pid --unshare-ipc --unshare-uts --new-session \
              --proc /proc --dev /dev --tmpfs /tmp --ro-bind /usr /usr --symlink usr/bin /bin \
              --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /bin/cat /proc/1/comm 2>&1'
          PROBE
          for profile in "" troupe-worker-ubuntu troupe-worker-debian12; do
            echo "== ${profile:-unconfined}"
            sh "$dir/probe.sh" "$profile" 2>&1 || true
          done
          sudo dmesg | grep 'apparmor="DENIED"' | grep troupe-worker | tail -20 || true

      - name: A cluster whose CNI enforces policy
        run: scripts/kind-up

      # What the chart's own job cannot see. kubeconform checks a CRD's shape against a
      # schema; only an API server compiles its CEL and says whether it takes a rule. The
      # CRDs are applied, as `remote-up` applies them again later; the admission policy and
      # the TroupePolicy the kind values install go through a server-side dry run, so the
      # chart still installs them as its own. A node with no CNI yet is no matter: this is
      # the API server alone.
      - name: The CRDs and the admission policy, as the API server takes them
        run: |
          kubectl --context kind-troupe-dev apply -f charts/troupe/crds/
          kubectl --context kind-troupe-dev wait --for condition=established --timeout=60s -f charts/troupe/crds/
          helm template troupe charts/troupe --namespace troupe-system --values dev/kind/values.yaml \
              --show-only templates/admission-policy.yaml --show-only templates/policy-default.yaml \
            | kubectl --context kind-troupe-dev apply --dry-run=server -f -

      # The Pod Security level the chart labels its namespace with admits every pod the chart
      # makes there, as the API server's admission says: `restricted` without the DaemonSet
      # that puts the workers' profiles on the nodes, `privileged` with it, whose host mount
      # and root nothing lower admits. A server-side dry run in a namespace labelled as the
      # chart labels `troupe-system` warns of any pod template the level would refuse, and
      # writes nothing.
      - name: The level the chart labels its namespace with admits the chart's own pods
        run: |
          check() {
            want=$1; ns=$2; shift 2
            rendered=$(helm template troupe charts/troupe --namespace "$ns" --set namespace="$ns" \
              --set plane.controlTls.certManager=false --set a2a.enabled=true "$@")
            level=$(grep -m1 'pod-security.kubernetes.io/enforce:' <<<"$rendered" | awk '{print $2}')
            if [ "$level" != "$want" ]; then echo "the chart labels its namespace $level, not $want ($*)"; exit 1; fi
            kubectl --context kind-troupe-dev create namespace "$ns"
            kubectl --context kind-troupe-dev label namespace "$ns" \
              "pod-security.kubernetes.io/enforce=$level" "pod-security.kubernetes.io/warn=$level"
            out=$(kubectl --context kind-troupe-dev apply --dry-run=server -n "$ns" -f - <<<"$rendered" 2>&1 || true)
            kubectl --context kind-troupe-dev delete namespace "$ns" --wait=false
            if grep -q 'violate PodSecurity' <<<"$out"; then
              echo "$level refuses a pod the chart makes:"; grep 'violate PodSecurity' <<<"$out"; exit 1
            fi
            for kind in deployment.apps/troupe-plane deployment.apps/troupe-operator job.batch/troupe-plane-migrate; do
              grep -q "$kind" <<<"$out" || { echo "$kind was not dry-run:"; echo "$out"; exit 1; }
            done
            echo "$level admits every pod the chart makes ($*)"
          }
          check restricted psa-chart-restricted \
            --set worker.seccomp.install.enabled=false --set worker.appArmor.install.enabled=false
          check privileged psa-chart-privileged

      # The WorkerProfile's rule for its model settings, as the API server runs it: a model
      # without llm.endpoint is refused with the rule's plain message, and the same with one
      # is taken. A server-side dry run in the default namespace writes nothing.
      - name: A WorkerProfile's model settings need an endpoint, as the API server says
        run: |
          profile() {
            printf 'apiVersion: troupe.dev/v1alpha1\nkind: WorkerProfile\nmetadata: {name: llm-rule}\n'
            printf 'spec:\n  image: {repository: ghcr.io/it-minds/troupe-worker}\n  llm: %s\n' "$1"
          }
          if refused=$(profile '{provider: gemini, model: gemini-2.5-pro}' \
              | kubectl --context kind-troupe-dev apply --dry-run=server -n default -f - 2>&1); then
            echo "a WorkerProfile with a model and no llm.endpoint was taken"; exit 1
          fi
          if ! grep -q 'llm settings need llm.endpoint' <<<"$refused"; then
            echo "refused, but not by the llm rule:"; echo "$refused"; exit 1
          fi
          profile '{endpoint: "https://llm-gw.example.test/v1", provider: gemini, model: gemini-2.5-pro}' \
            | kubectl --context kind-troupe-dev apply --dry-run=server -n default -f -

      # The same script a developer runs, so that a cluster failure here is reproducible
      # by one command on a laptop. It builds the five images and `kind load`s them,
      # which is why nothing is pushed for this job.
      #
      # The gateway is a public host a runner can reach, and no key: the egress suite dials
      # the dev profile's model endpoint from inside a pod, which needs a host that answers
      # and nothing more. Without one it says it could not test that, and passes.
      - name: Bring up a Troupe
        env:
          TROUPE_GATEWAY_URL: https://api.openai.com/v1
        run: scripts/remote-up

      # Why the workers' AppArmor profile is there, on a kernel that restricts unprivileged
      # user namespaces. The worker image, with the worker container's security context, runs
      # bubblewrap with the sandbox's flags three times: under the runtime's default profile
      # it is refused its mounts ("Failed to make / slave"), unconfined it is refused the
      # namespace's uid map ("setting up uid map"), and under the chart's profile it runs. The
      # suite then runs a session's command in the sandbox on a worker pod.
      - name: Bubblewrap on a worker needs the chart's AppArmor profile here
        run: |
          kc() { kubectl --context kind-troupe-dev "$@"; }
          profile=$(kc get deployment troupe-operator -n troupe-system \
            -o 'jsonpath={.spec.template.spec.containers[0].env[?(@.name=="TROUPE_WORKER_APPARMOR_PROFILE")].value}')
          if [ -z "$profile" ]; then
            echo "remote-up gave the workers no AppArmor profile: the kind node's runtime applies none"
            exit 1
          fi
          check=troupe-apparmor-check
          kc create namespace "$check"
          trap 'kc delete namespace "$check" --wait=false' EXIT
          probe='cat /proc/self/attr/current;
            exec bwrap --die-with-parent --unshare-pid --unshare-ipc --unshare-uts --new-session \
              --proc /proc --dev /dev --tmpfs /tmp --ro-bind /usr /usr --ro-bind /bin /bin \
              --ro-bind /lib /lib --ro-bind /lib64 /lib64 -- /bin/cat /proc/1/comm'
          # A pod named $1 whose worker container wears the AppArmor profile $2 (nothing for
          # the runtime's default); prints what it said, and its phase last.
          run() {
            kc apply -f - <<YAML >/dev/null
          apiVersion: v1
          kind: Pod
          metadata: {name: $1, namespace: $check}
          spec:
            hostUsers: false
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: Unconfined}}
            containers:
              - name: worker
                image: ghcr.io/it-minds/troupe-worker:dev
                imagePullPolicy: Never
                command: ["/bin/sh", "-c", $(jq -Rn --arg p "$probe" '$p')]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: ["ALL"]}
                  procMount: Unmasked
                  ${2:+appArmorProfile: $2}
          YAML
            phase=""
            for _ in $(seq 1 90); do
              phase=$(kc get pod "$1" -n "$check" -o 'jsonpath={.status.phase}')
              case "$phase" in Succeeded|Failed) break ;; esac
              sleep 2
            done
            kc logs "$1" -n "$check" 2>&1 || kc describe pod "$1" -n "$check"
            echo "$phase"
          }
          default=$(run runtime-default "")
          echo "== the runtime's default profile:"; echo "$default"
          unconfined=$(run unconfined "{type: Unconfined}")
          echo "== unconfined:"; echo "$unconfined"
          chart=$(run chart-profile "{type: Localhost, localhostProfile: $profile}")
          echo "== $profile:"; echo "$chart"
          failed=0
          if [ "$(tail -1 <<<"$default")" != Failed ] || ! grep -q '^bwrap: ' <<<"$default"; then
            echo "bubblewrap was not refused under the runtime's default profile: the node applies no AppArmor default, and this proves nothing"
            failed=1
          fi
          if [ "$(tail -1 <<<"$unconfined")" != Failed ] || ! grep -q '^bwrap: ' <<<"$unconfined"; then
            echo "bubblewrap was not refused unconfined: the kernel does not restrict unprivileged user namespaces, and this proves nothing"
            failed=1
          fi
          if [ "$(tail -1 <<<"$chart")" != Succeeded ] || ! grep -qx 'bwrap' <<<"$chart"; then
            echo "bubblewrap did not run its command under $profile"
            failed=1
          fi
          exit "$failed"

      # Something answering at the cloud metadata address, where a pod reaches it as it
      # would a cloud's: out through its node, to a host that answers there. Without it a
      # worker's refused connection would say nothing, since nothing would answer anyway;
      # the egress suite checks that a pod under no policy reaches this before it believes
      # the worker's refusal. On the runner, not in the cluster: an address on the node
      # itself is the node's to Cilium, and no egress rule speaks of the node.
      - name: A stand-in for a cloud's metadata service
        run: |
          sudo ip address add 169.254.169.254/32 dev lo
          mkdir -p "$RUNNER_TEMP/metadata"
          echo "a stand-in for a cloud's metadata service" > "$RUNNER_TEMP/metadata/index.html"
          sudo nohup python3 -m http.server 80 --bind 169.254.169.254 \
            --directory "$RUNNER_TEMP/metadata" > "$RUNNER_TEMP/metadata.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://169.254.169.254/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "nothing answers at 169.254.169.254:80 on the runner"
          cat "$RUNNER_TEMP/metadata.log"
          exit 1

      # Its own key, not the umbrella jobs': this runner image is not theirs, and a NIF
      # built on one image is not one to load on another.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-cluster-24.04-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-cluster-24.04-mix-

      - run: mix deps.get

      - name: The cluster suite
        env:
          # The step above put a stand-in at the metadata address, so the suite fails
          # rather than skips the connection it cannot otherwise make.
          TROUPE_E2E_METADATA_STAND_IN: "1"
        run: mix troupe.e2e

      # A cluster failure that produces only an exit code is a failure nobody will
      # diagnose. These are the two logs that say what happened.
      - name: Logs, on failure
        if: failure()
        run: |
          mkdir -p cluster-logs
          # Enough of the plane's log to reach the pod deletion the suite made a few minutes
          # earlier: at its debug level 2,000 lines was ten seconds of SQL.
          kubectl logs -n troupe-system deployment/troupe-plane --tail=100000 > cluster-logs/plane.log 2>&1 || true
          kubectl logs -n troupe-system deployment/troupe-operator --tail=20000 > cluster-logs/operator.log 2>&1 || true
          kubectl get pods -A -o wide > cluster-logs/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > cluster-logs/events.txt 2>&1 || true
          # The runner's kernel is the nodes', so what AppArmor refused anywhere in the
          # cluster is in its log.
          sudo dmesg | grep 'apparmor=' | tail -500 > cluster-logs/apparmor.txt 2>&1 || true
          kubectl logs -n troupe-system daemonset/troupe-worker-profiles --all-containers \
            > cluster-logs/worker-profiles.log 2>&1 || true
          kubectl logs -n ingress-nginx deployment/ingress-nginx-controller \
            > cluster-logs/ingress.log 2>&1 || true
          kubectl logs -n ingress-nginx deployment/ingress-nginx-controller --previous \
            >> cluster-logs/ingress.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cluster-logs
          path: cluster-logs/

  # The release before this one, from the registry, upgraded to this tree: its chart, its
  # CRDs and its images on a cluster of its own, an organisation seeded through the
  # protocol, then this tree's CRDs and `helm upgrade` and nothing else, and every seeded
  # thing asked for again (`scripts/kind-upgrade-check`, which a developer runs the same
  # way). Beside the fresh install rather than after it: each builds the images and brings
  # a cluster up, and one after the other would be an hour.
  upgrade:
    name: kind, the previous release upgraded to this one
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: azure/setup-helm@v5

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-cluster-24.04-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-cluster-24.04-mix-

      - run: mix deps.get

      # Compiled before the cluster is, so the seed does not spend the cluster's time on it.
      - run: MIX_ENV=test mix compile

      # The previous release is the newest tag at or below VERSION that is not this commit;
      # the script says which, and the log names it.
      - name: Upgrade the previous release to this one
        run: scripts/kind-upgrade-check

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: upgrade-logs
          path: .e2e/upgrade/logs/
