# The light check for a pull request that is not into `main`: one issue of a chunked run
# into its `development-*` branch (docs/developer/fixing-issues.md), or one stacked on
# another pull request's branch.
#
# It catches what breaks the chunk for the next fixer. That means code that does not
# compile, a credo failure, a protocol schema nobody regenerated, a client that no longer
# builds, a decision file that does not hold. It runs no test suite: the fixer ran the tests on its own machine, and
# `ci.yml` runs the whole gate once, on the chunk's pull request into `main`, with every
# issue of the run together. That is what `main` is protected by.
#
# But two: the suite that needs a cluster (`cluster.yml`), for a change to what it deploys.
# A fixer's machine may have no cluster to run it on, and a CRD rule the API server refuses
# is found by nothing short of an API server. And the credential stores (`keyring.yml`),
# for a change to the code that keeps a secret in one: a fixer's Windows machine has no
# macOS keychain or Secret Service to run the round trip against.
name: dev-check

# Every pull request that is not into `main`: into a chunk, or stacked on another branch.
on:
  pull_request:
    branches-ignore: [main]

concurrency:
  group: dev-check-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.5"
  ZIG_VERSION: "0.16.0"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      elixir: ${{ steps.filter.outputs.elixir }}
      protocol: ${{ steps.filter.outputs.protocol }}
      tui: ${{ steps.filter.outputs.tui }}
      gui: ${{ steps.filter.outputs.gui }}
      vscode: ${{ steps.filter.outputs.vscode }}
      cluster: ${{ steps.filter.outputs.cluster }}
      keyring: ${{ steps.filter.outputs.keyring }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            elixir:
              - apps/**
              - config/**
              - mix.exs
              - mix.lock
              - .credo.exs
              - protocol/**
              - docs/user/configuration.md
            protocol:
              - apps/troupe_protocol/**
              - apps/troupe_gateway/**
              - protocol/**
            tui:
              - clients/tui/**
              - apps/troupe_core/**
              - apps/troupe_gateway/**
              - apps/troupe_protocol/**
              - docs/user/cli-reference.md
            gui:
              - clients/gui/**
              - protocol/**
            vscode:
              - clients/vscode/**
            # The same list as `ci.yml`'s: what the cluster suite deploys or is.
            cluster:
              - charts/**
              - docker/**
              - dev/kind/**
              - scripts/kind-up
              - scripts/remote-up
              - scripts/build-images
              - scripts/kind-upgrade-check
              - apps/troupe_operator/**
              - .github/workflows/cluster.yml
              # What the upgrade from the previous release runs: the plane's migrations, and the
              # version, which a release commit changes.
              - apps/troupe_plane/priv/repo/migrations/**
              - VERSION
              # The images it builds: the GUI's, and what every image build's context leaves out.
              - clients/gui/Dockerfile
              - .dockerignore
            # The same list as `ci.yml`'s: the code that keeps a secret in the OS's store.
            keyring:
              - apps/troupe_protocol/lib/troupe/keyring.ex
              - apps/troupe_protocol/lib/troupe/keyring/**
              - apps/troupe_protocol/test/troupe/keyring_test.exs
              - clients/gui/apps/desktop/src-tauri/src/secrets.rs
              - .github/workflows/keyring.yml

  elixir:
    name: umbrella - compile, credo, schema
    needs: [changes]
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # The same cache `ci.yml` fills on `main`, so an unchanged app is not rebuilt.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --warnings-as-errors
      - run: mix credo --strict
      # Which app, and which part of the plane, may call which. Read from the beams the
      # compile above made, so it costs a second, and a panel page that reaches past the
      # admin API is found here rather than on the chunk's pull request into `main`.
      - name: Every app and the panel keep to their boundaries
        run: MIX_ENV=test mix troupe.boundaries
      # As `ci.yml` checks it, so a file left unformatted is found here and not on the
      # chunk's pull request into `main`.
      - name: The umbrella is formatted
        run: mix format --check-formatted
      # `protocol/schema/config/v1.json` and the key reference in
      # docs/user/configuration.md, both generated from Troupe.Config.Schema.
      - name: The committed config schema and its reference are current
        run: MIX_ENV=test mix troupe.config.schema --check
      - name: The committed protocol schema is compatible and current
        if: needs.changes.outputs.protocol == 'true'
        run: |
          mix troupe.schema.diff
          mix troupe.schema.gen
          git diff --exit-code protocol/schema/v1 \
            || { echo "protocol/schema/v1 is stale: run mix troupe.schema.gen and commit"; exit 1; }

  # A chunk's pull requests are where decisions are added, a file each (Decision 790): its
  # front matter, a number used once, and every `paths` glob matching something. Whatever
  # changed, because a file that moves breaks a glob; a bare `elixir`, nothing compiled.
  decisions:
    name: the decisions - front matter and paths
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the chunk's tip, for the citation check.
          fetch-depth: 2
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Every decision is well formed and governs paths that exist
        run: >-
          elixir -r apps/troupe_protocol/lib/mix/tasks/troupe.decisions.ex
          -e 'Mix.Tasks.Troupe.Decisions.run(System.argv())' -- --check
      # The other side of a decision naming its paths: code names no decision. A
      # change that adds a decision number to code fails, in any part of the repository.
      - name: No change adds a decision number to code
        run: elixir scripts/decision-citations.exs --base HEAD^1

  tui:
    name: the TUI - compile
    needs: [changes]
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/tui
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            clients/tui/deps
            clients/tui/_build
          key: ${{ runner.os }}-tui-${{ hashFiles('clients/tui/mix.lock', 'mix.lock') }}
          restore-keys: ${{ runner.os }}-tui-
      - name: The two Mix locks agree
        working-directory: .
        run: elixir scripts/locks-agree.exs
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      # docs/user/cli-reference.md, generated from the command-line table and the
      # harness's command table, which a change to either leaves stale.
      - name: The committed command reference is current
        run: mix troupe.cli.reference --check

  gui:
    name: the GUI - build and typecheck
    needs: [changes]
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/gui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/gui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `build` typechecks the desktop app against the freshly built protocol client.
      - run: pnpm build

  # The `.vsix` it builds is the run's artifact, so a pull request's extension can be
  # installed and tried before it is merged.
  vscode:
    name: the VS Code extension - typecheck and package
    needs: [changes]
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/vscode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        with:
          name: troupe-vscode
          path: clients/vscode/troupe.vsix
          if-no-files-found: error

  # The suite that needs a cluster, about twenty-five minutes, when the change touches what
  # it deploys: the chart and its CRDs and admission policy, the operator, the images, the
  # kind cluster. After the compile, so code that does not build spends no cluster.
  cluster:
    name: the suite that needs a cluster
    needs: [changes, elixir]
    if: ${{ !cancelled() && needs.changes.outputs.cluster == 'true' && contains(fromJSON('["success", "skipped"]'), needs.elixir.result) }}
    uses: ./.github/workflows/cluster.yml
    permissions:
      contents: read

  # A real macOS keychain and a real Secret Service, when the change touches the code that
  # keeps a secret in one. After the compile, as the cluster is.
  keyring:
    name: the credential stores
    needs: [changes, elixir]
    if: ${{ !cancelled() && needs.changes.outputs.keyring == 'true' && contains(fromJSON('["success", "skipped"]'), needs.elixir.result) }}
    uses: ./.github/workflows/keyring.yml
    permissions:
      contents: read

  dev-ok:
    name: dev-ok
    if: always()
    needs: [changes, elixir, decisions, tui, gui, vscode, cluster, keyring]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.elixir.result }}" "${{ needs.decisions.result }}" "${{ needs.tui.result }}" "${{ needs.gui.result }}" "${{ needs.vscode.result }}" "${{ needs.cluster.result }}" "${{ needs.keyring.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job ended $r"; exit 1 ;; esac
          done
