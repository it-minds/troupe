# The five container images, built from one commit and pushed to `ghcr.io/<owner>` as
# `sha-<short>` — and, when a caller names one, as a version too.
#
# One definition for the three callers that need images: `ci.yml` on every push to `main`
# (so every merged commit is pullable by a name that can only mean one build),
# `prerelease.yml` (a version like `0.3.1-pre.7`, untested), and `release.yml` (the
# version, after the full suite). See `docs/developer/ci.md`.
#
# The workflow's own token pushes them, and nothing else can: no registry is configured
# and no credential is held (Decision 735). A deployment that wants its own registry
# copies the images from here.
name: images

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Also tag every image with this version, and build with it written into VERSION so
          the plane reports it at /.well-known/troupe. Empty: `sha-<short>` only, built with
          VERSION as committed.
        type: string
        default: ""
      ref:
        description: The commit to build; empty is the caller's.
        type: string
        default: ""

jobs:
  image:
    name: image ${{ matrix.image }}
    runs-on: ubuntu-26.04
    # Under a minute from the cache and a few without it; a build that hangs fails here
    # rather than holding a release (Decision 796).
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: troupe-operator, release: troupe_operator, context: ., file: docker/Dockerfile}
          - {image: troupe-plane, release: troupe_plane, context: ., file: docker/Dockerfile}
          - {image: troupe-worker, release: troupe_worker, context: ., file: docker/Dockerfile}
          - {image: troupe-a2a, release: troupe_a2a, context: ., file: docker/Dockerfile}
          # The GUI is built from its own directory, which is also the proof that nothing
          # in it reaches into the rest of the repository - bar LICENSE, NOTICE,
          # THIRD-PARTY-NOTICES.txt and PROTOCOL.md at the root, which it reads as the
          # `licences` context.
          - {image: troupe-gui, release: "", context: clients/gui, file: clients/gui/Dockerfile, contexts: licences=.}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # `ghcr.io/<owner>/troupe-<name>`: `it-minds` here, and a fork's own owner there,
      # since the workflow's token can push to its own owner's packages and nowhere else.
      - name: Name the image and its tags
        id: image
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ inputs.version }}
        run: |
          # Registries want lower case, and a GitHub owner need not be.
          image=$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse --short=7 HEAD)
          tags="${image}:sha-${sha}"
          [ -z "${VERSION}" ] || tags="${tags},${image}:${VERSION}"

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "- \`${tags//,/\`, \`}\`" >> "$GITHUB_STEP_SUMMARY"

      # A pre-release is the committed code under a version VERSION does not say. Written
      # into the build context, so the release inside the image reports it.
      - name: Build as ${{ inputs.version }}
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" > VERSION

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # linux/amd64 only: an arm64 build of the umbrella under emulation is an hour nobody
      # has asked for. The four server images share every layer up to `mix release`, so
      # one cache serves them.
      #
      # `BUILD_COMMIT` and `BUILD_TIME` are what the plane reports at `/.well-known/troupe`,
      # which is how a deploy proves it is running what it rolled. `TROUPE_GUI_BASE` is
      # baked into the GUI's asset URLs and must match the chart's `gui.basePath`; the
      # `GUI_BASE` variable changes both for a deployment that mounts it elsewhere.
      #
      # The source label links each package to this repository on ghcr.io from its first
      # push, so the package page shows where it came from and this repository's
      # workflows keep write access to it.
      - uses: docker/build-push-action@v7
        # No build-record artifact: nothing reads them, and a release's attach step
        # downloads the run's artifacts.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.contexts }}
          build-args: |
            RELEASE=${{ matrix.release }}
            BUILD_COMMIT=${{ steps.image.outputs.commit }}
            BUILD_TIME=${{ steps.image.outputs.built_at }}
            TROUPE_GUI_BASE=${{ vars.GUI_BASE || 'app' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.commit }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
