# The licences of what this repository depends on, on every pull request.
#
# Troupe is Apache-2.0, and a copyleft dependency - GPL, AGPL, LGPL, SSPL - arrives as a
# line in a lock file that nobody reads. `scripts/licences.exs --check` reads every
# package the two Mix locks, the GUI's pnpm workspace and the desktop app's Cargo.lock
# name, refuses any licence its policy does not allow unless a person has recorded a
# reviewed exception, and fails when `docs/third-party-licences.md`, the licence texts in
# `THIRD-PARTY-NOTICES.txt` (which every release artifact carries) or the chart's copies
# of LICENSE and NOTICE are no longer what the locks and the root say. The policy and how
# to record an exception are at the top of the script.
#
# Every pull request, into `main`, a `development-*` chunk or anything else, and no path
# filter: a workflow skipped by `paths:` leaves its check pending, and the answer is one
# job of a couple of minutes.
name: licences

on:
  pull_request:

concurrency:
  group: licences-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.5"

jobs:
  licences:
    name: third-party licences
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/gui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/gui/pnpm-lock.yaml
      # Fetching is all it needs: the licences are in the packages' own metadata.
      - run: mix deps.get
      - run: mix deps.get
        working-directory: clients/tui
      # `cargo metadata` fetches every locked crate to read its manifest: the desktop app's,
      # and those of the TUI's NIF, whose Cargo.lock `ex_ratatui` has just brought. The
      # runner has Rust; this keeps it from downloading the same crates on every run.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: ${{ runner.os }}-licences-cargo-${{ hashFiles('clients/gui/apps/desktop/src-tauri/Cargo.lock', 'clients/tui/deps/ex_ratatui/native/ex_ratatui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-licences-cargo-
      - run: pnpm install --frozen-lockfile
        working-directory: clients/gui
      - run: elixir scripts/licences.exs --check
