# The builds that run on somebody's machine rather than in a cluster: `troupe-daemon` and
# `troupe` (the TUI) for five platforms each, and the desktop app's installers for three.
#
# One native runner per target. A Mix release carries the build host's ERTS, the TUI's
# precompiled ExRatatui NIF resolves against the build host, and the desktop app links
# the platform's webview — none of it cross-builds. So this is slow and wide, and it runs
# when it proves something: on a pull request into `main` that touches one of them
# (called from `ci.yml`, under `ci-ok`, without the macOS targets, which cost about ten
# Linux runners each), nightly (`nightly.yml`), for a pre-release (`prerelease.yml`)
# and for a release (`release.yml`) — those two with a tag, and then it attaches
# everything to that draft release. See `docs/developer/ci.md`.
#
# `workflow_dispatch` runs it by hand, attaching nothing.
#
# OS code signing is the `sign` input's (docs/developer/code-signing.md, section 6). Empty,
# as every caller but two leaves it, nothing is signed and no secret is read. `release`,
# which `release.yml` alone passes, runs the macOS and Windows builds in the `release`
# environment, whose secrets reach only a job that names it, and signs every executable
# and library each artifact unpacks, the artifact itself, and on macOS notarises them;
# where a platform's secrets are absent it builds unsigned and the summary says so.
# `self-signed`, which `signing.yml` passes, is the test of all that: the same steps on
# one macOS and the Windows target, with a certificate made in the job and stand-ins for
# Apple's and Microsoft's services. Signing happens before anything is uploaded, so the
# manifest `release.yml` writes and the release key signs is over the OS-signed files.
name: native builds

on:
  workflow_call:
    inputs:
      tag:
        description: "The draft release to attach the artifacts to; empty attaches nothing"
        type: string
        default: ""
      version:
        description: >-
          Build the daemon and the TUI as this version (written into VERSION first), for a
          pre-release. Empty builds VERSION as committed. The desktop app keeps VERSION's
          number: an MSI version must be numeric, so `0.3.1-pre.7` is not one.
        type: string
        default: ""
      ref:
        description: The commit to build; empty is the caller's.
        type: string
        default: ""
      macos:
        description: >-
          Build the macOS targets too. A release, a pre-release and the nightly do; a pull
          request does not, because a macOS runner costs about ten Linux ones.
        type: boolean
        default: true
      sign:
        description: >-
          OS code signing: empty signs nothing and reads no secret; `release` signs with
          the `release` environment's secrets where they are set (release.yml); `self-signed`
          signs with a certificate made in the job, macOS and Windows targets only
          (signing.yml).
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      macos:
        description: Build the macOS targets too
        type: boolean
        default: true

env:
  # The patch level, the same one `.tool-versions` and `ci.yml` pin, and not `28.5`:
  # Burrito fetches a precompiled ERTS for the target from its mirror at exactly the
  # running OTP's version, and the mirror lags OTP's patch releases by days. On the
  # morning 28.5.0.7 was published, `28.5` resolved to it, the mirror had no macOS build
  # of it yet, and every macOS build of the 0.3.2 release failed with a 404.
  OTP_VERSION: "28.5.0.5"
  ELIXIR_VERSION: "1.20.4"
  ZIG_VERSION: "0.16.0"

jobs:
  # -- which targets --------------------------------------------------------------
  #
  # Every matrix below is read from here, because a matrix of `include:` entries cannot
  # drop some of them on a condition: `exclude:` does not apply to them. Without
  # `macos`, the macOS rows are filtered out before any runner starts.
  targets:
    name: which targets
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      daemon: ${{ steps.pick.outputs.daemon }}
      tui: ${{ steps.pick.outputs.tui }}
      desktop: ${{ steps.pick.outputs.desktop }}
    steps:
      - id: pick
        env:
          MACOS: ${{ inputs.macos }}
          SIGN: ${{ inputs.sign }}
          # `timeout` is each target's own, about three times what its build takes (Decision
          # 796): a runner that hangs fails the build in minutes rather than holding a
          # release for GitHub's six hours, and a target slow by nature is not cut short.
          DAEMON: >-
            [{"os": "ubuntu-24.04", "target": "linux_x86_64", "timeout": 10},
             {"os": "ubuntu-24.04-arm", "target": "linux_aarch64", "timeout": 10},
             {"os": "macos-15-intel", "target": "macos_x86_64", "timeout": 25},
             {"os": "macos-14", "target": "macos_aarch64", "timeout": 10},
             {"os": "windows-2022", "target": "windows_x86_64", "timeout": 15}]
          TUI: >-
            [{"os": "ubuntu-24.04", "target": "linux_x86_64", "target_abi": "musl", "timeout": 20},
             {"os": "ubuntu-24.04-arm", "target": "linux_aarch64", "target_abi": "musl", "timeout": 15},
             {"os": "macos-15-intel", "target": "macos_x86_64", "timeout": 40},
             {"os": "macos-14", "target": "macos_aarch64", "timeout": 20},
             {"os": "windows-2022", "target": "windows_x86_64", "timeout": 25}]
          # Linux on 22.04 is the glibc floor: the oldest Ubuntu that carries
          # libwebkit2gtk-4.1-dev. Building on 24.04 raises the required glibc and
          # silently breaks every 22.04 user. Do not "modernise" it.
          DESKTOP: >-
            [{"name": "macOS (universal)", "os": "macos-14", "target": "universal-apple-darwin",
              "rust-targets": "aarch64-apple-darwin,x86_64-apple-darwin", "timeout": 30},
             {"name": "Windows (x64)", "os": "windows-latest", "target": "x86_64-pc-windows-msvc",
              "rust-targets": "x86_64-pc-windows-msvc", "timeout": 20},
             {"name": "Linux (x64)", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu",
              "rust-targets": "x86_64-unknown-linux-gnu", "timeout": 20}]
        # `macos` is empty when nothing passed it, which means the default: build it. The
        # signing test signs what has a signature to add, on one Mac and on Windows.
        run: |
          if [ "$SIGN" = self-signed ]; then
            pick() { jq -c 'map(select(.os == "macos-14" or (.os | startswith("windows"))))'; }
          elif [ "$MACOS" = false ]; then
            pick() { jq -c 'map(select(.os | startswith("macos") | not))'; }
          else
            pick() { jq -c .; }
          fi
          {
            echo "daemon=$(pick <<<"$DAEMON")"
            echo "tui=$(pick <<<"$TUI")"
            echo "desktop=$(pick <<<"$DESKTOP")"
          } >> "$GITHUB_OUTPUT"

  # -- which builds are signed ----------------------------------------------------
  #
  # Per platform: none, unsigned (a release whose secrets are absent), release or
  # self-signed. For a release, in the `release` environment, so that it sees which of
  # the environment's secrets are set; it hands on whether each is, never a value.
  signing:
    name: which builds are signed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: ${{ inputs.sign == 'release' && 'release' || '' }}
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      macos_reason: ${{ steps.plan.outputs.macos_reason }}
      windows_reason: ${{ steps.plan.outputs.windows_reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: plan
        env:
          SIGN: ${{ inputs.sign }}
          SET_APPLE_CERTIFICATE: ${{ inputs.sign == 'release' && secrets.APPLE_CERTIFICATE != '' }}
          SET_APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign == 'release' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          SET_APPLE_SIGNING_IDENTITY: ${{ inputs.sign == 'release' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          SET_APPLE_API_ISSUER: ${{ inputs.sign == 'release' && secrets.APPLE_API_ISSUER != '' }}
          SET_APPLE_API_KEY: ${{ inputs.sign == 'release' && secrets.APPLE_API_KEY != '' }}
          SET_APPLE_API_PRIVATE_KEY: ${{ inputs.sign == 'release' && secrets.APPLE_API_PRIVATE_KEY != '' }}
          SET_AZURE_ENDPOINT: ${{ inputs.sign == 'release' && secrets.AZURE_ENDPOINT != '' }}
          SET_AZURE_CODE_SIGNING_NAME: ${{ inputs.sign == 'release' && secrets.AZURE_CODE_SIGNING_NAME != '' }}
          SET_AZURE_CERT_PROFILE_NAME: ${{ inputs.sign == 'release' && secrets.AZURE_CERT_PROFILE_NAME != '' }}
          SET_AZURE_TENANT_ID: ${{ inputs.sign == 'release' && secrets.AZURE_TENANT_ID != '' }}
          SET_AZURE_CLIENT_ID: ${{ inputs.sign == 'release' && secrets.AZURE_CLIENT_ID != '' }}
          SET_AZURE_CLIENT_SECRET: ${{ inputs.sign == 'release' && secrets.AZURE_CLIENT_SECRET != '' }}
        run: sh scripts/signing/ci.sh plan "$SIGN"

  # -- troupe-daemon ------------------------------------------------------------
  daemon:
    name: troupe-daemon ${{ matrix.target }}
    needs: [targets, signing]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # The release environment for a signed release's macOS and Windows builds alone: its
    # secrets reach only a job that names it, and it takes jobs from `main` only, so a
    # pre-release from a branch and the nightly never ask for it.
    environment: ${{ inputs.sign == 'release' && !startsWith(matrix.os, 'ubuntu') && 'release' || '' }}
    env:
      MIX_ENV: prod
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.daemon) }}
    defaults:
      run:
        shell: bash
        # Built from its own directory, so the runner compiles the harness and not the
        # plane's database and Kubernetes clients (Decision 667).
        working-directory: apps/troupe_daemon
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A pre-release's number, written where the Mix projects read their version.
      - name: Build as ${{ inputs.version }}
        if: inputs.version != ''
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" > VERSION

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: mix deps.get

      # -- OS signing (docs/developer/code-signing.md, section 6); the same five steps in
      # the `tui` job. Nothing here runs when `sign` is empty.
      - name: Is this build signed
        id: sign
        working-directory: .
        env:
          SIGN: ${{ inputs.sign }}
          MACOS: ${{ needs.signing.outputs.macos }}
          WINDOWS: ${{ needs.signing.outputs.windows }}
          MACOS_REASON: ${{ needs.signing.outputs.macos_reason }}
          WINDOWS_REASON: ${{ needs.signing.outputs.windows_reason }}
        run: sh scripts/signing/ci.sh job "troupe-daemon ${{ matrix.target }}"

      - name: A keychain with the signing identity (macOS)
        id: keychain
        if: runner.os == 'macOS' && steps.sign.outputs.signs == 'true'
        working-directory: .
        env:
          MODE: ${{ steps.sign.outputs.mode }}
          APPLE_CERTIFICATE: ${{ steps.sign.outputs.mode == 'release' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.sign.outputs.mode == 'release' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.sign.outputs.mode == 'release' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: sh scripts/signing/macos-keychain.sh "$MODE"

      - name: The signing tool (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.mode == 'release'
        run: cargo install artifact-signing-cli --locked

      - name: A self-signed certificate, trusted on this runner only (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.mode == 'self-signed'
        working-directory: .
        shell: pwsh
        run: ./scripts/signing/test-certificate.ps1 -Trust

      - name: What signs
        if: steps.sign.outputs.signs == 'true'
        working-directory: .
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          AUTHORITY: ${{ steps.keychain.outputs.authority }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: sh scripts/signing/ci.sh env "${{ steps.sign.outputs.mode }}"

      - name: Build the release
        if: steps.sign.outputs.signs != 'true'
        run: mix release troupe_daemon --overwrite

      # Every executable and library signed as the release is assembled, before `:tar`
      # packs it (Troupe.Release.OSSigning), so the archive holds the signed files.
      - name: Build the release, signed
        if: steps.sign.outputs.signs == 'true'
        env:
          AZURE_ENDPOINT: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_ENDPOINT || '' }}
          AZURE_CODE_SIGNING_NAME: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CODE_SIGNING_NAME || '' }}
          AZURE_CERT_PROFILE_NAME: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CERT_PROFILE_NAME || '' }}
          AZURE_TENANT_ID: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: mix release troupe_daemon --overwrite

      - name: Name the artifact
        id: art
        run: |
          VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")
          NAME="troupe-daemon-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$GITHUB_WORKSPACE/_build/prod/troupe_daemon-${VERSION}.tar.gz" "$GITHUB_WORKSPACE/dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # Every Mach-O in the release, registered with Apple: a tree of programs cannot have
      # a ticket stapled to it, so Gatekeeper looks it up online.
      - name: Notarise (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.mode == 'release'
        working-directory: .
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TROUPE_SIGN_LABEL: ${{ steps.art.outputs.name }}
        run: |
          tree=$(mktemp -d)/troupe-daemon
          mkdir -p "$tree" && tar -xzf "dist/${{ steps.art.outputs.name }}" -C "$tree"
          sh scripts/signing/notarize-macos.sh "$tree"

      - name: "Smoke test (unpack; version, status, run, status, eval)"
        if: runner.os != 'Windows'
        env:
          TROUPE_PROVIDER: fake
          TROUPE_DAEMON_LOG: stderr
          TROUPE_DAEMON_IDLE_MINUTES: "1"
        run: |
          INST=$(mktemp -d); tar -xzf "$GITHUB_WORKSPACE/dist/${{ steps.art.outputs.name }}" -C "$INST"
          BIN="$INST/bin/troupe-daemon"
          ls "$INST"/lib/troupe_core-*/priv/reaper/
          ls "$INST"/LICENSE "$INST"/NOTICE "$INST"/THIRD-PARTY-NOTICES.txt
          "$BIN" version
          "$BIN" status && exit 1 || echo "not running, as expected"
          "$BIN" run &
          for i in $(seq 1 60); do "$BIN" status >/dev/null 2>&1 && break; sleep 1; done
          "$BIN" status
          "$BIN" run   # idempotent: names the running one and exits 0
          "$INST/bin/troupe_daemon" eval 'IO.puts(Troupe.Version.version())'
          kill %1 || true

      - name: "Smoke test (Windows: unpack, version, status, eval)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TROUPE_PROVIDER: fake
          TROUPE_DAEMON_LOG: stderr
        run: |
          $inst = Join-Path $env:RUNNER_TEMP "troupe-daemon"
          New-Item -ItemType Directory -Force $inst | Out-Null
          tar -xzf "$env:GITHUB_WORKSPACE/dist/${{ steps.art.outputs.name }}" -C $inst
          Get-ChildItem "$inst\lib\troupe_core-*\priv\reaper"
          Get-ChildItem "$inst\lib\ezstd-*\priv"
          Get-Item "$inst\LICENSE", "$inst\NOTICE", "$inst\THIRD-PARTY-NOTICES.txt"
          & "$inst\bin\troupe-daemon.cmd" version
          & "$inst\bin\troupe-daemon.cmd" status
          if ($LASTEXITCODE -ne 1) { throw "status should say not running (exit 1), got $LASTEXITCODE" }
          & "$inst\bin\troupe_daemon.bat" eval "b = :binary.list_to_bin(List.duplicate(0, 1000)); true = :ezstd.decompress(:ezstd.compress(b)) == b; IO.puts(:zstd_ok)"
          if ($LASTEXITCODE -ne 0) { throw "eval failed with $LASTEXITCODE" }

      # What a person unpacks, not what was signed before it was packed: every executable
      # and library in the archive carries the signature, counted in the summary.
      - name: Every executable and library in the archive is signed (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.signs == 'true'
        working-directory: .
        env:
          TROUPE_SIGN_LABEL: ${{ steps.art.outputs.name }}
        run: |
          tree=$(mktemp -d)
          tar -xzf "dist/${{ steps.art.outputs.name }}" -C "$tree"
          sh scripts/signing/sign-macos.sh --verify "$tree"

      - name: Every executable and library in the archive is signed (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.signs == 'true'
        working-directory: .
        shell: pwsh
        env:
          TROUPE_SIGN_LABEL: ${{ steps.art.outputs.name }}
        run: |
          $tree = Join-Path $env:RUNNER_TEMP "signed-daemon"
          New-Item -ItemType Directory -Force $tree | Out-Null
          tar -xzf "dist/${{ steps.art.outputs.name }}" -C $tree
          ./scripts/signing/sign-windows.ps1 -Verify $tree

      - name: Record what was signed
        if: steps.sign.outputs.signs == 'true'
        working-directory: .
        run: sh scripts/signing/ci.sh record "dist/${{ steps.art.outputs.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.art.outputs.name }}
          path: dist/${{ steps.art.outputs.name }}

      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.signs == 'true'
        with:
          name: os-signed-${{ steps.art.outputs.name }}
          path: ${{ runner.temp }}/os-signed/records.txt

      - name: Remove the keychain
        if: always() && steps.keychain.outcome == 'success'
        working-directory: .
        run: sh scripts/signing/macos-keychain.sh delete

  # -- troupe (the TUI) ---------------------------------------------------------
  tui:
    name: troupe ${{ matrix.target }}
    needs: [targets, signing]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    environment: ${{ inputs.sign == 'release' && !startsWith(matrix.os, 'ubuntu') && 'release' || '' }}
    env:
      MIX_ENV: prod
      TROUPE_REAPER_TARGETS: all
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.tui) }}
    defaults:
      run:
        shell: bash
        working-directory: clients/tui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A pre-release's number, written where the Mix projects read their version.
      - name: Build as ${{ inputs.version }}
        if: inputs.version != ''
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" > VERSION

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install xz and 7z
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full; fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then brew install xz p7zip || true; fi

      # The harness is a path dependency on the umbrella beside it; nothing is fetched
      # from anywhere private.
      - run: mix deps.get

      # -- OS signing: the same five steps as the `daemon` job's.
      - name: Is this build signed
        id: sign
        working-directory: .
        env:
          SIGN: ${{ inputs.sign }}
          MACOS: ${{ needs.signing.outputs.macos }}
          WINDOWS: ${{ needs.signing.outputs.windows }}
          MACOS_REASON: ${{ needs.signing.outputs.macos_reason }}
          WINDOWS_REASON: ${{ needs.signing.outputs.windows_reason }}
        run: sh scripts/signing/ci.sh job "troupe ${{ matrix.target }}"

      - name: A keychain with the signing identity (macOS)
        id: keychain
        if: runner.os == 'macOS' && steps.sign.outputs.signs == 'true'
        working-directory: .
        env:
          MODE: ${{ steps.sign.outputs.mode }}
          APPLE_CERTIFICATE: ${{ steps.sign.outputs.mode == 'release' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.sign.outputs.mode == 'release' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.sign.outputs.mode == 'release' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: sh scripts/signing/macos-keychain.sh "$MODE"

      - name: The signing tool (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.mode == 'release'
        run: cargo install artifact-signing-cli --locked

      - name: A self-signed certificate, trusted on this runner only (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.mode == 'self-signed'
        working-directory: .
        shell: pwsh
        run: ./scripts/signing/test-certificate.ps1 -Trust

      - name: What signs
        if: steps.sign.outputs.signs == 'true'
        working-directory: .
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          AUTHORITY: ${{ steps.keychain.outputs.authority }}
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: sh scripts/signing/ci.sh env "${{ steps.sign.outputs.mode }}"

      # Signed or not, the same build: with `TROUPE_SIGN` set (What signs, above),
      # Troupe.Release.OSSigning signs every executable and library in Burrito's payload
      # after its patch phase has put the target's ERTS there and before it is packed.
      # Two steps only so that the unsigned build cannot see the Windows signing secrets.
      - name: Build the release
        if: steps.sign.outputs.signs != 'true'
        env:
          BURRITO_TARGET: ${{ matrix.target }}
          MATRIX_TARGET_ABI: ${{ matrix.target_abi }}
        run: |
          if [ -n "${MATRIX_TARGET_ABI}" ]; then export TARGET_ABI="${MATRIX_TARGET_ABI}"; fi
          mix release --overwrite
          ls -la burrito_out
          # What Burrito wrapped into the binary.
          ls _build/prod/rel/troupe/LICENSE _build/prod/rel/troupe/NOTICE _build/prod/rel/troupe/THIRD-PARTY-NOTICES.txt

      - name: Build the release, signed
        if: steps.sign.outputs.signs == 'true'
        env:
          BURRITO_TARGET: ${{ matrix.target }}
          AZURE_ENDPOINT: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_ENDPOINT || '' }}
          AZURE_CODE_SIGNING_NAME: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CODE_SIGNING_NAME || '' }}
          AZURE_CERT_PROFILE_NAME: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CERT_PROFILE_NAME || '' }}
          AZURE_TENANT_ID: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          mix release --overwrite
          ls -la burrito_out
          ls _build/prod/rel/troupe/LICENSE _build/prod/rel/troupe/NOTICE _build/prod/rel/troupe/THIRD-PARTY-NOTICES.txt

      - name: Name the artifact
        id: art
        run: |
          VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")
          EXT=""; [[ "${{ matrix.target }}" == windows* ]] && EXT=".exe"
          NAME="troupe-${VERSION}-${{ matrix.target }}${EXT}"
          mv "burrito_out/troupe_${{ matrix.target }}${EXT}" "burrito_out/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # The binary Burrito wrapped the signed payload in, signed itself, and on macOS
      # registered with Apple: a standalone binary cannot have a ticket stapled to it.
      - name: Sign the binary
        if: steps.sign.outputs.signs == 'true'
        env:
          AZURE_ENDPOINT: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_ENDPOINT || '' }}
          AZURE_CODE_SIGNING_NAME: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CODE_SIGNING_NAME || '' }}
          AZURE_CERT_PROFILE_NAME: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CERT_PROFILE_NAME || '' }}
          AZURE_TENANT_ID: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.sign.outputs.mode == 'release' && runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          case "$TROUPE_SIGN" in
            *.ps1) pwsh -NoProfile -NonInteractive -File "$TROUPE_SIGN" "burrito_out/${{ steps.art.outputs.name }}" ;;
            *) sh "$TROUPE_SIGN" "burrito_out/${{ steps.art.outputs.name }}" ;;
          esac

      - name: Notarise (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.mode == 'release'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TROUPE_SIGN_LABEL: ${{ steps.art.outputs.name }}
        run: sh ../../scripts/signing/notarize-macos.sh "burrito_out/${{ steps.art.outputs.name }}"

      # The embedded daemon takes the scripted model from the environment: a workspace's
      # own file names a provider only once the machine trusts the workspace.
      - name: Smoke test (--version and a headless Fake run in the embedded daemon)
        run: |
          BIN="$PWD/burrito_out/${{ steps.art.outputs.name }}"
          chmod +x "$BIN" || true
          START=$(date +%s%N); "$BIN" --version; END=$(date +%s%N)
          echo "cold first run (extraction + --version): $(( (END-START)/1000000 )) ms"
          START=$(date +%s%N); "$BIN" --version; END=$(date +%s%N)
          echo "warm --version: $(( (END-START)/1000000 )) ms"
          ls -la "$BIN"
          SMOKE="$RUNNER_TEMP/smoke"; mkdir -p "$SMOKE/.troupe" && cd "$SMOKE"
          TROUPE_PROVIDER=fake TROUPE_MODEL=fake-model \
            TROUPE_FAKE_SCRIPT="$GITHUB_WORKSPACE/clients/tui/fixtures/fake_scripts/smoke.json" \
            "$BIN" run build "smoke" --headless --auto-approve
          test -f hello.txt && cat hello.txt
          # A model that ends its turn in prose and never calls `finish` ends the run too,
          # with 0 (issue #127): a real one usually does exactly that.
          REST="$RUNNER_TEMP/no-finish"; mkdir -p "$REST/.troupe" && cd "$REST"
          TROUPE_PROVIDER=fake TROUPE_MODEL=fake-model \
            TROUPE_FAKE_SCRIPT="$GITHUB_WORKSPACE/clients/tui/fixtures/fake_scripts/no_finish.json" \
            "$BIN" run build "no finish" --headless --auto-approve
          test -f hello.txt

      # The binary, and what it unpacked on its first run above: the payload under
      # `.burrito`, every executable and library of which carries the signature.
      - name: The binary and everything it unpacks are signed (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.signs == 'true'
        env:
          TROUPE_SIGN_LABEL: ${{ steps.art.outputs.name }}
        run: |
          payload=$(find "$HOME/Library/Application Support/.burrito" -maxdepth 1 -type d -name 'troupe_erts-*' | head -1)
          [ -n "$payload" ] || { echo "the binary unpacked no payload under ~/Library/Application Support/.burrito"; exit 1; }
          sh ../../scripts/signing/sign-macos.sh --verify "burrito_out/${{ steps.art.outputs.name }}" "$payload"

      - name: The binary and everything it unpacks are signed (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.signs == 'true'
        shell: pwsh
        env:
          TROUPE_SIGN_LABEL: ${{ steps.art.outputs.name }}
        run: |
          $payload = @(Get-ChildItem -Directory -ErrorAction SilentlyContinue -Path "$env:APPDATA\.burrito", "$env:LOCALAPPDATA\.burrito" |
            Where-Object { $_.Name -like 'troupe_erts-*' }) | Select-Object -First 1
          if (-not $payload) { throw "the binary unpacked no payload under .burrito" }
          & "$env:GITHUB_WORKSPACE/scripts/signing/sign-windows.ps1" -Verify "burrito_out/${{ steps.art.outputs.name }}" $payload.FullName

      - name: Record what was signed
        if: steps.sign.outputs.signs == 'true'
        run: sh ../../scripts/signing/ci.sh record "burrito_out/${{ steps.art.outputs.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.art.outputs.name }}
          path: clients/tui/burrito_out/${{ steps.art.outputs.name }}

      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.signs == 'true'
        with:
          name: os-signed-${{ steps.art.outputs.name }}
          path: ${{ runner.temp }}/os-signed/records.txt

      - name: Remove the keychain
        if: always() && steps.keychain.outcome == 'success'
        working-directory: .
        run: sh scripts/signing/macos-keychain.sh delete

  tui-containers:
    name: the TUI's Linux binary in clean containers
    needs: [tui]
    # The signing test builds no Linux binary.
    if: inputs.sign != 'self-signed'
    runs-on: ubuntu-24.04
    # A binary that hangs in a container must fail this job, not hold a runner for six
    # hours: the first run of this job on GitHub did exactly that, with no log to show
    # for it until the job ended. Each command below has its own `timeout` as well, which
    # names the command that hung, so this is longer than the longest of them.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: troupe-*-linux_x86_64
          merge-multiple: true
          path: dist
      # Each command under `timeout`, so a hang is a failure that names the command; the
      # run's output to a file rather than through `tee`, because a pipe stays open while
      # anything the binary started still holds it, and `tee` would wait for all of them;
      # and `--init`, so something reaps whatever the harness leaves behind. The output is
      # printed either way.
      - name: ubuntu:24.04 and alpine (no Erlang, no Elixir, no inotify-tools)
        run: |
          chmod +x dist/troupe-*-linux_x86_64
          for img in ubuntu:24.04 alpine:3.20; do
            echo "::group::$img"
            docker run --rm --init -v "$PWD/dist:/dist" -v "$PWD/clients/tui/fixtures:/fixtures" \
              -e TROUPE_PROVIDER=fake -e TROUPE_MODEL=fake-model \
              -e TROUPE_FAKE_SCRIPT=/fixtures/fake_scripts/smoke.json "$img" sh -c '
              set -e; ulimit -n; BIN=$(ls /dist/troupe-*-linux_x86_64); mkdir -p /work/.troupe && cd /work
              timeout 120 $BIN --version
              status=0
              timeout 300 $BIN run build "smoke" --headless --auto-approve --watch > out.log 2>&1 || status=$?
              cat out.log
              [ "$status" = 0 ] || { echo "the run exited $status (124 is the timeout)"; exit 1; }
              if grep -q polling out.log; then echo "watch fell back to polling"; fi
              test -f hello.txt
              mkdir -p /rest/.troupe && cd /rest
              status=0
              TROUPE_FAKE_SCRIPT=/fixtures/fake_scripts/no_finish.json \
                timeout 300 $BIN run build "no finish" --headless --auto-approve > out.log 2>&1 || status=$?
              cat out.log
              [ "$status" = 0 ] || { echo "the run with no finish exited $status (124 is the timeout)"; exit 1; }
              test -f hello.txt'
            echo "::endgroup::"
          done

  # -- the desktop app ----------------------------------------------------------
  #
  # Unsigned until the signing secrets exist; with them, a release (`sign: release`) signs
  # with nothing else to change. Tauri signs while it builds: on macOS the app, with the
  # hardened runtime and `entitlements.plist`, notarised and stapled; on Windows the app's
  # executable, the NSIS setup and the MSI, through the sign command in
  # `tauri.signing.conf.json`, which is scripts/signing/sign-windows.ps1. Until then the
  # installers warn on first launch (clients/gui/docs/install.md).
  desktop:
    name: desktop ${{ matrix.name }}
    needs: [targets, signing]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    environment: ${{ inputs.sign == 'release' && !startsWith(matrix.os, 'ubuntu') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.desktop) }}
    defaults:
      run:
        working-directory: clients/gui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libssl-dev build-essential file

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/gui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/gui/apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Is this build signed
        id: sign
        shell: bash
        working-directory: .
        env:
          SIGN: ${{ inputs.sign }}
          MACOS: ${{ needs.signing.outputs.macos }}
          WINDOWS: ${{ needs.signing.outputs.windows }}
          MACOS_REASON: ${{ needs.signing.outputs.macos_reason }}
          WINDOWS_REASON: ${{ needs.signing.outputs.windows_reason }}
        run: |
          sh scripts/signing/ci.sh job "desktop ${{ matrix.target }}"
          if [ "${{ inputs.sign }}" = "" ]; then
            echo "::notice::Unsigned build. Installers will warn; see clients/gui/docs/install.md."
          fi

      # A release's macOS build: Tauri imports APPLE_CERTIFICATE into a keychain of its
      # own. The test's: the self-signed identity in one of the job's own (or ad hoc), which
      # Tauri finds by APPLE_SIGNING_IDENTITY, as codesign does.
      - name: A keychain with the test's signing identity (macOS)
        id: keychain
        if: runner.os == 'macOS' && steps.sign.outputs.mode == 'self-signed'
        shell: bash
        working-directory: .
        run: sh scripts/signing/macos-keychain.sh self-signed

      # tauri-action takes the App Store Connect key as a file, APPLE_API_KEY_PATH; a secret
      # cannot be a file, so the key's text is written to one only this job reads.
      - name: The notarisation key, as a file (macOS)
        id: apikey
        if: runner.os == 'macOS' && steps.sign.outputs.mode == 'release'
        shell: bash
        # The path names no secret, so the output that carries it is not withheld.
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/private_keys"; mkdir -p "$dir"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$dir/notary.p8"
          echo "path=$dir/notary.p8" >> "$GITHUB_OUTPUT"

      - name: The signing tool (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.mode == 'release'
        run: cargo install artifact-signing-cli --locked

      - name: A self-signed certificate, trusted on this runner only (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.mode == 'self-signed'
        working-directory: .
        shell: pwsh
        run: ./scripts/signing/test-certificate.ps1 -Trust

      - name: What signs (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.signs == 'true'
        shell: bash
        working-directory: .
        run: sh scripts/signing/ci.sh env "${{ steps.sign.outputs.mode }}"

      # Three steps, not one with a conditional env block. An undefined secret is not an
      # absent variable: GitHub substitutes an empty string, so `APPLE_CERTIFICATE` is
      # still *defined*, and tauri-action reads its presence as "set up a signing
      # keychain" and then fails importing nothing. The unsigned build must not be able
      # to see these names at all. No `tagName`: the release job owns the release, and
      # this only builds.
      - name: Build the bundles (unsigned)
        if: steps.sign.outputs.signs != 'true'
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: clients/gui/apps/desktop
          args: --target ${{ matrix.target }}

      - name: Build the bundles (signed)
        if: steps.sign.outputs.mode == 'release'
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ steps.apikey.outputs.path }}
          AZURE_ENDPOINT: ${{ runner.os == 'Windows' && secrets.AZURE_ENDPOINT || '' }}
          AZURE_CODE_SIGNING_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_CODE_SIGNING_NAME || '' }}
          AZURE_CERT_PROFILE_NAME: ${{ runner.os == 'Windows' && secrets.AZURE_CERT_PROFILE_NAME || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
        with:
          projectPath: clients/gui/apps/desktop
          args: --target ${{ matrix.target }} --config src-tauri/tauri.signing.conf.json

      # The same configuration and sign command, with the test's identity: no certificate
      # for Tauri to import on macOS, and no notarisation, which needs Apple.
      - name: Build the bundles (self-signed)
        if: steps.sign.outputs.mode == 'self-signed'
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
        with:
          projectPath: clients/gui/apps/desktop
          args: --target ${{ matrix.target }} --config src-tauri/tauri.signing.conf.json

      # `bundle.resources` puts LICENSE, NOTICE and THIRD-PARTY-NOTICES.txt beside the app,
      # because Apache-2.0 and the bundled packages' licences ask that they go with every
      # copy. One installer per platform is opened to see that they are there.
      - name: The installers carry the licences
        shell: bash
        working-directory: clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          case "$RUNNER_OS" in
            Linux) listing=$(dpkg-deb -c deb/*.deb) ;;
            macOS) listing=$(find macos -path '*.app/Contents/Resources/*') ;;
            Windows) listing=$(7z l nsis/*-setup.exe) ;;
          esac
          listing=$(tr -d '\r' <<<"$listing" | tr '\\' '/')
          for f in LICENSE NOTICE THIRD-PARTY-NOTICES.txt; do
            grep -Eq "(^|[/ ])$f\$" <<<"$listing" || { echo "$f is not in the installer:"; echo "$listing"; exit 1; }
          done

      # What the desktop app updates itself from on macOS (Decision 874): the app as an
      # archive, the shape Tauri's updater unpacks, beside the disk image a person installs
      # from. Windows updates from the setup and Linux from the AppImage, both kept already.
      # Packed here and signed in `release.yml`'s publish job, which alone holds the key.
      - name: The app archive the updater reads (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          version=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")
          tar -czf "macos/Troupe_${version%%-*}_universal.app.tar.gz" -C macos Troupe.app
          ls -la macos

      # The app as a whole, and each Mach-O in it with the hardened runtime and the
      # identity it was signed with; for a release, also what Gatekeeper will say and the
      # stapled ticket.
      - name: The app is signed (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.signs == 'true'
        shell: bash
        working-directory: clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        env:
          MODE: ${{ steps.sign.outputs.mode }}
          TROUPE_SIGN_AUTHORITY: ${{ steps.sign.outputs.mode == 'release' && 'Developer ID Application:' || steps.keychain.outputs.authority }}
          TROUPE_SIGN_LABEL: desktop ${{ matrix.target }}
        run: |
          codesign --verify --deep --strict --verbose=2 macos/Troupe.app
          codesign -d --entitlements - --xml macos/Troupe.app | grep -q com.apple.security.cs.allow-jit
          sh "$GITHUB_WORKSPACE/scripts/signing/sign-macos.sh" --verify macos/Troupe.app
          if [ "$MODE" = release ]; then
            spctl --assess --type execute --verbose=4 macos/Troupe.app
            xcrun stapler validate macos/Troupe.app
          fi
          files=$(find macos dmg -maxdepth 1 \( -name '*.app.tar.gz' -o -name '*.dmg' \) -type f)
          # shellcheck disable=SC2086
          sh "$GITHUB_WORKSPACE/scripts/signing/ci.sh" record $files

      # The installers and the app's executable must hold. What the NSIS setup unpacks at
      # install time besides (its plug-in DLLs) is listed, not required: Tauri decides what
      # it signs there.
      - name: The installers and the app are signed (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.signs == 'true'
        shell: pwsh
        working-directory: clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release
        env:
          TROUPE_SIGN_LABEL: desktop ${{ matrix.target }}
        run: |
          $verify = Join-Path $env:GITHUB_WORKSPACE "scripts/signing/sign-windows.ps1"
          # The app's executable as the setup installs it: Tauri marks a copy of the build's
          # for each installer and signs that, so the one left in target/ is not what ships.
          $unpacked = Join-Path $env:RUNNER_TEMP "setup-unpacked"
          7z x -y -bso0 "-o$unpacked" (Get-Item bundle/nsis/*-setup.exe).FullName
          $app = @(Get-ChildItem -Recurse -File -Path $unpacked -Filter troupe-desktop.exe | ForEach-Object FullName)
          if ($app.Count -eq 0) { throw "the setup holds no troupe-desktop.exe" }
          $files = @(Get-ChildItem bundle/nsis/*-setup.exe, bundle/msi/*.msi | ForEach-Object FullName) + $app
          & $verify -Verify @files
          $env:TROUPE_SIGN_LABEL = ""
          try { & $verify -Verify $unpacked } catch { Write-Host "::notice::$($_.Exception.Message): what the setup unpacks, listed above" }
          $global:LASTEXITCODE = 0
          # As `ci.sh record` writes it.
          $dir = Join-Path $env:RUNNER_TEMP "os-signed"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Get-ChildItem bundle/nsis/*-setup.exe, bundle/msi/*.msi | ForEach-Object {
            $line = "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
            Write-Host $line
            Add-Content -Path (Join-Path $dir "records.txt") -Value $line
          }

      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.signs == 'true'
        with:
          name: os-signed-desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/os-signed/records.txt

      - name: Remove the keychain
        if: always() && steps.keychain.outcome == 'success'
        shell: bash
        working-directory: .
        run: sh scripts/signing/macos-keychain.sh delete

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage

  # -- the release --------------------------------------------------------------
  attach:
    name: attach to ${{ inputs.tag }}
    needs: [daemon, tui, tui-containers, desktop]
    if: inputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No `permissions:` of its own: it inherits the caller's, and the release job in
    # `ci.yml` calls this with `contents: write`. Declaring it here would make every other
    # caller — a pull request's `native` job — fail validation for a job it never runs.
    steps:
      # Only what this workflow built. A release's run also holds the image builds'
      # `*.dockerbuild` records, and downloading everything meant one of those failing
      # after five retries stopped v0.3.1's publish — and would have attached them.
      - uses: actions/download-artifact@v8
        with:
          pattern: troupe-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Upload every artifact to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          find dist -type f | sort
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
