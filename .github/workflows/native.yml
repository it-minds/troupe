# The builds that run on somebody's machine rather than in a cluster: `troupe-daemon` and
# `troupe` (the TUI) for five platforms each, and the desktop app's installers for three.
#
# One native runner per target. A Mix release carries the build host's ERTS, the TUI's
# precompiled ExRatatui NIF resolves against the build host, and the desktop app links
# the platform's webview — none of it cross-builds. So this is slow and wide, and it runs
# when it proves something: on a pull request into `main` that touches one of them
# (called from `ci.yml`, under `ci-ok`, without the macOS targets, which cost about ten
# Linux runners each), nightly (`nightly.yml`), for a pre-release (`prerelease.yml`)
# and for a release (`release.yml`) — those two with a tag, and then it attaches
# everything to that draft release. See `.github/CI.md`.
#
# `workflow_dispatch` runs it by hand, attaching nothing.
name: native builds

on:
  workflow_call:
    inputs:
      tag:
        description: "The draft release to attach the artifacts to; empty attaches nothing"
        type: string
        default: ""
      version:
        description: >-
          Build the daemon and the TUI as this version (written into VERSION first), for a
          pre-release. Empty builds VERSION as committed. The desktop app keeps VERSION's
          number: an MSI version must be numeric, so `0.3.1-pre.7` is not one.
        type: string
        default: ""
      ref:
        description: The commit to build; empty is the caller's.
        type: string
        default: ""
      macos:
        description: >-
          Build the macOS targets too. A release, a pre-release and the nightly do; a pull
          request does not, because a macOS runner costs about ten Linux ones.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      macos:
        description: Build the macOS targets too
        type: boolean
        default: true

env:
  # The patch level, the same one `.tool-versions` and `ci.yml` pin, and not `28.5`:
  # Burrito fetches a precompiled ERTS for the target from its mirror at exactly the
  # running OTP's version, and the mirror lags OTP's patch releases by days. On the
  # morning 28.5.0.7 was published, `28.5` resolved to it, the mirror had no macOS build
  # of it yet, and every macOS build of the 0.3.2 release failed with a 404.
  OTP_VERSION: "28.5.0.5"
  ELIXIR_VERSION: "1.20.4"
  ZIG_VERSION: "0.16.0"

jobs:
  # -- which targets --------------------------------------------------------------
  #
  # Every matrix below is read from here, because a matrix of `include:` entries cannot
  # drop some of them on a condition: `exclude:` does not apply to them. Without
  # `macos`, the macOS rows are filtered out before any runner starts.
  targets:
    name: which targets
    runs-on: ubuntu-latest
    outputs:
      daemon: ${{ steps.pick.outputs.daemon }}
      tui: ${{ steps.pick.outputs.tui }}
      desktop: ${{ steps.pick.outputs.desktop }}
    steps:
      - id: pick
        env:
          MACOS: ${{ inputs.macos }}
          DAEMON: >-
            [{"os": "ubuntu-24.04", "target": "linux_x86_64"},
             {"os": "ubuntu-24.04-arm", "target": "linux_aarch64"},
             {"os": "macos-15-intel", "target": "macos_x86_64"},
             {"os": "macos-14", "target": "macos_aarch64"},
             {"os": "windows-2022", "target": "windows_x86_64"}]
          TUI: >-
            [{"os": "ubuntu-24.04", "target": "linux_x86_64", "target_abi": "musl"},
             {"os": "ubuntu-24.04-arm", "target": "linux_aarch64", "target_abi": "musl"},
             {"os": "macos-15-intel", "target": "macos_x86_64"},
             {"os": "macos-14", "target": "macos_aarch64"},
             {"os": "windows-2022", "target": "windows_x86_64"}]
          # Linux on 22.04 is the glibc floor: the oldest Ubuntu that carries
          # libwebkit2gtk-4.1-dev. Building on 24.04 raises the required glibc and
          # silently breaks every 22.04 user. Do not "modernise" it.
          DESKTOP: >-
            [{"name": "macOS (universal)", "os": "macos-14", "target": "universal-apple-darwin",
              "rust-targets": "aarch64-apple-darwin,x86_64-apple-darwin"},
             {"name": "Windows (x64)", "os": "windows-latest", "target": "x86_64-pc-windows-msvc",
              "rust-targets": "x86_64-pc-windows-msvc"},
             {"name": "Linux (x64)", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu",
              "rust-targets": "x86_64-unknown-linux-gnu"}]
        # `macos` is empty when nothing passed it, which means the default: build it.
        run: |
          if [ "$MACOS" = false ]; then
            pick() { jq -c 'map(select(.os | startswith("macos") | not))'; }
          else
            pick() { jq -c .; }
          fi
          {
            echo "daemon=$(pick <<<"$DAEMON")"
            echo "tui=$(pick <<<"$TUI")"
            echo "desktop=$(pick <<<"$DESKTOP")"
          } >> "$GITHUB_OUTPUT"

  # -- troupe-daemon ------------------------------------------------------------
  daemon:
    name: troupe-daemon ${{ matrix.target }}
    needs: [targets]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MIX_ENV: prod
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.daemon) }}
    defaults:
      run:
        shell: bash
        # Built from its own directory, so the runner compiles the harness and not the
        # plane's database and Kubernetes clients (Decision 667).
        working-directory: apps/troupe_daemon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # A pre-release's number, written where the Mix projects read their version.
      - name: Build as ${{ inputs.version }}
        if: inputs.version != ''
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" > VERSION

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: mix deps.get

      - name: Build the release
        run: mix release troupe_daemon --overwrite

      - name: Name the artifact
        id: art
        run: |
          VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")
          NAME="troupe-daemon-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$GITHUB_WORKSPACE/_build/prod/troupe_daemon-${VERSION}.tar.gz" "$GITHUB_WORKSPACE/dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: "Smoke test (unpack; version, status, run, status, eval)"
        if: runner.os != 'Windows'
        env:
          TROUPE_PROVIDER: fake
          TROUPE_DAEMON_LOG: stderr
          TROUPE_DAEMON_IDLE_MINUTES: "1"
        run: |
          INST=$(mktemp -d); tar -xzf "$GITHUB_WORKSPACE/dist/${{ steps.art.outputs.name }}" -C "$INST"
          BIN="$INST/bin/troupe-daemon"
          ls "$INST"/lib/troupe_core-*/priv/reaper/
          ls "$INST"/LICENSE "$INST"/NOTICE "$INST"/THIRD-PARTY-NOTICES.txt
          "$BIN" version
          "$BIN" status && exit 1 || echo "not running, as expected"
          "$BIN" run &
          for i in $(seq 1 60); do "$BIN" status >/dev/null 2>&1 && break; sleep 1; done
          "$BIN" status
          "$BIN" run   # idempotent: names the running one and exits 0
          "$INST/bin/troupe_daemon" eval 'IO.puts(Troupe.Version.version())'
          kill %1 || true

      - name: "Smoke test (Windows: unpack, version, status, eval)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TROUPE_PROVIDER: fake
          TROUPE_DAEMON_LOG: stderr
        run: |
          $inst = Join-Path $env:RUNNER_TEMP "troupe-daemon"
          New-Item -ItemType Directory -Force $inst | Out-Null
          tar -xzf "$env:GITHUB_WORKSPACE/dist/${{ steps.art.outputs.name }}" -C $inst
          Get-ChildItem "$inst\lib\troupe_core-*\priv\reaper"
          Get-ChildItem "$inst\lib\ezstd-*\priv"
          Get-Item "$inst\LICENSE", "$inst\NOTICE", "$inst\THIRD-PARTY-NOTICES.txt"
          & "$inst\bin\troupe-daemon.cmd" version
          & "$inst\bin\troupe-daemon.cmd" status
          if ($LASTEXITCODE -ne 1) { throw "status should say not running (exit 1), got $LASTEXITCODE" }
          & "$inst\bin\troupe_daemon.bat" eval "b = :binary.list_to_bin(List.duplicate(0, 1000)); true = :ezstd.decompress(:ezstd.compress(b)) == b; IO.puts(:zstd_ok)"
          if ($LASTEXITCODE -ne 0) { throw "eval failed with $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: dist/${{ steps.art.outputs.name }}

  # -- troupe (the TUI) ---------------------------------------------------------
  tui:
    name: troupe ${{ matrix.target }}
    needs: [targets]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MIX_ENV: prod
      TROUPE_REAPER_TARGETS: all
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.tui) }}
    defaults:
      run:
        shell: bash
        working-directory: clients/tui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # A pre-release's number, written where the Mix projects read their version.
      - name: Build as ${{ inputs.version }}
        if: inputs.version != ''
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" > VERSION

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install xz and 7z
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full; fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then brew install xz p7zip || true; fi

      # The harness is a path dependency on the umbrella beside it; nothing is fetched
      # from anywhere private.
      - run: mix deps.get

      - name: Build the release
        env:
          BURRITO_TARGET: ${{ matrix.target }}
          MATRIX_TARGET_ABI: ${{ matrix.target_abi }}
        run: |
          if [ -n "${MATRIX_TARGET_ABI}" ]; then export TARGET_ABI="${MATRIX_TARGET_ABI}"; fi
          mix release --overwrite
          ls -la burrito_out
          # What Burrito wrapped into the binary.
          ls _build/prod/rel/troupe/LICENSE _build/prod/rel/troupe/NOTICE _build/prod/rel/troupe/THIRD-PARTY-NOTICES.txt

      - name: Name the artifact
        id: art
        run: |
          VERSION=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")
          EXT=""; [[ "${{ matrix.target }}" == windows* ]] && EXT=".exe"
          NAME="troupe-${VERSION}-${{ matrix.target }}${EXT}"
          mv "burrito_out/troupe_${{ matrix.target }}${EXT}" "burrito_out/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # The embedded daemon takes the scripted model from the environment: a workspace's
      # own file names a provider only once the machine trusts the workspace.
      - name: Smoke test (--version and a headless Fake run in the embedded daemon)
        run: |
          BIN="$PWD/burrito_out/${{ steps.art.outputs.name }}"
          chmod +x "$BIN" || true
          START=$(date +%s%N); "$BIN" --version; END=$(date +%s%N)
          echo "cold first run (extraction + --version): $(( (END-START)/1000000 )) ms"
          START=$(date +%s%N); "$BIN" --version; END=$(date +%s%N)
          echo "warm --version: $(( (END-START)/1000000 )) ms"
          ls -la "$BIN"
          SMOKE="$RUNNER_TEMP/smoke"; mkdir -p "$SMOKE/.troupe" && cd "$SMOKE"
          TROUPE_PROVIDER=fake TROUPE_MODEL=fake-model \
            TROUPE_FAKE_SCRIPT="$GITHUB_WORKSPACE/clients/tui/fixtures/fake_scripts/smoke.json" \
            "$BIN" run build "smoke" --headless --auto-approve
          test -f hello.txt && cat hello.txt
          # A model that ends its turn in prose and never calls `finish` ends the run too,
          # with 0 (issue #127): a real one usually does exactly that.
          REST="$RUNNER_TEMP/no-finish"; mkdir -p "$REST/.troupe" && cd "$REST"
          TROUPE_PROVIDER=fake TROUPE_MODEL=fake-model \
            TROUPE_FAKE_SCRIPT="$GITHUB_WORKSPACE/clients/tui/fixtures/fake_scripts/no_finish.json" \
            "$BIN" run build "no finish" --headless --auto-approve
          test -f hello.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: clients/tui/burrito_out/${{ steps.art.outputs.name }}

  tui-containers:
    name: the TUI's Linux binary in clean containers
    needs: [tui]
    runs-on: ubuntu-24.04
    # A binary that hangs in a container must fail this job, not hold a runner for six
    # hours: the first run of this job on GitHub did exactly that, with no log to show
    # for it until the job ended.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*-linux_x86_64
          merge-multiple: true
          path: dist
      # Each command under `timeout`, so a hang is a failure that names the command; the
      # run's output to a file rather than through `tee`, because a pipe stays open while
      # anything the binary started still holds it, and `tee` would wait for all of them;
      # and `--init`, so something reaps whatever the harness leaves behind. The output is
      # printed either way.
      - name: ubuntu:24.04 and alpine (no Erlang, no Elixir, no inotify-tools)
        run: |
          chmod +x dist/troupe-*-linux_x86_64
          for img in ubuntu:24.04 alpine:3.20; do
            echo "::group::$img"
            docker run --rm --init -v "$PWD/dist:/dist" -v "$PWD/clients/tui/fixtures:/fixtures" \
              -e TROUPE_PROVIDER=fake -e TROUPE_MODEL=fake-model \
              -e TROUPE_FAKE_SCRIPT=/fixtures/fake_scripts/smoke.json "$img" sh -c '
              set -e; ulimit -n; BIN=$(ls /dist/troupe-*-linux_x86_64); mkdir -p /work/.troupe && cd /work
              timeout 120 $BIN --version
              status=0
              timeout 300 $BIN run build "smoke" --headless --auto-approve --watch > out.log 2>&1 || status=$?
              cat out.log
              [ "$status" = 0 ] || { echo "the run exited $status (124 is the timeout)"; exit 1; }
              if grep -q polling out.log; then echo "watch fell back to polling"; fi
              test -f hello.txt
              mkdir -p /rest/.troupe && cd /rest
              status=0
              TROUPE_FAKE_SCRIPT=/fixtures/fake_scripts/no_finish.json \
                timeout 300 $BIN run build "no finish" --headless --auto-approve > out.log 2>&1 || status=$?
              cat out.log
              [ "$status" = 0 ] || { echo "the run with no finish exited $status (124 is the timeout)"; exit 1; }
              test -f hello.txt'
            echo "::endgroup::"
          done

  # -- the desktop app ----------------------------------------------------------
  #
  # Unsigned until the signing secrets exist. Every signing step is gated on a secret, and
  # adding the secret turns it on with nothing else to change; until then the installers
  # warn on first launch (clients/gui/docs/install.md).
  desktop:
    name: desktop ${{ matrix.name }}
    needs: [targets]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.desktop) }}
    defaults:
      run:
        working-directory: clients/gui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libssl-dev build-essential file

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/gui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/gui/apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Decide whether this build is signed
        id: signing
        shell: bash
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
        run: |
          signed=false
          case "${{ matrix.os }}" in
            macos-*)   [ -n "$APPLE_CERT" ]     && signed=true ;;
            windows-*) [ -n "$AZURE_ENDPOINT" ] && signed=true ;;
          esac
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          if [ "$signed" = false ]; then
            echo "::notice::Unsigned build. Installers will warn; see clients/gui/docs/install.md."
          fi

      - name: Install the Windows signing client
        if: steps.signing.outputs.signed == 'true' && runner.os == 'Windows'
        run: cargo install trusted-signing-cli

      # Two steps, not one with a conditional env block. An undefined secret is not an
      # absent variable: GitHub substitutes an empty string, so `APPLE_CERTIFICATE` is
      # still *defined*, and tauri-action reads its presence as "set up a signing
      # keychain" and then fails importing nothing. The unsigned build must not be able
      # to see these names at all. No `tagName`: the release job owns the release, and
      # this only builds.
      - name: Build the bundles (unsigned)
        if: steps.signing.outputs.signed != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: clients/gui/apps/desktop
          args: --target ${{ matrix.target }}

      - name: Build the bundles (signed)
        if: steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: clients/gui/apps/desktop
          args: --target ${{ matrix.target }} --config src-tauri/tauri.signing.conf.json

      # `bundle.resources` puts LICENSE, NOTICE and THIRD-PARTY-NOTICES.txt beside the app,
      # because Apache-2.0 and the bundled packages' licences ask that they go with every
      # copy. One installer per platform is opened to see that they are there.
      - name: The installers carry the licences
        shell: bash
        working-directory: clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          case "$RUNNER_OS" in
            Linux) listing=$(dpkg-deb -c deb/*.deb) ;;
            macOS) listing=$(find macos -path '*.app/Contents/Resources/*') ;;
            Windows) listing=$(7z l nsis/*-setup.exe) ;;
          esac
          listing=$(tr -d '\r' <<<"$listing" | tr '\\' '/')
          for f in LICENSE NOTICE THIRD-PARTY-NOTICES.txt; do
            grep -Eq "(^|[/ ])$f\$" <<<"$listing" || { echo "$f is not in the installer:"; echo "$listing"; exit 1; }
          done

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            clients/gui/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage

  # -- the release --------------------------------------------------------------
  attach:
    name: attach to ${{ inputs.tag }}
    needs: [daemon, tui, tui-containers, desktop]
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    # No `permissions:` of its own: it inherits the caller's, and the release job in
    # `ci.yml` calls this with `contents: write`. Declaring it here would make every other
    # caller — a pull request's `native` job — fail validation for a job it never runs.
    steps:
      # Only what this workflow built. A release's run also holds the image builds'
      # `*.dockerbuild` records, and downloading everything meant one of those failing
      # after five retries stopped v0.3.1's publish — and would have attached them.
      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Upload every artifact to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          find dist -type f | sort
          find dist -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
