# A release: the full suite, then the version's images, the chart, the native builds and
# a published GitHub release (Decisions 669, 674, 676). It publishes and it ends there:
# nothing here deploys, or knows where the release will run (Decision 735).
# `docs/developer/ci.md` has the picture.
#
# Started by a push to `main` that changes VERSION — which is to say, by merging the pull
# request `scripts/release <version>` opens — and cut only when that version has no tag
# yet, so a re-run cannot cut it twice. `workflow_dispatch` cuts the version VERSION
# names when it has no tag, for the release whose run failed and whose VERSION change is
# already behind `main`.
#
# Nothing here trusts an earlier run: the whole suite runs again, soak and cluster
# included, on exactly the commit being released, and the images are built from that
# commit and tagged with the version. A release candidate (`0.4.0-rc.1`) does all of it
# and is published as a GitHub pre-release.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: is this a new version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      cut: ${{ steps.version.outputs.cut }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Two commits deep, so the push can be compared with what `main` was before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A release is a merged *change* to VERSION, not a VERSION that happens to have no
      # tag: the monorepo merge had a 0.2.0 nobody meant to release (Decision 674). By
      # hand, the second condition alone — somebody asked.
      - name: Is this a new version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ] && git diff --quiet HEAD^1 HEAD -- VERSION; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            echo "VERSION did not change in this push; nothing to cut." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            echo "${tag} is already released; nothing to cut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cut=true" >> "$GITHUB_OUTPUT"
            echo "Cutting ${tag} from ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Everything, whatever changed, nine more times for the races, and the cluster suite.
  suite:
    name: the full suite
    needs: [version]
    if: needs.version.outputs.cut == 'true'
    uses: ./.github/workflows/ci.yml
    # Everything any job in `ci.yml` asks for, used or not: GitHub checks a called
    # workflow's permissions before it runs a job, and `ci.yml`'s `images` job — skipped
    # in a full run — asks for `packages: write`. Granting less is a `startup_failure`
    # with no message, which is how the first release through this file ended.
    permissions:
      contents: read
      pull-requests: read
      packages: write
    with:
      full: true
      soak: 9
      cluster: true

  images:
    name: images at ${{ needs.version.outputs.version }}
    needs: [version, suite]
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}

  # The tag, the chart, and a draft release for the native builds to attach to.
  cut:
    name: tag ${{ needs.version.outputs.tag }}
    needs: [version, images]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # The chart's own version and its appVersion are the release's, so an install of
      # this file pulls the images just built rather than whatever `values.yaml` was
      # last edited to say (Decision 322).
      - name: Package the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package charts/troupe --version "$VERSION" --app-version "$VERSION" --destination dist

      # install.sh and install.ps1 as the release page offers them: pinned to this release,
      # and in its SHA256SUMS with everything else.
      - name: The installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release-installers "$VERSION" dist

      # The VS Code extension as `pnpm package` builds it, attached as troupe.vsix, which
      # the installers' --vscode (-VSCode) installs (Decision 765).
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: clients/vscode/pnpm-lock.yaml
      - name: The VS Code extension
        working-directory: clients/vscode
        run: |
          pnpm install --frozen-lockfile
          pnpm package
          cp troupe.vsix ../../dist/troupe.vsix

      # The tag is pushed with this workflow's own token, which starts no other workflow:
      # everything this release needs happens in this run. The release is a draft until
      # the native builds have attached their artifacts (`publish`, below).
      - name: Tag it, and open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          cat > notes.md <<NOTES
          Everything in this repository at \`${GITHUB_SHA::7}\`, as one release, after the full suite.

          **On a cluster** — the chart, whose images are this version, from the registry:

              helm upgrade --install troupe oci://ghcr.io/${owner}/charts/troupe --version ${VERSION} \\
                --namespace troupe-system --create-namespace --values my-values.yaml

          or the same chart from this page:

              helm upgrade --install troupe \\
                https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/troupe-${VERSION}.tgz \\
                --namespace troupe-system --create-namespace --values my-values.yaml

          Images, public and pulled without a credential: \`ghcr.io/${owner}/troupe-plane\`, \`troupe-operator\`, \`troupe-worker\`, \`troupe-a2a\` and \`troupe-gui\`, each tagged \`${VERSION}\`. [Installing](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/admin/installing.md) has the CRDs, the values nobody can leave unset, and what the chart does not run for you.

          **On a machine** — download the installer attached below, read it if you like, and run it. It installs this release: the daemon always, and it asks about the TUI and the desktop app.

          Linux and macOS:

          \`\`\`sh
          curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh
          less install.sh      # optional: read it first
          sh install.sh
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.ps1 -OutFile install.ps1
          notepad install.ps1  # optional: read it first
          powershell -ExecutionPolicy Bypass -File .\\install.ps1
          \`\`\`

          No questions: \`--tui --gui -y\` (\`-Tui -Gui -Yes\`). The VS Code extension: \`--vscode\` (\`-VSCode\`), or \`troupe.vsix\` below with **Extensions: Install from VSIX…**. Start over: \`--clean-install\` (\`-CleanInstall\`). Remove: \`--uninstall\` (\`-Uninstall\`). The desktop app's own installers are attached as well.

          Then, in a new terminal, \`troupe config\` sets up a model (Enter at every question is Anthropic, with the key from \`ANTHROPIC_API_KEY\`) and \`troupe\` in a project directory opens a session; without the TUI, the desktop app sets the model up on This computer, under Models. The [first run](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/user/README.md#first-run) has both.
          NOTES
          flags=(--draft --verify-tag --title "$TAG" --notes-file notes.md)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # The licence files too, beside the downloads that are one binary or an installer;
          # each of those carries them inside as well.
          gh release create "$TAG" "${flags[@]}" dist/troupe-*.tgz dist/install.sh dist/install.ps1 dist/troupe.vsix \
            LICENSE NOTICE THIRD-PARTY-NOTICES.txt

  native:
    name: native builds
    needs: [version, cut]
    uses: ./.github/workflows/native.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  # Published once everything is attached, with one SHA256SUMS over all of it, and the
  # chart in the registry first: a version there is a release that finished.
  publish:
    name: publish ${{ needs.version.outputs.tag }}
    needs: [version, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: azure/setup-helm@v5

      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      # The same file the release page has, as `oci://ghcr.io/<owner>/charts/troupe` at
      # the version, pushed with this workflow's own token (Decision 735).
      - name: The chart, to the registry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/troupe-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts"
          echo "- \`oci://ghcr.io/${owner}/charts/troupe\` \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE"
