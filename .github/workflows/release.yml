# A release: the full suite, then the version's images, the chart, the native builds, a
# published GitHub release, and production (Decisions 669, 674, 676). `.github/CI.md` has
# the picture.
#
# Started by a push to `main` that changes VERSION — which is to say, by merging the pull
# request `scripts/release <version>` opens — and cut only when that version has no tag
# yet, so a re-run cannot cut it twice. `workflow_dispatch` cuts the version VERSION
# names when it has no tag, for the release whose run failed and whose VERSION change is
# already behind `main`.
#
# Nothing here trusts an earlier run: the whole suite runs again, soak and cluster
# included, on exactly the commit being released, and the images are built from that
# commit and tagged with the version. A release candidate (`0.4.0-rc.1`) does all of it
# and deploys as a dry run.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: is this a new version
    runs-on: ubuntu-latest
    outputs:
      cut: ${{ steps.version.outputs.cut }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Two commits deep, so the push can be compared with what `main` was before it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A release is a merged *change* to VERSION, not a VERSION that happens to have no
      # tag: the monorepo merge had a 0.2.0 nobody meant to release (Decision 674). By
      # hand, the second condition alone — somebody asked.
      - name: Is this a new version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ] && git diff --quiet HEAD^1 HEAD -- VERSION; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            echo "VERSION did not change in this push; nothing to cut." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "cut=false" >> "$GITHUB_OUTPUT"
            echo "${tag} is already released; nothing to cut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cut=true" >> "$GITHUB_OUTPUT"
            echo "Cutting ${tag} from ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Everything, whatever changed, nine more times for the races, and the cluster suite.
  suite:
    name: the full suite
    needs: [version]
    if: needs.version.outputs.cut == 'true'
    uses: ./.github/workflows/ci.yml
    # Everything any job in `ci.yml` asks for, used or not: GitHub checks a called
    # workflow's permissions before it runs a job, and `ci.yml`'s `images` job — skipped
    # in a full run — asks for `packages: write`. Granting less is a `startup_failure`
    # with no message, which is how the first release through this file ended.
    permissions:
      contents: read
      pull-requests: read
      packages: write
    with:
      full: true
      soak: 9
      cluster: true

  images:
    name: images at ${{ needs.version.outputs.version }}
    needs: [version, suite]
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # The tag, the chart, and a draft release for the native builds to attach to.
  cut:
    name: tag ${{ needs.version.outputs.tag }}
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # The chart's own version and its appVersion are the release's, so an install of
      # this file pulls the images just built rather than whatever `values.yaml` was
      # last edited to say (Decision 322).
      - name: Package the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package charts/troupe --version "$VERSION" --app-version "$VERSION" --destination dist

      # The tag is pushed with this workflow's own token, which starts no other workflow:
      # everything this release needs happens in this run. The release is a draft until
      # the native builds have attached their artifacts (`publish`, below).
      - name: Tag it, and open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
          cat > notes.md <<NOTES
          Everything in this repository at \`${GITHUB_SHA::7}\`, as one release, after the full suite.

          **On a cluster** — the chart, whose images are this version:

              helm upgrade --install troupe \\
                https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/troupe-${VERSION}.tgz \\
                --namespace troupe-system --create-namespace --values my-values.yaml

          Images: \`troupe-plane\`, \`troupe-operator\`, \`troupe-worker\`, \`troupe-a2a\` and \`troupe-gui\`, each tagged \`${VERSION}\`.

          **On a machine** — \`install.sh --tui --gui\` / \`install.ps1 -Tui -Gui\` install \`troupe-daemon\`, \`troupe\` (the TUI) and the desktop app from here; the daemon alone with \`-y\` / \`-Yes\`. The desktop app's installers are attached as well.
          NOTES
          flags=(--draft --verify-tag --title "$TAG" --notes-file notes.md)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" dist/troupe-*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/troupe-*.tgz

  native:
    name: native builds
    needs: [version, cut]
    uses: ./.github/workflows/native.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  # Published once everything is attached, with one SHA256SUMS over all of it.
  publish:
    name: publish ${{ needs.version.outputs.tag }}
    needs: [version, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksums, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE"

  # A release deploys itself (Decision 669). Pushing an image and changing production are
  # still two decisions, but the second is the reviewed merge of a VERSION change, not a
  # laptop session. A release candidate runs everything and deploys as a dry run only.
  #
  # The `production` environment holds `KUBECONFIG` (the `troupe-deployer` account's,
  # from `scripts/ci-kubeconfig`) and `DEPLOY_VALUES` (the deployment's values file), and
  # its variable `PLANE_URL`. Its deployment policy should allow `main` alone, so no pull
  # request can reach them; a required reviewer on it is optional, and makes this job
  # wait for a second person. Each run of this job is a row on the repository's
  # Deployments page: what went where, when, and from which merge.
  deploy:
    name: deploy ${{ needs.version.outputs.version }}
    needs: [version, cut]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PLANE_URL }}
    # One roll at a time, shared with `deploy.yml`: two overlapping `helm upgrade`s on one
    # release is a race whose loser is whichever finished second.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist

      - name: Check this deployment is configured
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          VALUES_CONTENT: ${{ secrets.DEPLOY_VALUES }}
        run: |
          missing=""
          [ -n "${KUBECONFIG_CONTENT}" ] || missing="${missing} KUBECONFIG"
          [ -n "${VALUES_CONTENT}" ] || missing="${missing} DEPLOY_VALUES"
          if [ -n "${missing}" ]; then
            echo "::error title=Deployment not configured::The production environment has no${missing}. KUBECONFIG is the troupe-deployer account's (deploy/ci-deployer.yaml, then scripts/ci-kubeconfig); DEPLOY_VALUES is the deployment's Helm values file."
            exit 1
          fi

      - name: Lay out the credentials
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          VALUES_CONTENT: ${{ secrets.DEPLOY_VALUES }}
        run: |
          mkdir -p .local
          printf '%s' "${KUBECONFIG_CONTENT}" > .local/kubeconfig.yaml
          printf '%s' "${VALUES_CONTENT}" > .local/values.itminds.yaml
          chmod 600 .local/kubeconfig.yaml .local/values.itminds.yaml

      - name: ${{ needs.version.outputs.prerelease == 'true' && 'Render it (a release candidate)' || 'Roll it' }}
        env:
          PLANE_URL: ${{ vars.PLANE_URL }}
          EXPECT_COMMIT: ${{ github.sha }}
          DRY_RUN: ${{ needs.version.outputs.prerelease == 'true' && '--dry-run' || '' }}
        run: scripts/deploy dist/troupe-${{ needs.version.outputs.version }}.tgz $DRY_RUN

      - name: Say what is running
        if: always()
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### production: ${VERSION} — ${OUTCOME}"
            echo
            echo "From \`${GITHUB_SHA::7}\`, started by @${GITHUB_ACTOR}."
          } >> "$GITHUB_STEP_SUMMARY"
