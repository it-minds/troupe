# Temporary (D77, Decision 796): the critical jobs on `ubuntu-26.04`, which `ubuntu-latest`
# becomes from 2026-10-19, to see whether they work there before choosing the runner image
# on purpose. Removed before the pull request it belongs to is ready. No cache, so every
# dependency is fetched and compiled on the new image; nothing is published.
name: trial ubuntu-26.04

on:
  push:
    branches: [ci/d77-runners]
  workflow_dispatch:

concurrency:
  group: trial-ubuntu-26-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.5"
  ZIG_VERSION: "0.16.0"

jobs:
  # `ci.yml`'s `lint` compile and one `test` leg, with what that leg installs: inotify-tools,
  # bubblewrap with the AppArmor sysctl, and the dev services in Docker. Core's sandbox and
  # file-watch suites too, because they are the ones that lean on the kernel.
  umbrella:
    name: umbrella - compile, protocol suite, sandbox and watch
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: cat /etc/os-release && uname -r
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install inotify-tools and bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y inotify-tools bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Postgres, MinIO and OpenBao
        run: scripts/dev-up
      - run: mix deps.get
      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --force --warnings-as-errors
      - name: Migrate the plane's test database
        run: MIX_ENV=test mix ecto.create --quiet && MIX_ENV=test mix ecto.migrate --quiet
      - name: Test troupe_protocol
        run: mix test apps/troupe_protocol/test
      - name: Core's sandbox and file-watch suites
        run: mix test apps/troupe_core/test/troupe/sandbox_test.exs apps/troupe_core/test/troupe/session/files_test.exs

  # `dev-check.yml`'s TUI job: the harness by path, the two locks, a clean compile.
  tui:
    name: the TUI - compile
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/tui
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: The two Mix locks agree
        working-directory: .
        run: elixir scripts/locks-agree.exs
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix troupe.cli.reference --check

  # `ci.yml`'s GUI job.
  gui:
    name: the GUI - tokens, typecheck, build, test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/gui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/gui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm icons:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # `native.yml`'s Linux x86_64 TUI build, Burrito and its ERTS download included, and its
  # smoke test.
  native-tui:
    name: troupe linux_x86_64 - build and smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MIX_ENV: prod
      TROUPE_REAPER_TARGETS: all
      BURRITO_TARGET: linux_x86_64
      TARGET_ABI: musl
    defaults:
      run:
        shell: bash
        working-directory: clients/tui
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install xz and 7z
        run: sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full
      - run: mix deps.get
      - name: Build the release
        run: |
          mix release --overwrite
          ls -la burrito_out
      - name: Smoke test (--version and a headless Fake run in the embedded daemon)
        run: |
          BIN="$PWD/burrito_out/troupe_linux_x86_64"
          chmod +x "$BIN"
          "$BIN" --version
          SMOKE="$RUNNER_TEMP/smoke"; mkdir -p "$SMOKE/.troupe" && cd "$SMOKE"
          TROUPE_PROVIDER=fake TROUPE_MODEL=fake-model \
            TROUPE_FAKE_SCRIPT="$GITHUB_WORKSPACE/clients/tui/fixtures/fake_scripts/smoke.json" \
            "$BIN" run build "smoke" --headless --auto-approve
          test -f hello.txt && cat hello.txt

  # The cheap ones with something of their own on the image: Python for the documentation
  # site and the protocol's Python client, Helm and Docker for the chart's checks, and a
  # downloaded VS Code under a virtual display.
  pages-chart:
    name: the documentation site, and the chart rendered and validated
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: azure/setup-helm@v5
      - name: Render and validate
        run: |
          helm lint charts/troupe --values charts/troupe/values.small.yaml
          helm template troupe charts/troupe --namespace troupe-system --include-crds \
            --values charts/troupe/values.small.yaml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0

  vscode:
    name: the VS Code extension - test inside VS Code, package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: clients/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: A virtual display
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - run: xvfb-run -a pnpm test:vscode
      - run: pnpm package
