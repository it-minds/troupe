<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Troupe">
  <!-- The app tile: the mark on a sunken ground at the heavier 3.0 stroke, with the seam
       line dropped - below 32px the colour change is the seam. -->
  <style>
    .tile { fill: #0B0D10; }
    .ink { fill: #ECEFF3; }
    .reserved { fill: #FF5CB8; }
    .cut { fill: #0A0B0D; }
    .edge { stroke: #ECEFF3; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #E3E6EA; }
      .ink { fill: #0E1013; }
      .reserved { fill: #C11A79; }
      .cut { fill: #FFFFFF; }
      .edge { stroke: #0E1013; }
    }
  </style>
  <defs><clipPath id="troupe-tile-half"><rect x="24" y="0" width="24" height="48"/></clipPath></defs>
  <rect class="tile" x="2" y="2" width="44" height="44" rx="7"/>
  <path class="reserved" d="M11 16 Q11 9 24 9 Q37 9 37 16 L37 25 Q37 34 24 40 Q11 34 11 25 Z" clip-path="url(#troupe-tile-half)"/>
  <path class="edge" d="M11 16 Q11 9 24 9 Q37 9 37 16 L37 25 Q37 34 24 40 Q11 34 11 25 Z" fill="none" stroke-width="3" stroke-linejoin="round"/>
  <path class="ink" d="M15.8 21 Q19.2 18.6 22.6 21 Q19.2 23.4 15.8 21 Z"/>
  <path class="cut" d="M25.4 21 Q28.8 18.6 32.2 21 Q28.8 23.4 25.4 21 Z"/>
</svg>
