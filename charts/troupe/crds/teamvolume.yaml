# A team's shared storage. The plane creates one when a team is enabled; the operator
# binds it into the namespace of every profile that team is granted.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teamvolumes.troupe.dev
  labels:
    app.kubernetes.io/name: troupe
spec:
  group: troupe.dev
  scope: Namespaced
  names:
    kind: TeamVolume
    plural: teamvolumes
    singular: teamvolume
    shortNames: [tvol]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [team, size]
              properties:
                team: {type: string}
                storageClassName: {type: string}
                nfsPath: {type: string}
                nfsServer: {type: string}
                size: {type: string}
            status:
              type: object
              properties:
                claimName: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.team
        - name: Size
          type: string
          jsonPath: .spec.size
