# The boundary between the plane and the cluster.
#
# Cluster-scoped and owned by cluster admins. The plane's RBAC does not include it, so
# the worst a compromised plane can do is submit WorkerProfiles that still have to pass
# it — at admission, in CEL, and again in the operator.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: troupepolicies.troupe.dev
  labels:
    app.kubernetes.io/name: troupe
spec:
  group: troupe.dev
  scope: Cluster
  names:
    kind: TroupePolicy
    plural: troupepolicies
    singular: troupepolicy
    shortNames: [tpol]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                allowedImageRepositories:
                  type: array
                  description: Repositories a profile's image may come from, compared without its tag or digest.
                  items: {type: string}
                maxReplicas: {type: integer, minimum: 1}
                maxSessionsPerPod: {type: integer, minimum: 1}
                maxResources:
                  type: object
                  properties:
                    cpu: {type: string}
                    memory: {type: string}
                allowedEgress:
                  type: array
                  description: >-
                    Hostnames a profile may reach, including its LLM endpoint and MCP
                    servers. '*.example.com' matches exactly one label. A star anywhere
                    else is refused: a bare '*', '**.example.com', '*.*', 'a.*.example.com'.
                  # Bounds that keep the rule's cost estimate within what the API server
                  # accepts. A hostname is at most 253 characters.
                  maxItems: 512
                  items:
                    type: string
                    maxLength: 253
                    # The same test as `Troupe.Policy.pattern?/1` and the admission rule:
                    # an exact name, or `*.` and a domain with no star and no empty label.
                    x-kubernetes-validations:
                      - rule: >-
                          !self.contains('*') ||
                          (self.startsWith('*.') && self.size() > 2 && !self.substring(2).contains('*') &&
                           !self.substring(2).startsWith('.') && !self.endsWith('.') && !self.contains('..'))
                        messageExpression: >-
                          'allowedEgress entry ' + self + ' is not a hostname or a one-label wildcard such as *.example.com'
                allowedStorageClasses:
                  type: array
                  items: {type: string}
                orgVolume:
                  type: object
                  description: The organisation-wide volume, mounted read-only by profiles that opt in.
                  properties:
                    storageClassName: {type: string}
                    size: {type: string}
                    nfsPath: {type: string}
                    nfsServer: {type: string}
                namespacePrefix: {type: string, default: "troupe-w-"}
                workersDomain: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.workersDomain
        - name: Max replicas
          type: integer
          jsonPath: .spec.maxReplicas
