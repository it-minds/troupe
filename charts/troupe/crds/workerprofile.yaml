# One pool of workers. Written by the plane; read by the operator, which never writes
# its spec.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerprofiles.troupe.dev
  labels:
    app.kubernetes.io/name: troupe
spec:
  group: troupe.dev
  scope: Namespaced
  names:
    kind: WorkerProfile
    plural: workerprofiles
    singular: workerprofile
    shortNames: [wp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              # A profile that extends another may leave the image to its parent; one that
              # extends none runs nothing without one.
              x-kubernetes-validations:
                - rule: "has(self.image) || (has(self.extends) && self.extends != '')"
                  message: "spec.image is required unless the profile extends another (spec.extends)"
                # The same rule the plane checks a profile by, of the profile in effect: one
                # that extends another may leave llm.endpoint to its parent, and the plane
                # checks what the two come to. `provider` has no default: one the API
                # server filled in would be a setting nobody wrote, and an `llm: {}` would
                # then be refused for it. The operator reads an absent one as openai.
                - rule: "(has(self.extends) && self.extends != '') || !has(self.llm) || (has(self.llm.endpoint) && self.llm.endpoint != '') || !(has(self.llm.provider) || has(self.llm.model) || has(self.llm.smallModel) || has(self.llm.secretRef) || has(self.llm.prices))"
                  message: "llm settings need llm.endpoint: without it the pods are given none of them and run on Troupe's built-in model settings instead. Set llm.endpoint, or remove the other llm fields."
              properties:
                extends:
                  type: string
                  description: >-
                    The one profile this one extends, by name, in this namespace. Say only what
                    differs: the plane resolves the two and writes the profile in effect into
                    status.effective, which the operator and admission read. Egress hosts, MCP
                    servers and permission rules are added to the parent's; max sessions and
                    the budget can only be lowered; the parent's personalTools forbid,
                    repositoryOverridesBundle false and github.allowPublic false hold; the
                    model key (llm.secretRef), mcpIdentities and the grants are never
                    inherited; any other field is the parent's where this one sets none. The
                    pods wait until the plane has written the status.
                budgetMicros:
                  type: integer
                  minimum: 0
                  description: >-
                    What the sessions on this profile may spend in a calendar month (UTC), in
                    millionths of a dollar, beside the team's, the person's and the platform's
                    ceilings. Absent or 0 is none. A profile that extends another can only
                    lower its parent's. Read by the plane alone.
                permissions:
                  type: object
                  description: >-
                    Per-tool rules every session on this profile's pods obeys, as config's
                    permissions: deny, ask and allow, each a list of rules such as
                    shell(git push), read_file(secrets/**) or mcp(issues.delete). They are
                    an enforced layer: of every rule that matches a call the strictest
                    holds, so a session's own configuration cannot loosen them. A shell deny
                    also refuses a command a person types with ! in a session here. A profile
                    that extends another has its parent's rules as well as its own. The
                    plane checks each rule, and reads them at every activation; no pod
                    restarts.
                  properties:
                    deny:
                      type: array
                      maxItems: 200
                      items: {type: string, minLength: 1, maxLength: 500}
                    ask:
                      type: array
                      maxItems: 200
                      items: {type: string, minLength: 1, maxLength: 500}
                    allow:
                      type: array
                      maxItems: 200
                      items: {type: string, minLength: 1, maxLength: 500}
                image:
                  type: object
                  required: [repository]
                  properties:
                    repository: {type: string}
                    tag: {type: string}
                    digest:
                      type: string
                      description: Wins over tag when both are given, because only a digest pins an image.
                replicas: {type: integer, minimum: 0, default: 1}
                sessionsPerPod: {type: integer, minimum: 1, default: 4}
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                llm:
                  type: object
                  description: >-
                    Where the pods' model calls go and how. Every field but `endpoint` needs
                    `endpoint`, here or from the profile this one extends: without one the pods
                    are given none of these settings.
                  properties:
                    endpoint: {type: string}
                    provider:
                      type: string
                      enum: [anthropic, openai, ollama, openrouter, azure_openai, gemini, fake]
                      description: >-
                        Which API the endpoint speaks: one of the provider types
                        (docs/user/configuration.md, Provider types). Absent is `openai`, plain
                        Chat Completions, which is what a gateway serves; `azure_openai` needs the
                        resource's own address as the endpoint, and `ollama` takes no key.
                    model: {type: string}
                    smallModel:
                      type: string
                      description: Used only for conversation summarisation, where a cheaper model is enough.
                    prices:
                      type: object
                      description: >-
                        Dollars per million tokens, by model, for models the gateway does not
                        price on a streamed call. The pods get them as TROUPE_MODEL_PRICES
                        (models.prices); a model with no price counts as free on the ledger.
                      additionalProperties:
                        type: object
                        required: [input, output]
                        properties:
                          input: {type: number, minimum: 0}
                          output: {type: number, minimum: 0}
                          cacheRead:
                            type: number
                            minimum: 0
                            description: Absent means the input price.
                          cacheWrite:
                            type: number
                            minimum: 0
                            description: Absent means the input price.
                    secretRef:
                      type: object
                      description: >-
                        The Secret holding the model key, by name, kept in the plane's namespace:
                        the operator copies it into the worker namespace at every pass. One of
                        that name already in the worker namespace is used where the plane's
                        namespace has none.
                      properties:
                        name: {type: string}
                        key: {type: string, default: api-key}
                mcpServers:
                  type: array
                  description: >-
                    Written by the plane from the channel's config bundle. The credential
                    is a Secret, kept in the plane's namespace and copied into the worker
                    namespace by the operator; nothing here is a value.
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name: {type: string}
                      url: {type: string}
                      secretRef:
                        type: object
                        properties:
                          name: {type: string}
                          key: {type: string, default: token}
                      credentialRef:
                        type: string
                        pattern: '^[A-Z][A-Z0-9_]*$'
                        description: >-
                          The environment variable the token is injected as. Absent means
                          TROUPE_MCP_<NAME>_TOKEN. Profile mode only.
                      credentialMode:
                        type: string
                        enum: [profile, person, client_credentials]
                        default: profile
                        description: >-
                          Whose credential goes out with a call. `profile` is the service
                          account in secretRef, the same for every session. `person` is
                          the session's owner, read from the key manager at
                          troupe/people/<name>/mcp/<slot> by the pod alone — there is
                          no Secret and nothing here for the operator to mount.
                          `client_credentials` is the profile's own identity, the entry of
                          mcpIdentities for this server: a token got with an assertion
                          signed through OpenBao transit, and no Secret either.
                      credentialSlot:
                        type: string
                        pattern: '^[a-z][a-z0-9-]*$'
                        description: >-
                          Person mode only: the slot under the person the value lives in.
                          A name, never a value.
                      header:
                        type: string
                        description: The header the token is sent in. Absent means authorization.
                      timeoutMs: {type: integer, minimum: 1}
                mcpIdentities:
                  type: array
                  description: >-
                    Who this profile is at the MCP servers its bundle calls with client
                    credentials, one entry per server: the client registered for it at the
                    identity provider, and the OpenBao transit key that signs the client's
                    assertion with the thumbprint of the certificate registered for that
                    key. Nothing here is secret; the private key never leaves OpenBao. The
                    owner's to write, never the plane's.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [server]
                  items:
                    type: object
                    required: [server, clientId, transitKey, certificateThumbprint]
                    properties:
                      server:
                        type: string
                        description: The bundle's name for the server.
                      clientId: {type: string, minLength: 1}
                      scope:
                        type: string
                        description: The scope a token is asked for, such as api://<app>/.default.
                      tokenUrl:
                        type: string
                        description: >-
                          The token endpoint. Absent means the one the server's authorization
                          server publishes in its metadata, whose host egress.fqdns must then
                          name.
                      transitKey:
                        type: string
                        minLength: 1
                        description: >-
                          The transit key that signs, named <worker namespace>.<anything> so
                          that the pods of this profile alone may sign with it.
                      keyVersion:
                        type: integer
                        minimum: 1
                        description: >-
                          The key version to sign with. Absent means the latest; set it with
                          the thumbprint, in one change, to rotate without a gap.
                      certificateThumbprint:
                        type: string
                        description: >-
                          The SHA-256 thumbprint of the certificate registered for the key, as
                          the assertion's x5t#S256 carries it (base64url) or as 64 hex digits.
                      algorithm:
                        type: string
                        enum: [RS256, PS256]
                        default: RS256
                egress:
                  type: object
                  properties:
                    fqdns:
                      type: array
                      items: {type: string}
                    gitHosts:
                      type: array
                      items: {type: string}
                github:
                  type: object
                  description: >-
                    What a session on this profile may do on GitHub through the plane's App,
                    beyond cloning the repository it names. The fix loop's token is narrowed
                    to these and to the one repository. Absent, a session clones and does no
                    more.
                    The plane reads it at every token it mints; no pod restarts.
                  properties:
                    permissions:
                      type: object
                      description: >-
                        GitHub's own permission names. contents write pushes the session's
                        troupe/* branch, pull_requests write opens its draft pull request and
                        comments on it, checks and statuses read its CI.
                      properties:
                        contents: {type: string, enum: [read, write]}
                        pull_requests: {type: string, enum: [read, write]}
                        checks: {type: string, enum: [read]}
                        statuses: {type: string, enum: [read]}
                    allowPublic:
                      type: boolean
                      description: >-
                        Whether a session may push to, and open a pull request on, a
                        repository GitHub reports as public. Absent or false, private and
                        internal repositories only; the pod asks GitHub at every push.
                    denyPaths:
                      type: array
                      maxItems: 100
                      items: {type: string, minLength: 1, maxLength: 200}
                      description: >-
                        Paths a push never carries, as .gitignore patterns, added to the
                        defaults (.env, .env.*, *.pem, *.key, *.p12, *.pfx and SSH private
                        keys), which cannot be taken away. A push whose tree adds or changes
                        one is refused, naming it, and nothing reaches GitHub.
                    maxPushes:
                      type: integer
                      minimum: 1
                      maximum: 1000
                      description: >-
                        Pushes a run may make. A run that asks for one more stops, as three
                        red CI rounds stop it, with a comment on its pull request. The lower
                        of this and its team's cap holds.
                    maxRuns:
                      type: integer
                      minimum: 1
                      maximum: 1000
                      description: >-
                        Runs on a GitHub repository that triggers may have going at once on
                        this profile; a firing over it is skipped. The team may set a lower
                        one of its own.
                    maxAttempts:
                      type: integer
                      minimum: 1
                      maximum: 1000
                      description: >-
                        Runs a trigger's sweep may start on one issue that end without a fix
                        before it leaves the issue for a person, who asks again with the
                        label, the command or the console's fix this. The lower of this and
                        the team's holds; one where neither is set.
                configBundleChannel: {type: string, default: stable}
                storage:
                  type: object
                  description: >-
                    Each pod's own disk, where the working copies of its live sessions are.
                    Fixed once the pods exist: a StatefulSet's volume claim template cannot
                    be changed, so a different size or class means a new pool.
                  properties:
                    size:
                      type: string
                      default: 20Gi
                    storageClassName:
                      type: string
                      description: >-
                        Must be in the TroupePolicy's allowedStorageClasses. Absent means the
                        cluster's default class.
                orgMount:
                  type: boolean
                  default: false
                  description: Mount the org volume from TroupePolicy. Always read-only.
                repositoryOverridesBundle:
                  type: boolean
                  description: >-
                    Let a session's working copy replace the bundle's agents and skills, and
                    the built-in agents, of the same name with its own .troupe/agents,
                    .troupe/skills and .agents/skills. Absent or false, those win on this
                    profile's pods and the working copy's files of their names are skipped
                    and listed.
                    The plane reads it at every activation; no pod restarts.
                personalTools:
                  type: string
                  enum: [allow, forbid]
                  description: >-
                    Whether a person may offer a session on this profile's pods the tools of
                    MCP servers they signed in to on their own machine, which run there with
                    their sign-in (tools.register). Absent or allow, they may. forbid, the
                    pods refuse the offer with a sentence naming this setting, log it, and
                    register nothing.
                    The plane reads it at every activation; no pod restarts.
                teams:
                  type: array
                  description: >-
                    A projection of the plane's grants, not a second source of truth.
                    The plane derives and rewrites this; nothing else edits it.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      claimName: {type: string}
                      storageClassName: {type: string}
                      size: {type: string}
                      mode:
                        type: string
                        enum: [ro, rw]
                        default: ro
            status:
              type: object
              properties:
                effective:
                  type: object
                  description: >-
                    Written by the plane, for a profile that extends another: the profile in
                    effect, resolved from its chain. The operator and admission read spec
                    from here, with replicas, teams and mcpServers from the resource's own
                    spec, which the plane writes there for every profile.
                  properties:
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: The flat spec the pods run, as a profile that extends nothing writes it.
                    chain:
                      type: array
                      description: The profiles it was resolved from, the one that extends nothing first.
                      items: {type: string}
                    from:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: >-
                        Where each field came from: a path such as spec.llm.model and the
                        profile that gave it, or for a list, each item and its profile.
                    revision:
                      type: string
                      description: A hash of spec, which the operator records once it has run it.
                    observedGeneration:
                      type: integer
                      description: The generation of this resource the plane resolved.
                effectiveRevision:
                  type: string
                  description: >-
                    The operator's: the status.effective.revision it last reconciled, so a
                    change the plane makes there is acted on at once.
                observedGeneration: {type: integer}
                readyReplicas: {type: integer}
                namespace: {type: string}
                copiedSecrets:
                  type: array
                  description: >-
                    The operator's: the Secrets it copied into the worker namespace from the
                    plane's, so a copy the profile stops naming is deleted at the next pass.
                  items: {type: string}
                podsBehind:
                  type: array
                  description: >-
                    Pods on an older revision than the StatefulSet's, which the plane drains
                    once they hold no active session. The plane records a finished drain in
                    the troupe.dev/drained annotation, and the operator then replaces the pod.
                  items:
                    type: object
                    required: [pod]
                    properties:
                      pod: {type: string}
                      uid: {type: string}
                      revision: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Violation
          type: string
          jsonPath: .status.conditions[?(@.type=="PolicyViolation")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
