# One pool of workers. Written by the plane; read by the operator, which never writes
# its spec.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerprofiles.troupe.dev
  labels:
    app.kubernetes.io/name: troupe
spec:
  group: troupe.dev
  scope: Namespaced
  names:
    kind: WorkerProfile
    plural: workerprofiles
    singular: workerprofile
    shortNames: [wp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: object
                  required: [repository]
                  properties:
                    repository: {type: string}
                    tag: {type: string}
                    digest:
                      type: string
                      description: Wins over tag when both are given, because only a digest pins an image.
                replicas: {type: integer, minimum: 0, default: 1}
                sessionsPerPod: {type: integer, minimum: 1, default: 4}
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                llm:
                  type: object
                  properties:
                    endpoint: {type: string}
                    provider:
                      type: string
                      enum: [anthropic, openai, fake]
                      default: openai
                      description: Which adapter speaks to the endpoint. `openai` is plain Chat Completions, which is what a gateway serves.
                    model: {type: string}
                    smallModel:
                      type: string
                      description: Used only for conversation summarisation, where a cheaper model is enough.
                    prices:
                      type: object
                      description: >-
                        Dollars per million tokens, by model, for models the gateway does not
                        price on a streamed call. The pods get them as TROUPE_MODEL_PRICES
                        (models.prices); a model with no price counts as free on the ledger.
                      additionalProperties:
                        type: object
                        required: [input, output]
                        properties:
                          input: {type: number, minimum: 0}
                          output: {type: number, minimum: 0}
                          cacheRead:
                            type: number
                            minimum: 0
                            description: Absent means the input price.
                          cacheWrite:
                            type: number
                            minimum: 0
                            description: Absent means the input price.
                    secretRef:
                      type: object
                      properties:
                        name: {type: string}
                        key: {type: string, default: api-key}
                mcpServers:
                  type: array
                  description: >-
                    Written by the plane from the channel's config bundle. The credential
                    is a Secret in the worker namespace; nothing here is a value.
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name: {type: string}
                      url: {type: string}
                      secretRef:
                        type: object
                        properties:
                          name: {type: string}
                          key: {type: string, default: token}
                      credentialRef:
                        type: string
                        pattern: '^[A-Z][A-Z0-9_]*$'
                        description: >-
                          The environment variable the token is injected as. Absent means
                          TROUPE_MCP_<NAME>_TOKEN. Profile mode only.
                      credentialMode:
                        type: string
                        enum: [profile, person, client_credentials]
                        default: profile
                        description: >-
                          Whose credential goes out with a call. `profile` is the service
                          account in secretRef, the same for every session. `person` is
                          the session's owner, read from the key manager at
                          troupe/people/<name>/mcp/<slot> by the pod alone — there is
                          no Secret and nothing here for the operator to mount.
                          `client_credentials` is the profile's own identity, the entry of
                          mcpIdentities for this server: a token got with an assertion
                          signed through OpenBao transit, and no Secret either.
                      credentialSlot:
                        type: string
                        pattern: '^[a-z][a-z0-9-]*$'
                        description: >-
                          Person mode only: the slot under the person the value lives in.
                          A name, never a value.
                      header:
                        type: string
                        description: The header the token is sent in. Absent means authorization.
                      timeoutMs: {type: integer, minimum: 1}
                mcpIdentities:
                  type: array
                  description: >-
                    Who this profile is at the MCP servers its bundle calls with client
                    credentials, one entry per server: the client registered for it at the
                    identity provider, and the OpenBao transit key that signs the client's
                    assertion with the thumbprint of the certificate registered for that
                    key. Nothing here is secret; the private key never leaves OpenBao. The
                    owner's to write, never the plane's.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [server]
                  items:
                    type: object
                    required: [server, clientId, transitKey, certificateThumbprint]
                    properties:
                      server:
                        type: string
                        description: The bundle's name for the server.
                      clientId: {type: string, minLength: 1}
                      scope:
                        type: string
                        description: The scope a token is asked for, such as api://<app>/.default.
                      tokenUrl:
                        type: string
                        description: >-
                          The token endpoint. Absent means the one the server's authorization
                          server publishes in its metadata, whose host egress.fqdns must then
                          name.
                      transitKey:
                        type: string
                        minLength: 1
                        description: >-
                          The transit key that signs, named <worker namespace>.<anything> so
                          that the pods of this profile alone may sign with it.
                      keyVersion:
                        type: integer
                        minimum: 1
                        description: >-
                          The key version to sign with. Absent means the latest; set it with
                          the thumbprint, in one change, to rotate without a gap.
                      certificateThumbprint:
                        type: string
                        description: >-
                          The SHA-256 thumbprint of the certificate registered for the key, as
                          the assertion's x5t#S256 carries it (base64url) or as 64 hex digits.
                      algorithm:
                        type: string
                        enum: [RS256, PS256]
                        default: RS256
                egress:
                  type: object
                  properties:
                    fqdns:
                      type: array
                      items: {type: string}
                    gitHosts:
                      type: array
                      items: {type: string}
                configBundleChannel: {type: string, default: stable}
                storage:
                  type: object
                  description: >-
                    Each pod's own disk, where the working copies of its live sessions are.
                    Fixed once the pods exist: a StatefulSet's volume claim template cannot
                    be changed, so a different size or class means a new pool.
                  properties:
                    size:
                      type: string
                      default: 20Gi
                    storageClassName:
                      type: string
                      description: >-
                        Must be in the TroupePolicy's allowedStorageClasses. Absent means the
                        cluster's default class.
                orgMount:
                  type: boolean
                  default: false
                  description: Mount the org volume from TroupePolicy. Always read-only.
                repositoryOverridesBundle:
                  type: boolean
                  description: >-
                    Let a session's working copy replace the bundle's agents and skills of
                    the same name with its own .troupe/agents, .troupe/skills and
                    .agents/skills. Absent or false, the bundle's win on this profile's pods
                    and the working copy's files of those names are skipped and listed.
                    The plane reads it at every activation; no pod restarts.
                teams:
                  type: array
                  description: >-
                    A projection of the plane's grants, not a second source of truth.
                    The plane derives and rewrites this; nothing else edits it.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      claimName: {type: string}
                      storageClassName: {type: string}
                      size: {type: string}
                      mode:
                        type: string
                        enum: [ro, rw]
                        default: ro
            status:
              type: object
              properties:
                observedGeneration: {type: integer}
                readyReplicas: {type: integer}
                namespace: {type: string}
                podsBehind:
                  type: array
                  description: >-
                    Pods on an older revision than the StatefulSet's, which the plane drains
                    once they hold no active session. The plane records a finished drain in
                    the troupe.dev/drained annotation, and the operator then replaces the pod.
                  items:
                    type: object
                    required: [pod]
                    properties:
                      pod: {type: string}
                      uid: {type: string}
                      revision: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Violation
          type: string
          jsonPath: .status.conditions[?(@.type=="PolicyViolation")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
