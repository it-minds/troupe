{{- if .Values.admission.install }}
# The same rules the operator checks, in CEL, at admission.
#
# Two checks for two different failures. This one gives the person who submitted a
# profile an error at the moment they ask, and keeps the object out of the API server
# entirely. The operator's copy is the one that still holds when admission is
# unavailable, when the policy tightened after a profile was already admitted, or when
# someone edits a resource while this policy is absent. Neither covers the other's case.
#
# `paramKind` points at TroupePolicy itself, so there is one place the limits are
# written and the CEL reads them rather than repeating them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: troupe-worker-profile-policy
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: troupe.dev/v1alpha1
    kind: TroupePolicy
  matchConstraints:
    resourceRules:
      - apiGroups: ["troupe.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["workerprofiles", "workerprofiles/status"]
  # The status is the operator's and the plane's, and one block of it is a profile: the
  # profile in effect the plane writes for one that extends another, which is what its pods
  # run. A write to the status is judged when it changes that block and at no other time,
  # because the operator's own conditions must still be written when the policy has
  # tightened under a profile: that is how it says so.
  # A request to the resource itself carries no `subResource` at all, rather than an empty one.
  matchConditions:
    - name: the-spec-or-the-profile-in-effect
      expression: >-
        !has(request.subResource) || request.subResource != 'status' ||
        (has(object.status) && has(object.status.effective) &&
          (!has(oldObject.status) || !has(oldObject.status.effective) ||
            object.status.effective != oldObject.status.effective))
  variables:
    # A profile that extends another runs the spec the plane wrote into its status, with the
    # replicas, teams and MCP servers the plane writes onto every spec. Until the plane has
    # written it, the spec as written is judged: what differs from the parent, which may
    # leave the image to it.
    - name: extends
      expression: "has(object.spec.extends) && object.spec.extends != ''"
    - name: spec
      expression: >-
        variables.extends && has(object.status) && has(object.status.effective) &&
          has(object.status.effective.spec)
          ? object.status.effective.spec : object.spec
    - name: repository
      expression: "has(variables.spec.image) ? variables.spec.image.repository : ''"
    # Every host the profile would reach: its declared FQDNs and git hosts, plus the
    # LLM endpoint, every MCP server and every token endpoint its identities name. A
    # profile that could name any endpoint could send a team's code anywhere, so those
    # count as egress too.
    - name: endpoints
      expression: >-
        (has(variables.spec.llm) && has(variables.spec.llm.endpoint) && isURL(variables.spec.llm.endpoint)
          ? [url(variables.spec.llm.endpoint).getHostname()] : []) +
        (has(object.spec.mcpServers)
          ? object.spec.mcpServers.filter(s, isURL(s.url)).map(s, url(s.url).getHostname()) : []) +
        (has(variables.spec.mcpIdentities)
          ? variables.spec.mcpIdentities.filter(i, has(i.tokenUrl) && isURL(i.tokenUrl)).map(i, url(i.tokenUrl).getHostname()) : [])
    - name: declared
      expression: >-
        (has(variables.spec.egress) && has(variables.spec.egress.fqdns) ? variables.spec.egress.fqdns : []) +
        (has(variables.spec.egress) && has(variables.spec.egress.gitHosts) ? variables.spec.egress.gitHosts : [])
    - name: hosts
      expression: variables.endpoints + variables.declared
    - name: allowedEgress
      expression: "has(params.spec.allowedEgress) ? params.spec.allowedEgress : []"
    # What is not a pattern, on either side: a star anywhere but as the whole first label
    # of `*.` and a domain with no empty label. A bare `*` is every name to Cilium and `**.`
    # any number of labels, so neither may reach the operator's rules. The same test as
    # `Troupe.Policy.pattern?/1`, written out twice because CEL has no functions.
    - name: notPatternsAllowed
      expression: >-
        variables.allowedEgress.filter(p, p.contains('*') &&
          !(p.startsWith('*.') && p.size() > 2 && !p.substring(2).contains('*') &&
            !p.substring(2).startsWith('.') && !p.endsWith('.') && !p.contains('..')))
    - name: notPatternsAsked
      expression: >-
        variables.hosts.filter(h, h.contains('*') &&
          !(h.startsWith('*.') && h.size() > 2 && !h.substring(2).contains('*') &&
            !h.substring(2).startsWith('.') && !h.endsWith('.') && !h.contains('..')))
    # Every storage class the profile names: one per team volume that asks for one, and
    # the pod's own data volume when it does. A profile that could name any class could
    # put a working copy on whatever the cluster has, which is what the policy's list
    # exists to prevent.
    - name: storageClasses
      expression: >-
        (has(object.spec.teams)
          ? object.spec.teams.filter(t, has(t.storageClassName)).map(t, t.storageClassName) : []) +
        (has(variables.spec.storage) && has(variables.spec.storage.storageClassName)
          ? [variables.spec.storage.storageClassName] : [])
  validations:
    - expression: >-
        (variables.extends && !has(variables.spec.image)) ||
        (has(params.spec.allowedImageRepositories) &&
          params.spec.allowedImageRepositories.exists(r,
            variables.repository == r || variables.repository.startsWith(r + '/')))
      messageExpression: "'image repository ' + variables.repository + ' is not allowed by TroupePolicy'"
      reason: Forbidden

    - expression: "!has(object.spec.replicas) || object.spec.replicas <= params.spec.maxReplicas"
      messageExpression: "'replicas is above the maximum of ' + string(params.spec.maxReplicas)"
      reason: Forbidden

    - expression: >-
        !has(variables.spec.sessionsPerPod) ||
        !has(params.spec.maxSessionsPerPod) ||
        variables.spec.sessionsPerPod <= params.spec.maxSessionsPerPod
      messageExpression: "'sessionsPerPod is above the maximum of ' + string(params.spec.maxSessionsPerPod)"
      reason: Forbidden

    - expression: >-
        !has(variables.spec.resources) || !has(variables.spec.resources.limits) ||
        !has(variables.spec.resources.limits.cpu) || !has(params.spec.maxResources) ||
        !has(params.spec.maxResources.cpu) ||
        quantity(string(variables.spec.resources.limits.cpu))
          .isLessThan(quantity(string(params.spec.maxResources.cpu))) ||
        quantity(string(variables.spec.resources.limits.cpu))
          .compareTo(quantity(string(params.spec.maxResources.cpu))) == 0
      messageExpression: "'cpu limit is above the maximum of ' + string(params.spec.maxResources.cpu)"
      reason: Forbidden

    - expression: >-
        !has(variables.spec.resources) || !has(variables.spec.resources.limits) ||
        !has(variables.spec.resources.limits.memory) || !has(params.spec.maxResources) ||
        !has(params.spec.maxResources.memory) ||
        quantity(string(variables.spec.resources.limits.memory))
          .isLessThan(quantity(string(params.spec.maxResources.memory))) ||
        quantity(string(variables.spec.resources.limits.memory))
          .compareTo(quantity(string(params.spec.maxResources.memory))) == 0
      messageExpression: "'memory limit is above the maximum of ' + string(params.spec.maxResources.memory)"
      reason: Forbidden

    # A policy that holds something that is not a pattern admits no profile until it is
    # taken out: what its author meant by it is not something anybody can know.
    - expression: variables.notPatternsAllowed.size() == 0
      messageExpression: >-
        'the TroupePolicy allowedEgress entry ' + variables.notPatternsAllowed.join(', ') +
        ' is not a hostname or a one-label wildcard such as *.example.com, and the policy admits no profile until it is removed'
      reason: Forbidden

    - expression: variables.notPatternsAsked.size() == 0
      messageExpression: >-
        'egress entry ' + variables.notPatternsAsked.join(', ') +
        ' is not a hostname or a one-label wildcard such as *.example.com'
      reason: Forbidden

    # `*.example.com` matches exactly one label, as it does everywhere else that syntax
    # appears: the host must end with the suffix and what is left in front of it must
    # contain no dot of its own. What is not a pattern is refused above, and covers
    # nothing here.
    - expression: >-
        variables.hosts.all(h, h in variables.notPatternsAsked ||
          variables.allowedEgress.exists(p, !(p in variables.notPatternsAllowed) &&
            (h == p ||
             (p.startsWith('*.') && h.endsWith(p.substring(1)) && h.size() > p.size() - 1 &&
              !h.substring(0, h.size() - (p.size() - 1)).contains('.')))))
      messageExpression: >-
        'egress to ' + variables.hosts.filter(h, !(h in variables.notPatternsAsked) &&
          !variables.allowedEgress.exists(p, !(p in variables.notPatternsAllowed) &&
            (h == p ||
             (p.startsWith('*.') && h.endsWith(p.substring(1)) && h.size() > p.size() - 1 &&
              !h.substring(0, h.size() - (p.size() - 1)).contains('.'))))).join(', ') +
        ' is outside the patterns allowed by TroupePolicy'
      reason: Forbidden

    - expression: >-
        variables.storageClasses.all(c,
          has(params.spec.allowedStorageClasses) && params.spec.allowedStorageClasses.exists(a, a == c))
      messageExpression: "'a volume asks for a storage class the TroupePolicy does not allow'"
      reason: Forbidden

    - expression: "!has(variables.spec.orgMount) || !variables.spec.orgMount || has(params.spec.orgVolume)"
      message: "orgMount is set but the TroupePolicy offers no org volume"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: troupe-worker-profile-policy
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  policyName: troupe-worker-profile-policy
  validationActions: [Deny]
  paramRef:
    name: {{ .Values.policy.name }}
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector: {}
{{- end }}
