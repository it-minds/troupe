{{/*
The GUI's selector labels. Here rather than in `_helpers.tpl`, as the A2A facade's are, so
the whole of the GUI is one template that `gui.enabled` switches on and off.
*/}}
{{- define "troupe.gui.selectorLabels" -}}
app.kubernetes.io/name: troupe
app.kubernetes.io/component: gui
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}

{{- define "troupe.gui.base" -}}
{{- $base := trimSuffix "/" .Values.gui.basePath -}}
{{- if and $base (ne $base "/") }}{{ $base }}{{ end -}}
{{- end -}}

{{- define "troupe.console.base" -}}
{{- $base := trimSuffix "/" .Values.console.basePath -}}
{{- if and $base (ne $base "/") }}{{ $base }}{{ end -}}
{{- end -}}

{{/*
Whether the image runs at all: it serves the GUI, the console, or both, and either is
reason to run it. "true" or empty.
*/}}
{{- define "troupe.gui.served" -}}
{{- if and .Values.plane.enabled (or .Values.gui.enabled .Values.console.enabled) }}true{{ end -}}
{{- end -}}

{{- if include "troupe.gui.served" . }}
{{- if and .Values.gui.enabled (not (include "troupe.gui.base" .)) }}
{{- fail "gui.basePath is the root of the plane's host, which the plane itself serves. Mount the GUI under a path, such as /app." }}
{{- end }}
{{- if and .Values.console.enabled (not (include "troupe.console.base" .)) }}
{{- fail "console.basePath is the root of the plane's host, which the plane itself serves. Mount the console under a path, such as /console." }}
{{- end }}
{{- if and .Values.gui.enabled .Values.console.enabled (eq (include "troupe.gui.base" .) (include "troupe.console.base" .)) }}
{{- fail "gui.basePath and console.basePath are the same path. The GUI and the console are two apps, and each needs a path of its own." }}
{{- end }}
# The graphical client (`clients/gui`), served at `gui.basePath` on the plane's own host,
# and the administrative console beside it at `console.basePath`.
#
# It was a release of its own with its own chart, installed beside this one onto the
# same host; it is part of this chart now, on by default, because the product is the
# platform and a client to use it with (Decision 670). It is a protocol client and
# nothing else: static files behind nginx, no secrets, no database, no ServiceAccount
# privileges, nothing configured at runtime — what it serves was decided when the image
# was built. A cluster whose people bring their own client sets `gui.enabled: false` and
# points `plane.appUrl` at it.
#
# The console is an app of its own, built into the same image: the one Deployment runs
# while either is enabled, and each has an Ingress of its own, so either can be turned off
# without the other. It is on the plane's own origin, so its calls to `/rpc` need no CORS
# entry, and it opens no socket to a worker, so it needs no worker origin either.
apiVersion: v1
kind: Service
metadata:
  name: troupe-gui
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "troupe.gui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troupe-gui
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gui.replicas }}
  selector:
    matchLabels: {{- include "troupe.gui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "troupe.labels" . | nindent 8 }}
        app.kubernetes.io/component: gui
    spec:
      {{- with .Values.imagePullSecrets }}
      # Names, as every other deployment here renders them. The standalone GUI chart
      # this came from took maps, and `toYaml` over names produced bare strings, which
      # the API server refuses at apply time and nothing in CI rendered with a name set.
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      # Nothing here reads a file it did not ship with, so the whole filesystem can be
      # read-only bar the two directories nginx writes its own scratch into.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gui
          image: "{{ .Values.gui.image.repository }}:{{ .Values.gui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Static files and no upstream: if nginx answers, it is serving, and there is
          # no second thing for readiness to mean.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.gui.resources | nindent 12 }}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
{{- if .Values.gui.enabled }}
---
{{- $base := include "troupe.gui.base" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: troupe-gui
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
  annotations:
    # The bundle is served from the container's root and its asset URLs carry the base
    # path, so the prefix is stripped on the way in: `{{ $base }}/assets/x.js` becomes
    # `/assets/x.js`, and `{{ $base }}/anything` becomes `/anything`, which the SPA
    # fallback turns into `index.html`. Done here rather than in the image, so the
    # container does not know where it is mounted.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # No cert-manager annotation: this is the plane's host, and the plane's Ingress is
    # what asks for its certificate. Two Ingresses on one host share one secret.
spec:
  ingressClassName: {{ .Values.plane.ingressClassName }}
  {{- if .Values.plane.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.plane.host | quote }}]
      secretName: {{ .Values.plane.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.plane.host | quote }}
      http:
        paths:
          # `ImplementationSpecific` because the capture groups the rewrite refers to are
          # nginx's, not the Ingress API's. `(/|$)` is what makes both `{{ $base }}` and
          # `{{ $base }}/` reach the app rather than only the second.
          - path: {{ printf "%s(/|$)(.*)" $base | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: troupe-gui
                port: {name: http}
{{- end }}
{{- if .Values.console.enabled }}
---
{{- $base := include "troupe.console.base" . }}
# The console, at `console.basePath` on the plane's host, from the same image. The image
# serves it at `/console/`, so the prefix is rewritten to that rather than stripped:
# `{{ $base }}/assets/x.js` becomes `/console/assets/x.js`, and a deep link anywhere under
# it the console's own `index.html`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: troupe-console
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /console/$2
spec:
  ingressClassName: {{ .Values.plane.ingressClassName }}
  {{- if .Values.plane.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.plane.host | quote }}]
      secretName: {{ .Values.plane.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.plane.host | quote }}
      http:
        paths:
          - path: {{ printf "%s(/|$)(.*)" $base | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: troupe-gui
                port: {name: http}
{{- end }}
{{- end }}
