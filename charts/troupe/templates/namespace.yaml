{{- $level := include "troupe.podSecurity.level" . }}
{{- if .Values.createNamespace }}
# Kept when the release goes: `helm uninstall`, a reinstall, or a GitOps controller's
# remediation that uninstalls would otherwise delete the namespace and everything in it,
# whoever put it there (an OpenBao beside the plane, the Secrets the chart expects, volume
# claims). Removing it is a deliberate `kubectl delete namespace`.
#
# With the Pod Security level its pods need (`podSecurity`), for enforce, audit and warn,
# so a cluster whose default level is higher admits them. The operator labels each worker
# namespace the same way, with the level the worker pods need.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{- include "troupe.labels" . | nindent 4 }}
    {{- if .Values.podSecurity.labels }}
    pod-security.kubernetes.io/enforce: {{ $level }}
    pod-security.kubernetes.io/audit: {{ $level }}
    pod-security.kubernetes.io/warn: {{ $level }}
    {{- end }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
