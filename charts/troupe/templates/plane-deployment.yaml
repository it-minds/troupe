{{- if .Values.plane.enabled }}
{{- include "troupe.plane.validate" . }}
# The plane: the admin panel, the harness API, and the control listener workers dial.
#
# Two Services on purpose. `troupe-plane` is what the Ingress routes to, and it carries
# HTTP only. `troupe-plane-control` is the port workers dial and is never exposed through
# an Ingress — a control channel reachable from outside the cluster would be the plane
# in the data path of every session, which the spec forbids.
apiVersion: v1
kind: Service
metadata:
  name: troupe-plane
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  selector: {{- include "troupe.plane.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.plane.httpPort }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: troupe-plane-control
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  selector: {{- include "troupe.plane.selectorLabels" . | nindent 4 }}
  ports:
    - name: control
      port: {{ .Values.plane.controlPort }}
      targetPort: control
---
# Migrations run once per release, before the new pods start, and not from the
# application's own boot: two replicas starting at once would both migrate, and a
# migration that failed would look like a plane that would not start.
apiVersion: batch/v1
kind: Job
metadata:
  name: troupe-plane-migrate
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # A failed migration is kept: deleting it would take its logs with it, and the logs
    # are the only thing that says what went wrong.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {{- include "troupe.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: troupe-plane
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      # Kubernetes injects a `<SERVICE>_PORT=tcp://ip:port` variable for every Service in
      # the namespace, for compatibility with Docker links. `troupe-plane-control`
      # becomes `TROUPE_PLANE_CONTROL_PORT`, which is exactly the name this release reads
      # a port number from — and a release whose config provider is handed
      # "tcp://10.96.85.27:4001" does not start. Nothing here uses service links.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "{{ .Values.plane.image.repository }}:{{ .Values.plane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.plane.image.pullPolicy }}
          command: ["/app/bin/troupe_plane", "eval", "Troupe.Plane.Release.migrate()"]
          env:
            # The same `+Q` the plane's own pods set, and for the same reason: left to
            # `RLIMIT_NOFILE` the port table is 1.5GB, allocated before `eval` has loaded
            # a module, and the Job is OOMKilled in a second with an empty log — which
            # looks exactly like a migration that failed. No `+S` here: a one-shot eval
            # is not worth a downward-API lookup.
            - name: ERL_FLAGS
              value: "+Q {{ .Values.plane.maxPorts }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.database.secretName }}
                  key: {{ .Values.plane.database.secretKey }}
            # `runtime.exs` refuses to configure a plane without one, and a migration is
            # a plane booting far enough to reach its repo.
            - name: TROUPE_PLANE_AUTOSTART
              value: "false"
            - name: RELEASE_DISTRIBUTION
              value: "none"
          resources: {{- toYaml .Values.plane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}
          {{- if not .Values.bao.tokenSecretName }}
          volumeMounts:
            - name: bao-token
              mountPath: /var/run/secrets/troupe
              readOnly: true
          {{- end }}
      {{- if not .Values.bao.tokenSecretName }}
      volumes:
        - name: bao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: bao-token
                  audience: troupe-kms
                  expirationSeconds: 3600
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troupe-plane
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.plane.replicas }}
  # Three old ReplicaSets is enough to roll back through; the default of ten is clutter
  # in a namespace somebody has to read.
  revisionHistoryLimit: 3
  {{- if or (eq (int .Values.plane.replicas) 1) (ne .Values.plane.distribution "name") }}
  # Recreate, not RollingUpdate. A rolling update of a single replica briefly runs two
  # pods, and two unclustered planes are two planes: both place sessions, both reserve
  # budget, neither knows about the other. The cost is a few seconds without a plane
  # during an upgrade, during which live sessions carry on — the plane is not in their
  # data path — and workers reconnect to the control port when it is back.
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {{- include "troupe.plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "troupe.plane.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: troupe-plane
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      # Kubernetes injects a `<SERVICE>_PORT=tcp://ip:port` variable for every Service in
      # the namespace, for compatibility with Docker links. `troupe-plane-control`
      # becomes `TROUPE_PLANE_CONTROL_PORT`, which is exactly the name this release reads
      # a port number from — and a release whose config provider is handed
      # "tcp://10.96.85.27:4001" does not start. Nothing here uses service links.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: plane
          image: "{{ .Values.plane.image.repository }}:{{ .Values.plane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.plane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.plane.httpPort }}
            - name: control
              containerPort: {{ .Values.plane.controlPort }}
            {{- if eq .Values.plane.distribution "name" }}
            - name: epmd
              containerPort: 4369
            - name: dist
              containerPort: {{ .Values.plane.distPort }}
            {{- end }}
          env:
            # Two things a BEAM in a container gets wrong unless told, and both are
            # measured rather than guessed.
            #
            # `+S` — the scheduler count is taken from the *host's* CPU count, which in a
            # container is the node's. The downward API is the only thing that knows the
            # real limit.
            #
            # `+Q` — the port table is sized from `RLIMIT_NOFILE`, and containerd sets it
            # to 1073741816. The table is then 1.5GB, allocated before the release has
            # loaded a module: `:erlang.memory(:system)` reads 2073MB with the default
            # and 19MB with this. That is the whole difference between a pod that is
            # OOMKilled in one second and one that runs in 64MB.
            #
            # And with distribution on, a third: the distribution listener is pinned to
            # one port. Left to itself it picks an ephemeral one, and a NetworkPolicy
            # cannot name "whatever port the VM chose" — so this is what lets the policy
            # open the distribution between plane pods and nothing wider.
            - name: TROUPE_SCHEDULERS
              valueFrom:
                resourceFieldRef:
                  containerName: plane
                  resource: limits.cpu
                  divisor: "1"
            - name: ERL_FLAGS
              {{- if eq .Values.plane.distribution "name" }}
              value: "+S $(TROUPE_SCHEDULERS):$(TROUPE_SCHEDULERS) +Q {{ .Values.plane.maxPorts }} -kernel inet_dist_listen_min {{ .Values.plane.distPort }} inet_dist_listen_max {{ .Values.plane.distPort }}"
              {{- else }}
              value: "+S $(TROUPE_SCHEDULERS):$(TROUPE_SCHEDULERS) +Q {{ .Values.plane.maxPorts }}"
              {{- end }}
            - name: TROUPE_PLANE_AUTOSTART
              value: "true"
            - name: TROUPE_HTTP_PORT
              value: {{ .Values.plane.httpPort | quote }}
            - name: TROUPE_PLANE_CONTROL_PORT
              value: {{ .Values.plane.controlPort | quote }}
            - name: TROUPE_HOST
              value: {{ .Values.plane.host | quote }}
            - name: TROUPE_BASE_URL
              value: {{ .Values.plane.baseUrl | default (printf "https://%s" .Values.plane.host) | quote }}
            # Where the index page at `/` points a browser looking for the graphical
            # client. The GUI is a separate release (`charts/troupe-gui`) mounted on this
            # host; empty means this plane ships without one and the index offers no door.
            - name: TROUPE_APP_URL
              value: {{ .Values.plane.appUrl | quote }}
            # And where the terminal client is published — a release from another
            # repository, which this cluster does not host. Empty means the page tells a
            # reader to ask an administrator instead of linking at a download that is not
            # there.
            - name: TROUPE_CLI_URL
              value: {{ .Values.plane.cliUrl | quote }}
            # Browser origins the API answers cross-origin requests from. Empty means
            # none: the panel is same-origin and `troupe` is not a browser.
            - name: TROUPE_CORS_ORIGINS
              value: {{ join "," .Values.plane.corsOrigins | quote }}
            - name: TROUPE_PLANE_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: TROUPE_PROVISIONING_MODE
              value: {{ .Values.plane.provisioningMode | quote }}
            - name: TROUPE_PLATFORM_ADMIN_GROUP
              value: {{ .Values.plane.platformAdminGroup | quote }}
            - name: TROUPE_GROUPS_CLAIM
              value: {{ .Values.plane.groupsClaim | quote }}
            - name: TROUPE_OIDC_ISSUER
              value: {{ .Values.plane.oidc.issuer | quote }}
            - name: TROUPE_OIDC_CLIENT_ID
              value: {{ .Values.plane.oidc.clientId | quote }}
            - name: TROUPE_OIDC_AUTHORIZE_URL
              value: {{ .Values.plane.oidc.authorizeUrl | quote }}
            {{- with .Values.plane.oidc.scopes }}
            # Only for a provider that wants something other than the four OIDC scopes.
            - name: TROUPE_OIDC_SCOPES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.plane.oidc.mcpScope }}
            # Only where the registration exposes the MCP scope under another name.
            - name: TROUPE_OIDC_MCP_SCOPE
              value: {{ . | quote }}
            {{- end }}
            - name: TROUPE_OIDC_DEVICE_URL
              value: {{ .Values.plane.oidc.deviceUrl | quote }}
            - name: TROUPE_OIDC_TOKEN_URL
              value: {{ .Values.plane.oidc.tokenUrl | quote }}
            - name: TROUPE_BAO_ADDR
              value: {{ .Values.bao.address | quote }}
            - name: TROUPE_BAO_AUTH_PATH
              value: {{ .Values.bao.authPath | quote }}
            - name: TROUPE_BAO_ROLE
              value: {{ .Values.bao.planeRole | quote }}
            - name: TROUPE_OBJECT_ENDPOINT
              value: {{ .Values.objectStore.endpoint | quote }}
            - name: TROUPE_OBJECT_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: TROUPE_OBJECT_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: RELEASE_DISTRIBUTION
              value: {{ .Values.plane.distribution | quote }}
            {{- if eq .Values.plane.distribution "name" }}
            # `<basename>@<pod ip>`, which is what libcluster's `mode: :ip` forms and
            # therefore what the other replicas will try to connect to. The cookie comes
            # baked into the release, so every replica of one image already shares it.
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: TROUPE_NODE_BASENAME
              value: troupe-plane
            - name: RELEASE_NODE
              value: "troupe-plane@$(POD_IP)"
            - name: TROUPE_PLANE_SELECTOR
              value: "app.kubernetes.io/component=plane,app.kubernetes.io/instance={{ .Release.Name }}"
            {{- end }}
            # Secrets are referenced, never rendered. Troupe creates none of these.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.database.secretName }}
                  key: {{ .Values.plane.database.secretKey }}
            - name: TROUPE_SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.secretKeyBase.secretName }}
                  key: {{ .Values.plane.secretKeyBase.secretKey }}
            {{- if .Values.plane.oidc.secretName }}
            - name: TROUPE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.oidc.secretName }}
                  key: {{ .Values.plane.oidc.secretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.plane.scim.enabled }}
            - name: TROUPE_SCIM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.scim.secretName }}
                  key: {{ .Values.plane.scim.secretKey }}
            {{- end }}
            {{- if .Values.plane.breakglass.secretName }}
            # The break-glass door into the panel. Rendered only where a secret is named,
            # because absent means the routes answer 404 — see
            # `Troupe.Plane.Web.Breakglass` for what it does and does not buy.
            - name: TROUPE_BREAKGLASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.breakglass.secretName }}
                  key: {{ .Values.plane.breakglass.secretKey }}
            - name: TROUPE_BREAKGLASS_SUBJECT
              value: {{ .Values.plane.breakglass.subject | quote }}
            - name: TROUPE_BREAKGLASS_LIFETIME_SECONDS
              value: {{ .Values.plane.breakglass.lifetimeSeconds | quote }}
            {{- end }}
            {{- if .Values.objectStore.secretName }}
            - name: TROUPE_OBJECT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.secretName }}
                  key: access-key-id
                  optional: true
            - name: TROUPE_OBJECT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.secretName }}
                  key: secret-access-key
                  optional: true
            {{- end }}
            {{- if .Values.bao.tokenSecretName }}
            # A static token, for a development cluster with OpenBao in dev mode.
            - name: TROUPE_BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bao.tokenSecretName }}
                  key: {{ .Values.bao.tokenSecretKey }}
            {{- else }}
            # Otherwise the plane logs in as its ServiceAccount, with a token projected
            # for OpenBao's audience alone — the same shape the operator gives a worker.
            # It is not the automounted API-server token: that one is good at the API
            # server for as long as the pod lives, and this one is good at OpenBao for an
            # hour, which is the difference between a credential and a capability.
            - name: TROUPE_BAO_JWT_PATH
              value: /var/run/secrets/troupe/bao-token
            {{- end }}
          resources: {{- toYaml .Values.plane.resources | nindent 12 }}
          # The startup probe is what makes a small node survivable. A cold start on a
          # shared vCPU — loading the release, connecting the pool, the first query — can
          # take longer than a liveness probe's patience, and a liveness probe that fires
          # during it restarts a pod that was about to be fine. Sixty seconds of grace,
          # after which the ordinary probes take over.
          startupProbe:
            httpGet: {path: /.well-known/troupe, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /.well-known/troupe, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /.well-known/troupe, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}
          {{- if not .Values.bao.tokenSecretName }}
          volumeMounts:
            - name: bao-token
              mountPath: /var/run/secrets/troupe
              readOnly: true
          {{- end }}
      {{- if not .Values.bao.tokenSecretName }}
      volumes:
        - name: bao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: bao-token
                  audience: troupe-kms
                  expirationSeconds: 3600
      {{- end }}
{{- if gt (int .Values.plane.replicas) 1 }}
---
# Only with more than one replica. A budget of `minAvailable: 1` on a single replica
# would refuse every voluntary eviction — a node drain would hang on it — without
# buying any availability, since there is no second pod to be available.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: troupe-plane
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "troupe.plane.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.plane.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: troupe-plane
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.plane.certIssuer }}
    # A cert-manager ClusterIssuer, which issues this one hostname over HTTP-01. The
    # workers' certificates are the operator's business and are configured separately;
    # this is the plane's own.
    cert-manager.io/cluster-issuer: {{ .Values.plane.certIssuer | quote }}
    {{- end }}
    # The admin console is LiveView, so its socket is a long-lived WebSocket rather than
    # a request.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Nothing a client sends the plane is large: a JSON-RPC call, a profile, a login
    # form. Session data goes to object storage from the worker and never through here.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.plane.ingress.bodySize | quote }}
    {{- with .Values.plane.ingress.rateLimit }}
    # Per client IP. The plane is the one internet-facing thing that talks to the
    # database, and the device-flow and login endpoints are the ones a script would
    # hammer. Generous for a person and for an office NAT; the burst is what lets a
    # panel page load its assets at once.
    nginx.ingress.kubernetes.io/limit-rps: {{ .rps | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ .burstMultiplier | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .connections | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.plane.ingressClassName }}
  {{- if .Values.plane.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.plane.host | quote }}]
      secretName: {{ .Values.plane.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.plane.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: troupe-plane
                port:
                  number: {{ .Values.plane.httpPort }}
{{- end }}
{{- end }}
