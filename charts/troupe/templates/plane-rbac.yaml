# The plane is internet-facing, so its cluster access is exactly two resources: the
# ones it is the writer of. It may read the TroupePolicy and not write it, and it cannot
# touch a pod's spec, a secret or a namespace.
#
# In gitops mode a repository holds the WorkerProfiles and something else applies them:
# the plane lists and watches them, and patches only the fields it still writes
# (replicas, teams, mcpServers and its record of finished drains). It cannot create or
# delete one, so a plane that tried would be refused by the cluster and not only by its
# own code (Decision 736).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: troupe-plane
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: troupe-plane
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
rules:
  {{- if eq .Values.plane.provisioningMode "gitops" }}
  - apiGroups: ["troupe.dev"]
    resources: ["workerprofiles"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["troupe.dev"]
    resources: ["teamvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- else }}
  - apiGroups: ["troupe.dev"]
    resources: ["workerprofiles", "teamvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  # Its own replicas, for libcluster's Kubernetes DNS strategy.
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: troupe-plane
  namespace: {{ .Values.namespace }}
  labels: {{- include "troupe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: troupe-plane
subjects:
  - kind: ServiceAccount
    name: troupe-plane
    namespace: {{ .Values.namespace }}
---
# `TroupePolicy` is cluster-scoped, so reading it needs a ClusterRole. Read and nothing
# else: the panel validates against the policy for fast feedback, and a plane that could
# write it could raise its own limits — which would make the policy a suggestion.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: troupe-plane-policy-reader
  labels: {{- include "troupe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["troupe.dev"]
    resources: ["troupepolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: troupe-plane-policy-reader
  labels: {{- include "troupe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: troupe-plane-policy-reader
subjects:
  - kind: ServiceAccount
    name: troupe-plane
    namespace: {{ .Values.namespace }}
---
# Enrolment is a TokenReview: a worker presents its projected token and the plane asks
# Kubernetes who it is. The namespace in the answer decides the profile, which is what
# stops a pod enrolling as a profile it is not.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: troupe-plane-tokenreview
  labels: {{- include "troupe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: troupe-plane
    namespace: {{ .Values.namespace }}
