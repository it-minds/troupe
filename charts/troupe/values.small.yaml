# Troupe as small as it can honestly be run: one plane, one operator, a handful of worker
# pods, on a node pool of two small nodes (about 3 vCPU and 4 GB each).
#
# The same shape as `values.example.yaml` — a managed Kubernetes, PostgreSQL and object
# store, ingress-nginx and cert-manager, OpenBao in-cluster — with every number turned
# down and the reason for each written next to it. Copy this, fill in the placeholders
# marked CHANGE ME, and install it as `docs/admin/installing.md` section 2 says.
#
# What it gives up is written here: a plane restart is a short outage rather than a
# failover, and three worker pods is the ceiling.

namespace: troupe-system

# No image is set here: the chart's defaults are its own release's, public and needing
# no credential. A registry of your own that does names its pull secrets here; they must
# exist in `troupe-system` and in every worker namespace.
imagePullSecrets: []

networkPolicy:
  enabled: true

operator:
  replicas: 1
  # The operator idles at a few tens of MiB and works in bursts when a profile changes.
  # 96Mi is comfortable for a BEAM with `+Q` set; 256Mi is the ceiling for a resync of
  # every profile at once. It costs about a twentieth of a small node.
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 256Mi}
  ciliumAvailable: true                                      # CHANGE ME: false without Cilium
  ingressClassName: nginx
  workersScheme: wss
  workersPort: ""
  workerAllowedOrigins: []
  # A cert-manager ClusterIssuer: one certificate per pod hostname over HTTP-01,
  # which needs no DNS API token and so works on any DNS host. Leave it empty and
  # set `tlsSecretName` instead to share one wildcard certificate.
  certIssuer: letsencrypt
  tlsSecretName: ""
  drainTimeoutSeconds: 300
  maxPorts: 65536

plane:
  enabled: true
  # One replica, and distribution off with it. This is the whole of the saving on the
  # plane: half the memory, no Erlang cluster to form, and no second node to keep the
  # first one honest. What it costs is availability during an upgrade — the Deployment
  # rolls by Recreate, so there are a few seconds without a plane while the new pod
  # starts. Live sessions do not notice, because the plane is not in their data path;
  # a `troupe login` or a panel page load during those seconds fails and is retried.
  replicas: 1
  distribution: none
  host: troupe.example.com                                   # CHANGE ME: your plane host
  baseUrl: https://troupe.example.com                        # CHANGE ME: the same, with scheme
  corsOrigins: []
  ingressClassName: nginx
  # A cert-manager ClusterIssuer for the plane's own hostname, over HTTP-01.
  # Leave empty and `tlsSecretName` must name a certificate somebody else put there.
  certIssuer: ""
  tlsSecretName: troupe-plane-tls
  ingress:
    enabled: true
    bodySize: 1m
    rateLimit:
      rps: 20
      burstMultiplier: 5
      connections: 100
  # A plane with nobody on it is a BEAM with `+Q` set — tens of MiB — plus a connection
  # pool; the panel and a handful of enrolled workers add modestly to that. The limit
  # is deliberately three times the request because a plane that is OOMKilled restarts
  # as the only plane there is, and the startup probe then gives it a minute to come
  # back. Half a vCPU is enough for the request rate a small team makes; the plane does
  # no work per session once it is placed.
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
  controlPort: 4001
  httpPort: 4000
  distPort: 9100
  maxPorts: 65536
  provisioningMode: direct
  platformAdminGroup: troupe-platform-admins                 # CHANGE ME: the group's id
  groupsClaim: groups
  database:
    secretName: troupe-plane-database
    secretKey: url
  secretKeyBase:
    secretName: troupe-plane-secret-key-base
    secretKey: value
  # The endpoints are the provider's discovery document's; `values.example.yaml` says
  # which.
  oidc:
    issuer: https://login.example.com                        # CHANGE ME
    clientId: troupe                                         # CHANGE ME
    authorizeUrl: https://login.example.com/authorize        # CHANGE ME
    deviceUrl: https://login.example.com/device              # CHANGE ME
    tokenUrl: https://login.example.com/token                # CHANGE ME
    secretName: ""
  # A way into the panel when the identity provider cannot let you in — a misconfigured
  # client, an expired signing key, or the first five minutes of an installation before
  # any group exists to be a platform admin of. Leave `secretName` empty and there is no
  # door at all: the routes answer 404.
  #
  # A break-glass session is a platform admin and nothing more, lasts `lifetimeSeconds`,
  # is written to the audit log both when it succeeds and when it is refused, and says so
  # on every page while it is open.
  breakglass:
    secretName: ""
    secretKey: token
    subject: breakglass
    lifetimeSeconds: 3600
  scim:
    enabled: false

bao:
  address: http://openbao.troupe-system.svc:8200
  authPath: kubernetes
  planeRole: troupe-plane
  tokenSecretName: ""

objectStore:
  endpoint: https://s3.example.com                           # CHANGE ME: your provider's S3 endpoint
  bucket: troupe-sessions                                    # CHANGE ME if you like
  region: region-1                                           # CHANGE ME: the bucket's region
  secretName: troupe-object-store

policy:
  install: true
  name: default
  # The chart's own worker image, which a profile whose image is `release` runs.
  allowedImageRepositories:
    - ghcr.io/it-minds/troupe-worker
  # The ceiling is the node pool. Two small nodes hold the plane, the operator, OpenBao,
  # the ingress controller and cert-manager with room for about three worker pods at
  # the limits below — and a worker pod that cannot be scheduled is a profile that
  # reports fewer ready replicas than it asked for, not an error anyone is paged for.
  # Raise this together with the node pool, not before.
  maxReplicas: 3
  # Four concurrent sessions per pod. A session is a process tree and a workspace on the
  # pod's own disk; four of them share 4Gi comfortably, eight would not. Dormant
  # sessions cost nothing, so this bounds concurrent work rather than accounts.
  maxSessionsPerPod: 4
  # The largest pod a profile may ask for. Two vCPUs and 4Gi is what one 3 vCPU, 4 GB
  # node can give a single pod after the system and the plane have taken theirs; a
  # profile asking for more would be admitted and never scheduled.
  maxResources:
    cpu: "2"
    memory: 4Gi
  allowedEgress:
    - llm-gw.example.com                                     # CHANGE ME: your model gateway, or the providers' hosts
    - github.com
    - "*.github.com"
  # A block class for a worker's own disk — 20GiB per pod unless the profile says
  # otherwise — and a file-storage class for team volumes, which managed file services
  # tend to bill from a minimum size upward. On a small release, grant team volumes
  # deliberately.
  allowedStorageClasses:
    - block-storage                                          # CHANGE ME: ReadWriteOnce
    - file-storage                                           # CHANGE ME: ReadWriteMany
  orgVolume: {}
  namespacePrefix: troupe-w-
  workersDomain: workers.example.com                         # CHANGE ME: your wildcard
admission:
  install: true
