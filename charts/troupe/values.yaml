# The namespace everything lives in. Worker namespaces are created by the operator and
# named from the policy's prefix, so they are not listed here.
namespace: troupe-system

# CRDs live under `charts/troupe/crds/`, which Helm installs before anything else and
# never upgrades or deletes. That ordering is what lets the default TroupePolicy be an
# ordinary template, and the not-deleting is a safety property: removing a CRD removes
# every object of that kind, which for WorkerProfile means removing the workers.
# Changing a CRD is therefore a deliberate `kubectl apply -f charts/troupe/crds/`.

# Names of pull secrets, for a registry that needs a credential. Put on the plane, the
# migration Job and the operator here, and handed to the operator by name so it puts the
# same ones on every worker pod. Troupe creates no secrets: each name has to exist in
# `troupe-system` and in every worker namespace, the same way the object-store secret
# does.
imagePullSecrets: []

# NetworkPolicy for the plane and the operator: HTTP from the ingress namespace, the
# control port from worker namespaces and the operator, Erlang distribution between
# plane replicas, and no other ingress at all. Egress is not restricted. Needs a CNI that
# enforces NetworkPolicy — Cilium does; kind's default does not, and silently.
networkPolicy:
  enabled: true

operator:
  image:
    repository: ghcr.io/objective-mj/troupe-operator
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # Whether Cilium is installed. With it the operator writes CiliumNetworkPolicy with
  # real FQDN rules; without it, egress to named hosts is a CIDR rule and a documented
  # gap.
  ciliumAvailable: false
  # The namespace running this controller must carry `troupe.dev/ingress=true`: a
  # worker's NetworkPolicy admits traffic from namespaces with that label and from
  # nowhere else, which is how "only the ingress may reach a pod" is expressed.
  ingressClassName: nginx
  # How a client reaches a worker pod. `wss` on the default port is what an Ingress with
  # a certificate gives you; a cluster reached through a port mapping sets both.
  workersScheme: wss
  workersPort: ""
  # Browser origins a worker pod answers cross-origin requests from, for a client that
  # runs in a browser. Empty means none: `troupe` is not a browser, and a worker that
  # answered any origin would let a page you happened to visit talk to your sessions.
  workerAllowedOrigins: []
  # `+Q`, the BEAM's port table size. Left to itself it is taken from `RLIMIT_NOFILE`,
  # which a container runtime sets absurdly high, and the table costs 1.5GB.
  maxPorts: 65536
  # Two ways to give a worker pod a certificate, and `certIssuer` wins where both are set.
  #
  # `certIssuer` names a cert-manager ClusterIssuer. Each pod then gets its own
  # certificate for its own hostname, in its own secret, over HTTP-01 — which works
  # wherever the hostname resolves to the ingress controller, and so on any DNS host.
  # This is the recommended setting.
  #
  # `tlsSecretName` names one secret every pod's Ingress shares, which in practice holds
  # a wildcard for `*.workers.<domain>`. Fewer certificates, one more dependency: a
  # wildcard can only be issued over DNS-01, which needs an API token for whoever hosts
  # the zone, and many registrars have no cert-manager solver at all.
  certIssuer: ""
  tlsSecretName: ""
  drainTimeoutSeconds: 300

plane:
  # A cluster that runs only workers, with its plane elsewhere, sets this to false.
  enabled: true
  image:
    repository: ghcr.io/objective-mj/troupe-plane
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  host: plane.example.test
  # What the plane calls itself in the links it hands out — device-flow pages, the
  # panel. Defaults to https://<host>.
  baseUrl: ""
  # Where the index page at `/` links to the graphical client. The GUI is a separate
  # release with its own chart, which mounts it at `/app` on this host by default. Empty
  # means this plane ships without one, and the index offers no door rather than a 404.
  appUrl: /app
  # Browser origins the plane's API answers cross-origin requests from. The panel is
  # same-origin and needs nothing here; a separate web client does. Empty means none.
  corsOrigins: []
  ingressClassName: nginx
  # A cert-manager ClusterIssuer for the plane's own hostname, over HTTP-01.
  # Leave empty and `tlsSecretName` must name a certificate somebody else put there.
  certIssuer: ""
  tlsSecretName: ""
  ingress:
    enabled: true
    # The largest request body the ingress will pass on. Nothing a client sends the
    # plane is large — session data goes to object storage from the worker.
    bodySize: 1m
    # Per client IP, enforced by ingress-nginx. `rps` is the steady rate, the burst is
    # `rps * burstMultiplier`, and `connections` is concurrent connections — which is
    # the one an office behind a single NAT address will notice first, since every open
    # panel tab is one. Set the whole block to `null` to turn it off.
    rateLimit:
      rps: 20
      burstMultiplier: 5
      connections: 100
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  # The control listener workers dial. Never exposed through ingress.
  controlPort: 4001
  httpPort: 4000
  # Where the Erlang distribution listener is pinned when `distribution` is `name`, so
  # the NetworkPolicy can open exactly that port between plane pods rather than the
  # ephemeral range the VM would otherwise pick from.
  distPort: 9100
  # `+Q`, the BEAM's port table size. See `operator.maxPorts`.
  maxPorts: 65536
  # `direct` writes WorkerProfile straight to the API server; `gitops` writes a commit
  # and waits for something else to apply it.
  provisioningMode: direct
  # The identity provider group whose members administer the platform. Membership is
  # the provider's business and is never edited in Troupe.
  platformAdminGroup: troupe-platform-admins
  groupsClaim: groups
  # `name` joins the replicas into an Erlang cluster for the `:global` singletons;
  # `none` is correct for a single replica and keeps distribution off the network. The
  # chart refuses `replicas > 1` with `none`: unclustered replicas are not two replicas
  # of one plane but two planes, each placing sessions as if it were alone. With one
  # replica, or with `none`, the Deployment rolls by Recreate for the same reason.
  distribution: name
  database:
    # A reference to a secret created out of band or by External Secrets Operator.
    # Troupe never creates secrets.
    secretName: troupe-plane-database
    secretKey: url
  # Signs the admin panel's session cookies. `runtime.exs` refuses to start a plane
  # without one rather than using the development default.
  secretKeyBase:
    secretName: troupe-plane-secret-key-base
    secretKey: value
  oidc:
    issuer: ""
    clientId: ""
    # Published to clients at `/.well-known/troupe`, which is how `troupe login` finds
    # the provider without the plane ever seeing the user's credentials.
    authorizeUrl: ""
    deviceUrl: ""
    tokenUrl: ""
    # What a client asks the provider for. Empty means the four OIDC scopes — openid,
    # profile, email, offline_access — which every provider understands. Group
    # membership is not a scope: it is a claim the provider is configured to put in the
    # token, named by `groupsClaim`. Asking for one as a scope is refused outright by
    # Microsoft Entra and fails every sign-in before a password is typed.
    scopes: []
    # What an MCP client asks for. Empty means `<baseUrl>/mcp/admin` — the scope named
    # after the resource, which is the only name the MCP specification lets a client send
    # as its `resource` parameter. The app registration has to expose it under that name;
    # set this only where it exposes another.
    mcpScope: ""
    secretName: troupe-plane-oidc
    secretKey: client-secret
  # A way into the panel when the identity provider cannot let you in — a misconfigured
  # client, an expired signing key, or the first five minutes of an installation before
  # any group exists to be a platform admin of. Leave `secretName` empty and there is no
  # door at all: the routes answer 404.
  #
  # A break-glass session is a platform admin and nothing more, lasts `lifetimeSeconds`,
  # is written to the audit log both when it succeeds and when it is refused, and says so
  # on every page while it is open.
  breakglass:
    secretName: ""
    secretKey: token
    subject: breakglass
    lifetimeSeconds: 3600
  scim:
    enabled: false
    secretName: troupe-plane-scim
    secretKey: token

# The A2A facade: every profile as an agent other agents can call, at `a2a.<domain>`.
# A client of the plane and of worker pods over their public APIs, with no database and
# no credential of its own — each caller's own is exchanged at the plane. Off by
# default; a cluster that has nothing calling it has no reason to run it.
a2a:
  enabled: false
  image:
    repository: ghcr.io/objective-mj/troupe-a2a
    tag: ""
    pullPolicy: IfNotPresent
  # Two is fine: nothing is serialised in the facade, and a task's state is the
  # plane's row, not anything a replica remembers.
  replicas: 1
  host: a2a.example.test
  # What the facade calls itself in agent cards and artifact URIs. Defaults to
  # https://<host>.
  publicUrl: ""
  # Where the plane's `/rpc` is reached from inside the cluster. The plane's
  # NetworkPolicy admits HTTP from the ingress namespace only, so a cluster that
  # enforces NetworkPolicy either admits the facade's pods on the plane's HTTP port or
  # points this at the plane's public URL instead.
  planeUrl: http://troupe-plane.troupe-system.svc:4000
  port: 4002
  # `message/stream` holds a socket to a pod open per stream; this caps them per
  # replica, and a caller beyond it gets a 429 rather than a replica out of ports.
  maxStreams: 200
  # The visibility a task's session is created with: `private` to the calling
  # principal, or `team` so a person can audit what other agents asked of the team's
  # profiles.
  visibility: private
  ingressClassName: nginx
  tlsSecretName: ""
  # `+Q`, the BEAM's port table size. See `operator.maxPorts`.
  maxPorts: 65536
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

bao:
  address: http://openbao.troupe-system.svc:8200
  # The Kubernetes auth mount and the role the plane authenticates with. The plane
  # presents a ServiceAccount token projected for the `troupe-kms` audience, the same
  # audience the workers' key-manager token carries.
  authPath: kubernetes
  planeRole: troupe-plane
  # A static token instead, for a development cluster with OpenBao in dev mode. Empty
  # in any real deployment: the plane authenticates as its ServiceAccount.
  tokenSecretName: ""
  tokenSecretKey: token

objectStore:
  endpoint: http://minio.troupe-system.svc:9000
  bucket: troupe-sessions
  region: us-east-1
  secretName: troupe-object-store

# The default TroupePolicy. A cluster admin is expected to edit this; the plane cannot.
policy:
  install: true
  name: default
  allowedImageRepositories:
    - ghcr.io/objective-mj/troupe-worker
  maxReplicas: 8
  maxSessionsPerPod: 8
  maxResources:
    cpu: "4"
    memory: 8Gi
  allowedEgress:
    - "*.anthropic.com"
    - github.com
  allowedStorageClasses:
    - standard
  orgVolume: {}
  namespacePrefix: troupe-w-
  workersDomain: workers.example.test

admission:
  # ValidatingAdmissionPolicy is GA from Kubernetes 1.30. Where it is unavailable the
  # operator's own check still refuses the profile and marks PolicyViolation, which is
  # the documented fallback rather than a silent one.
  install: true
