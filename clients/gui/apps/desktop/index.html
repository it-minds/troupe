<!doctype html>
<!-- `data-theme` is on the document from the first byte, so the ground is never wrong
     before the bundle runs. Afterglow is the default; `main.tsx` replaces both
     attributes with what this person chose, before the first render. The mode attribute
     is deliberately absent — no attribute means "follow the system", which the media
     query in tokens.css answers on its own. -->
<html lang="en" data-theme="afterglow">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Troupe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
