[package]
name = "troupe-desktop"
version = "0.6.1"
description = "The Troupe GUI"
license = "Apache-2.0"
authors = ["Troupe"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the mobile entry point would call; `main.rs` is a two-line shim.
[lib]
name = "troupe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `generate_context!` and `#[tauri::command]` both expand into code that names these, so
# they are dependencies of the macros rather than of anything written here.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The HTTP client that runs outside the webview: no preflight, no Origin, so a plane
# needs no CORS entry for the desktop app. `~2.6` because 2.7's JavaScript half wants
# @tauri-apps/api 2.12, which goes with tauri 2.12, and the Tauri CLI refuses a build
# whose two halves of a plugin differ in their minor (Decision 717).
tauri-plugin-http = "~2.6"
# `target="_blank"` does nothing in a webview and the device grant needs a real browser.
tauri-plugin-opener = "2"
# A workspace is a directory on this computer, and the browser build can only ask for a
# path typed in. The native picker is the difference between the two builds here.
tauri-plugin-dialog = "2"
# A notification when a session finishes or asks something while nobody is looking. The
# page's own `Notification` is refused in WebView2, which denies the permission unless
# the host answers for it, and wry answers only the clipboard's. `~2.4` because 2.5 wants
# tauri 2.12, and tauri moves with the rest of its group, not behind a plugin.
tauri-plugin-notification = "~2.4"
# Windows Credential Manager / macOS Keychain / Secret Service. The refresh token lives
# here and nowhere else; see src/secrets.rs.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
