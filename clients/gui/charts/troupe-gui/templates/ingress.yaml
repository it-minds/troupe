{{- if .Values.ingress.enabled -}}
{{- $base := include "troupe-gui.base" . -}}
{{- if not .Values.ingress.host -}}
{{- fail "ingress.host is required when ingress.enabled is true" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "troupe-gui.fullname" . }}
  labels: {{- include "troupe-gui.labels" . | nindent 4 }}
  annotations:
    {{- if $base }}
    # The bundle is served from the container's root, and its asset URLs carry the base
    # path, so the prefix is stripped on the way in: `{{ $base }}/assets/x.js` becomes
    # `/assets/x.js`, and `{{ $base }}/anything` becomes `/anything`, which the SPA
    # fallback turns into `index.html`. Doing it here rather than in the image keeps the
    # container ignorant of where it is mounted.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- end }}
    {{- with .Values.ingress.certIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.ingress.host | quote }}]
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if $base }}
          # `ImplementationSpecific` because the capture groups the rewrite refers to are
          # nginx's, not the Ingress API's. The `(/|$)` is what makes both `{{ $base }}`
          # and `{{ $base }}/` reach the app rather than only the second.
          - path: {{ printf "%s(/|$)(.*)" $base | quote }}
            pathType: ImplementationSpecific
          {{- else }}
          - path: /
            pathType: Prefix
          {{- end }}
            backend:
              service:
                name: {{ include "troupe-gui.fullname" . }}
                port: {name: http}
{{- end -}}
