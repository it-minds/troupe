apiVersion: v1
kind: Service
metadata:
  name: {{ include "troupe-gui.fullname" . }}
  labels: {{- include "troupe-gui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "troupe-gui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
