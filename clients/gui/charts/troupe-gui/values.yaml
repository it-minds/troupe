# The GUI is a protocol client and nothing else, so this chart has no secrets, no
# database, and nothing to configure at runtime: what it serves was decided when the
# image was built. Everything here is about where the bytes are and who may reach them.

image:
  repository: ghcr.io/objective-mj/troupe-gui
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Two replicas because it is 30 MB of nginx and a rolling deploy should not have a
# window where the app is a 502. There is no state to coordinate.
replicas: 2

nameOverride: ""
fullnameOverride: ""

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {cpu: 200m, memory: 128Mi}

# Where the bundle is mounted, and it must match the `TROUPE_GUI_BASE` the image was
# built with — Vite writes that prefix into every asset URL, so an image built for one
# path cannot be served at another. `/` serves the GUI at the root of its own host.
basePath: /app

ingress:
  enabled: true
  className: nginx
  host: ""
  # The certificate to serve. Naming a secret another release already owns is deliberate
  # and supported: two Ingresses on one host share one certificate. Leave `certIssuer`
  # empty in that case, so cert-manager is not asked to issue a second one for a host it
  # already has.
  tlsSecretName: ""
  certIssuer: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
