# The headers every response from this server carries, the app's Content-Security-Policy
# first (Decision 803).
#
# The app keeps the local daemon's WebSocket token in `localStorage`, and the daemon
# admits the origin the app is served from (Decision 797), which is the plane's own. So
# any script that ran on that origin could read the token and drive somebody's daemon,
# which runs tools on their machine; what keeps that safe is that nothing but the app's
# own bundle runs here, and this policy is where the browser is told so:
#
#   script-src  the bundle's own files: no inline script, no eval, no other origin.
#   style-src   the bundle's own stylesheet; the app sets styles through the DOM, which
#               this does not govern, and writes no `<style>` and no `style` attribute.
#   connect-src the plane (`'self'`); the daemon on this machine at `127.0.0.1`, on any
#               port, which is the one address the app dials it at (`daemonUrl`); and,
#               over TLS only, the identity provider and the workers, which a deployment
#               names at run time and this image cannot know. Not `[::1]`: a source list
#               has no way to write an IPv6 address, and Chromium drops it with an error.
#
# Nothing else may frame it, it embeds no plugin, and it has no `<base>` to rewrite.
#
# In a file of its own because nginx drops every `add_header` of an enclosing block in a
# block that has one of its own: `nginx.conf` includes this in the server and again in
# each location that adds a header, or those responses would go without it.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' ws://127.0.0.1:* https: wss:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# Nothing here embeds another site, and nothing here should be embedded.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
