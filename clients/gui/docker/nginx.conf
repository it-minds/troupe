# Serving one single-page bundle, and nothing else.
#
# Two rules do the work. Hashed assets are immutable and cached for a year, because Vite
# puts the content hash in the filename and a changed file is a different name. Everything
# else falls back to `index.html`, because the routes in this app exist only in the
# browser — a deep link the server has never heard of is still a page.
#
# `index.html` itself is never cached. It is the one file that names the current hashed
# assets, so a stale copy is a browser confidently asking for a bundle that was deleted
# two deploys ago.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The ingress terminates TLS and is the only thing in front of this, so the real
    # client address arrives in a header rather than on the connection.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Nothing here embeds another site, and nothing here should be embedded.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # For the kubelet, and for the image's own health check. Before the SPA fallback, so
    # it answers 200 with two bytes rather than the whole application.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-addressed by Vite: the name changes when the bytes do, so this can be held
    # forever without ever serving something stale.
    location ~* \.(js|css|woff2?|png|jpe?g|gif|svg|ico|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
