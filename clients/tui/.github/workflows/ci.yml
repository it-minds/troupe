name: CI

# The gate for a change: zero warnings, formatted, credo-clean, the UI talking
# only to Troupe.Client (mix troupe.xref), and the whole suite green — every session
# in the suite runs in the daemon this VM embeds. The remote smoke task is deliberately
# not here — it needs a deployment, and skips itself without TROUPE_REMOTE_URL.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
      TROUPE_IDLE_TEST_MS: "1000"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.4"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # The harness (troupe_core, troupe_gateway, troupe_protocol) comes from the private
      # `it-minds/troupe-remote` repository as sparse git dependencies; `HARNESS_TOKEN` is a
      # fine-grained token with read access to that repository's contents.
      - name: Reach the harness repository
        run: git config --global url."https://x-access-token:${{ secrets.HARNESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Get deps
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Formatted
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: The UI only calls Troupe.Client
        run: mix troupe.xref

      - name: Tests
        run: mix test
