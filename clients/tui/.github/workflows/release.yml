name: Release

# One native runner per target (the precompiled ExRatatui NIF resolves against the
# build host). Produces five binaries plus SHA256SUMS. GitHub Actions syntax; Forgejo
# Actions runs it unchanged. The harness comes from the private `it-minds/troupe-remote`
# repository as sparse git dependencies, so `HARNESS_TOKEN` — a fine-grained token with
# read access to that repository's contents — is what lets `mix deps.get` fetch them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  MIX_ENV: prod
  TROUPE_REAPER_TARGETS: all

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux_x86_64
            target_abi: musl
          - os: ubuntu-24.04-arm
            target: linux_aarch64
            target_abi: musl
          - os: macos-15-intel
            target: macos_x86_64
          - os: macos-14
            target: macos_aarch64
          - os: windows-2022
            target: windows_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.4"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install xz and 7z
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full; fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then brew install xz p7zip || true; fi

      - name: Reach the harness repository
        run: git config --global url."https://x-access-token:${{ secrets.HARNESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Get deps
        run: mix deps.get

      - name: Build release
        env:
          BURRITO_TARGET: ${{ matrix.target }}
          MATRIX_TARGET_ABI: ${{ matrix.target_abi }}
        run: |
          if [ -n "${MATRIX_TARGET_ABI}" ]; then export TARGET_ABI="${MATRIX_TARGET_ABI}"; fi
          mix release --overwrite
          ls -la burrito_out

      - name: Name artifact
        id: art
        run: |
          VERSION=$(grep -m1 '@version' mix.exs | sed -E 's/.*"([^"]+)".*/\1/')
          EXT=""; [[ "${{ matrix.target }}" == windows* ]] && EXT=".exe"
          NAME="troupe-${VERSION}-${{ matrix.target }}${EXT}"
          mv "burrito_out/troupe_${{ matrix.target }}${EXT}" "burrito_out/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # The daemon reads the model from the workspace, so the fake is configured there.
      - name: Smoke test (--version and a headless Fake run in the embedded daemon)
        run: |
          BIN="burrito_out/${{ steps.art.outputs.name }}"
          chmod +x "$BIN" || true
          START=$(date +%s%N); "$BIN" --version; END=$(date +%s%N)
          echo "cold first run (extraction + --version): $(( (END-START)/1000000 )) ms"
          START=$(date +%s%N); "$BIN" --version; END=$(date +%s%N)
          echo "warm --version: $(( (END-START)/1000000 )) ms"
          ls -la "$BIN"
          mkdir -p /tmp/smoke/.troupe && cd /tmp/smoke
          printf 'provider: fake\nmodel: fake-model\nfake_script: %s\n' "$GITHUB_WORKSPACE/fixtures/fake_scripts/smoke.json" > .troupe/config.yaml
          "$GITHUB_WORKSPACE/$BIN" run build "smoke" --headless --auto-approve
          test -f hello.txt && cat hello.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: burrito_out/${{ steps.art.outputs.name }}

  containers:
    name: Linux binary in clean containers
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*-linux_x86_64
          merge-multiple: true
          path: dist
      - name: ubuntu:24.04 and alpine (no Erlang, no Elixir, no inotify-tools)
        run: |
          chmod +x dist/troupe-*-linux_x86_64
          for img in ubuntu:24.04 alpine:3.20; do
            docker run --rm -v "$PWD/dist:/dist" -v "$PWD/fixtures:/fixtures" "$img" sh -c '
              set -e; BIN=$(ls /dist/troupe-*-linux_x86_64); mkdir -p /work/.troupe && cd /work
              printf "provider: fake\nmodel: fake-model\nfake_script: /fixtures/fake_scripts/smoke.json\n" > .troupe/config.yaml
              $BIN --version
              $BIN run build "smoke" --headless --auto-approve --watch 2>&1 | tee out.log
              grep -q polling out.log && echo "watch fell back to polling"
              test -f hello.txt'
          done

  release:
    name: Publish
    needs: [build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: troupe-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: cd dist && sha256sum troupe-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
