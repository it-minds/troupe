# A plane-light: the plane, a worker and what they need, on one machine, from one file.
#
# For an office, a team or one person with a box in a corner and no Kubernetes: the same
# plane the chart deploys, the same worker it would run as a pod, the same clients, with
# nothing in the protocol changed. docs/admin/plane-light.md says who it is for and what
# it gives up compared with a cluster; the sentences by each service say why it is here.
#
#   cp .env.example .env            # and change what is yours
#   docker compose up -d --wait     # or scripts/plane-light up, from the repository
#
# Everything a person reaches is behind one published port (`TROUPE_LIGHT_PORT`): the
# proxy sends `/app` and `/console` to the GUI image, `/dex` to the identity provider,
# the worker's WebSocket to the worker, and the rest to the plane. Published artifacts are
# read on a second port under a second hostname, as the chart serves them. Plain HTTP:
# a reverse proxy of your own in front of these two ports is where TLS goes.
#
# The images are the release's, from ghcr.io, at `TROUPE_VERSION`. `up --build` makes the
# plane, the worker and the GUI from this checkout instead, which is how a developer runs
# the whole product on a laptop with no cluster and no Elixir toolchain.
name: troupe-light

x-plane-image: &plane-image
  image: ${TROUPE_PLANE_IMAGE:-ghcr.io/it-minds/troupe-plane:${TROUPE_VERSION:-0.32.0-beta}}
  build:
    context: ../..
    dockerfile: docker/Dockerfile
    args:
      RELEASE: troupe_plane

x-worker-image: &worker-image
  image: ${TROUPE_WORKER_IMAGE:-ghcr.io/it-minds/troupe-worker:${TROUPE_VERSION:-0.32.0-beta}}
  build:
    context: ../..
    dockerfile: docker/Dockerfile
    args:
      RELEASE: troupe_worker

# The two settings every Troupe service reads the same way: the object store the plane
# indexes and the worker seals sessions into, as one `.env` names them.
x-object-store: &object-store
  TROUPE_OBJECT_ENDPOINT: http://minio:9000
  TROUPE_OBJECT_BUCKET: troupe-sessions
  TROUPE_OBJECT_ACCESS_KEY_ID: troupe
  TROUPE_OBJECT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  TROUPE_OBJECT_REGION: us-east-1

services:
  # A named volume is made root-owned, and every Troupe image runs as uid 1000, Dex as
  # 1001 and OpenBao as its own user: so each directory a service writes is handed to
  # that service once, before anything starts, rather than failing at the first write.
  volumes-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /worker-state /control-tls /host /bao-tokens /dex-data /dex-config
        chown 1000:1000 /worker-state /control-tls /host /bao-tokens
        chown 1001:1001 /dex-data /dex-config
        chmod 700 /worker-state /host /bao-tokens
    volumes:
      - worker-state:/worker-state
      - control-tls:/control-tls
      - host-enrolment:/host
      - bao-tokens:/bao-tokens
      - dex-data:/dex-data
      - dex-config:/dex-config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: troupe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: troupe_plane
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troupe -d troupe_plane"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pigsty's community build of MinIO, pinned by digest, for the reason
  # `dev/docker-compose.yml` gives: MinIO withdrew its own images.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: troupe
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Versioning on the bucket is required: erasure has to destroy prior versions too.
  minio-setup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio: {condition: service_healthy}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set troupe http://minio:9000 troupe "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing troupe/troupe-sessions
        mc version enable troupe/troupe-sessions
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}

  # OpenBao for real, not in dev mode: a file backend on a volume, so the session keys it
  # holds survive a restart, and every sealed session with them. `openbao/entrypoint.sh`
  # initialises it the first time, unseals it on every start, and writes the plane's and
  # the worker's tokens. The unseal key and the root token are kept on the `openbao-keys`
  # volume, which this container alone mounts, readable by root alone: the keys to the
  # keys live on the same disk, which is weaker than a cluster's sealed OpenBao and is
  # named as such in docs/admin/plane-light.md.
  openbao:
    image: openbao/openbao:2.4.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/troupe/entrypoint.sh"]
    command: server -config=/opt/troupe/config.hcl
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    volumes:
      - ./openbao/config.hcl:/opt/troupe/config.hcl:ro
      - ./openbao/entrypoint.sh:/opt/troupe/entrypoint.sh:ro
      - openbao-data:/openbao/file
      - openbao-keys:/openbao/keys
      - bao-tokens:/openbao/tokens
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD-SHELL", "test -s /openbao/tokens/ready && bao status -address=http://127.0.0.1:8200 >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

  # The identity provider. Dex with static users, so a plane-light signs people in with
  # no provider of the organisation's; connectors for one are commented in
  # `dex/config.yaml`, which is the file a person edits. Rendered into place at every
  # start by `dex-config`, which hashes the first administrator's password from `.env`
  # and writes the hostname in; its state (refresh tokens, device codes) on a volume, so
  # a restart does not sign everybody out.
  dex-config:
    image: caddy:2.10.2-alpine
    depends_on:
      volumes-init: {condition: service_completed_successfully}
    user: "1001:1001"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        hash="$$(caddy hash-password --plaintext "$$TROUPE_LIGHT_ADMIN_PASSWORD")"
        sed -e "s|__ISSUER__|$$ISSUER|g" \
            -e "s|__ADMIN_EMAIL__|$$TROUPE_LIGHT_ADMIN_EMAIL|g" \
            -e "s|__ADMIN_HASH__|$$hash|g" \
            -e "s|__ADMIN_GROUP__|$$TROUPE_LIGHT_ADMIN_GROUP|g" \
            -e "s|__TEAM_GROUP__|$$TROUPE_LIGHT_TEAM_GROUP|g" \
            /opt/troupe/config.yaml > /etc/dex/config.yaml
        echo "dex: configuration rendered for $$ISSUER"
    environment:
      ISSUER: http://${TROUPE_LIGHT_HOST:?set TROUPE_LIGHT_HOST in .env}:${TROUPE_LIGHT_PORT:-8080}/dex
      TROUPE_LIGHT_ADMIN_EMAIL: ${TROUPE_LIGHT_ADMIN_EMAIL:?set TROUPE_LIGHT_ADMIN_EMAIL in .env}
      TROUPE_LIGHT_ADMIN_PASSWORD: ${TROUPE_LIGHT_ADMIN_PASSWORD:?set TROUPE_LIGHT_ADMIN_PASSWORD in .env}
      TROUPE_LIGHT_ADMIN_GROUP: ${TROUPE_LIGHT_ADMIN_GROUP:-troupe-platform-admins}
      TROUPE_LIGHT_TEAM_GROUP: ${TROUPE_LIGHT_TEAM_GROUP:-troupe-users}
    volumes:
      - ./dex/config.yaml:/opt/troupe/config.yaml:ro
      - dex-config:/etc/dex

  dex:
    image: ghcr.io/dexidp/dex:v2.45.0
    restart: unless-stopped
    depends_on:
      dex-config: {condition: service_completed_successfully}
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - dex-config:/etc/dex:ro
      - dex-data:/var/dex
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 3s
      retries: 40

  # The control port's certificate: a CA of its own and a certificate for `plane`, the
  # name the worker dials on this network, as cert-manager would issue one in a cluster.
  # Made once and kept: the worker pins the CA it was registered with. The plane image has
  # openssl; root here only to hand the files to the plane's own user.
  control-tls:
    <<: *plane-image
    depends_on:
      volumes-init: {condition: service_completed_successfully}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /etc/troupe/control-tls
        if [ -s tls.crt ] && [ -s tls.key ] && [ -s ca.crt ]; then
          echo "control-tls: the certificate is already there"; exit 0
        fi
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 3650 \
          -subj "/CN=troupe-plane-light-control-ca" \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" \
          -keyout ca.key -out ca.crt
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
          -subj "/CN=plane" -keyout tls.key -out tls.csr
        printf '%s\n' "subjectAltName=DNS:plane,DNS:localhost" "basicConstraints=CA:FALSE" \
          "extendedKeyUsage=serverAuth" > ext
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 3650 \
          -extfile ext -out tls.crt
        rm -f tls.csr ext ca.srl
        chown 1000:1000 ca.crt ca.key tls.crt tls.key
        chmod 600 ca.key tls.key
        echo "control-tls: a CA and a certificate for plane"
    volumes:
      - control-tls:/etc/troupe/control-tls

  # A release has no Mix, so migrations run as an eval before the plane serves. Also what
  # an update runs first: `TROUPE_VERSION` changed and `up -d` again.
  plane-migrate:
    <<: *plane-image
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://troupe:${POSTGRES_PASSWORD}@postgres:5432/troupe_plane
      TROUPE_SECRET_KEY_BASE: ${TROUPE_SECRET_KEY_BASE:?set TROUPE_SECRET_KEY_BASE in .env}
    entrypoint: ["/bin/sh", "-c", "/app/bin/troupe_plane eval 'Troupe.Plane.Release.migrate()'"]

  plane:
    <<: *plane-image
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      openbao: {condition: service_healthy}
      dex: {condition: service_healthy}
      minio-setup: {condition: service_completed_successfully}
      plane-migrate: {condition: service_completed_successfully}
      control-tls: {condition: service_completed_successfully}
    # The issuer is one URL for a browser and for the plane: inside this container the
    # box's name is the Docker host, where the proxy's published port is.
    extra_hosts:
      - "${TROUPE_LIGHT_HOST}:host-gateway"
    # The OpenBao token is read from the file the init wrote rather than from `.env`, so
    # it never has to be typed anywhere.
    entrypoint:
      - /bin/sh
      - -c
      - 'export TROUPE_BAO_TOKEN="$$(cat /run/troupe/bao/plane)" && exec /app/bin/troupe_plane start'
    environment:
      <<: *object-store
      TROUPE_PLANE_AUTOSTART: "true"
      DATABASE_URL: postgres://troupe:${POSTGRES_PASSWORD}@postgres:5432/troupe_plane
      TROUPE_SECRET_KEY_BASE: ${TROUPE_SECRET_KEY_BASE:?set TROUPE_SECRET_KEY_BASE in .env}
      TROUPE_HTTP_PORT: "4000"
      TROUPE_HOST: ${TROUPE_LIGHT_HOST}
      TROUPE_BASE_URL: http://${TROUPE_LIGHT_HOST}:${TROUPE_LIGHT_PORT:-8080}
      TROUPE_APP_URL: /app
      TROUPE_CONSOLE_URL: /console

      TROUPE_OIDC_ISSUER: http://${TROUPE_LIGHT_HOST}:${TROUPE_LIGHT_PORT:-8080}/dex
      TROUPE_OIDC_CLIENT_ID: troupe
      TROUPE_OIDC_DEVICE_URL: http://${TROUPE_LIGHT_HOST}:${TROUPE_LIGHT_PORT:-8080}/dex/device/code
      TROUPE_OIDC_TOKEN_URL: http://${TROUPE_LIGHT_HOST}:${TROUPE_LIGHT_PORT:-8080}/dex/token
      TROUPE_OIDC_AUTHORIZE_URL: http://${TROUPE_LIGHT_HOST}:${TROUPE_LIGHT_PORT:-8080}/dex/auth
      TROUPE_OIDC_SCOPES: "openid profile email groups offline_access"
      TROUPE_GROUPS_CLAIM: groups
      TROUPE_PLATFORM_ADMIN_GROUP: ${TROUPE_LIGHT_ADMIN_GROUP:-troupe-platform-admins}

      # The web app and the console share the plane's origin and need no entry; the
      # desktop app's own origins do.
      TROUPE_CORS_ORIGINS: "tauri://localhost,http://tauri.localhost"

      TROUPE_BAO_ADDR: http://openbao:8200
      TROUPE_PLANE_CONTROL_PORT: "4001"
      TROUPE_PLANE_CONTROL_TLS_DIR: /etc/troupe/control-tls
      TROUPE_PLANE_CONTROL_REQUIRE_TLS: "true"
      # The worker image of this release, which the profile the bootstrap writes names
      # as `release`, so the profile follows `TROUPE_VERSION`.
      TROUPE_WORKER_IMAGE: ${TROUPE_WORKER_IMAGE:-ghcr.io/it-minds/troupe-worker:${TROUPE_VERSION:-0.32.0-beta}}

      TROUPE_ARTIFACTS_URL: http://${TROUPE_LIGHT_ARTIFACTS_HOST:?set TROUPE_LIGHT_ARTIFACTS_HOST in .env}:${TROUPE_LIGHT_ARTIFACTS_PORT:-8081}
      TROUPE_ARTIFACTS_PORT: "4003"

      TROUPE_BREAKGLASS_TOKEN: ${TROUPE_BREAKGLASS_TOKEN:?set TROUPE_BREAKGLASS_TOKEN in .env}
      RELEASE_DISTRIBUTION: none
    volumes:
      - control-tls:/etc/troupe/control-tls:ro
      - bao-tokens:/run/troupe/bao:ro

  # The GUI image: the app at `/app` and the console at `/console`, static files behind
  # nginx. `TROUPE_GUI_BASE` is baked in at build time, as the published image has it.
  gui:
    image: ${TROUPE_GUI_IMAGE:-ghcr.io/it-minds/troupe-gui:${TROUPE_VERSION:-0.32.0-beta}}
    build:
      context: ../../clients/gui
      dockerfile: Dockerfile
      additional_contexts:
        licences: ../..
      args:
        TROUPE_GUI_BASE: app
    restart: unless-stopped

  # The one door. Caddy, for a configuration that fits on one screen: the paths the chart
  # gives two Ingresses, here in one file, with the proxy's second port for artifacts.
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - plane
      - gui
      - dex
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${TROUPE_LIGHT_PORT:-8080}:8080"
      - "${TROUPE_LIGHT_ARTIFACTS_PORT:-8081}:8081"

  # Through the break-glass door, once the plane answers: the profile `local` whose
  # workers are registered machines, this box registered against it, and its secret and
  # the control CA written where the worker reads them. Then it waits for the first
  # sign-in by somebody in the team group, makes that group a team allowed to run where
  # nothing is enforced, and grants it the profile. Every step is skipped where it has
  # been done, so a restart changes nothing.
  bootstrap:
    image: python:3.13-alpine3.22
    restart: on-failure
    depends_on:
      plane: {condition: service_started}
    command: ["python3", "-I", "/opt/troupe/bootstrap.py"]
    environment:
      PLANE_URL: http://plane:4000
      TROUPE_BREAKGLASS_TOKEN: ${TROUPE_BREAKGLASS_TOKEN:?set TROUPE_BREAKGLASS_TOKEN in .env}
      TROUPE_LIGHT_TEAM_GROUP: ${TROUPE_LIGHT_TEAM_GROUP:-troupe-users}
      TROUPE_LIGHT_HOST: ${TROUPE_LIGHT_HOST}
      HOST_DIR: /run/troupe/host
    volumes:
      - ./bootstrap/bootstrap.py:/opt/troupe/bootstrap.py:ro
      - host-enrolment:/run/troupe/host

  # The worker: the same release the chart runs as a pod, here a registered machine that
  # dials the plane over TLS with the secret the bootstrap wrote. It starts once that
  # secret is there.
  #
  # Every command a session runs is in bubblewrap, which needs user, mount and PID
  # namespaces of its own and a `/proc` it can mount, so this container runs without
  # Docker's default seccomp and AppArmor profiles and with `/proc` unmasked: these are
  # the three settings the chart's seccomp profile, AppArmor profile and user namespaces
  # stand for on a cluster, and without any one of them the worker refuses every command.
  # The container is still an unprivileged user, with no capability.
  worker:
    <<: *worker-image
    restart: unless-stopped
    depends_on:
      openbao: {condition: service_healthy}
      minio-setup: {condition: service_completed_successfully}
      bootstrap: {condition: service_started}
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -s /run/troupe/host/secret ] && [ -s /run/troupe/host/ca.crt ]; do
          echo "worker: waiting for this machine's registration"; sleep 3
        done
        export TROUPE_BAO_TOKEN="$$(cat /run/troupe/bao/worker)"
        exec /app/bin/troupe_worker start
    environment:
      <<: *object-store
      TROUPE_WORKER_AUTOSTART: "true"
      TROUPE_PLANE_CONTROL: plane:4001
      TROUPE_PLANE_CA_PATH: /run/troupe/host/ca.crt
      TROUPE_TOKEN_PATH: /run/troupe/host/secret
      TROUPE_PROFILE: local
      TROUPE_SESSIONS_PER_POD: ${TROUPE_LIGHT_SESSIONS:-4}
      # Where a client reaches this worker: through the proxy, on the one port.
      TROUPE_WORKER_ENDPOINT: ws://${TROUPE_LIGHT_HOST}:${TROUPE_LIGHT_PORT:-8080}/v1/socket
      # The browser origin the web app is served from, so its socket is admitted; the
      # desktop app's own origins are admitted beside it.
      TROUPE_ALLOWED_ORIGINS: http://${TROUPE_LIGHT_HOST}:${TROUPE_LIGHT_PORT:-8080}
      TROUPE_STATE_HOME: /var/lib/troupe
      TROUPE_JWKS_PATH: /var/lib/troupe/jwks.json
      TROUPE_BAO_ADDR: http://openbao:8200
      TROUPE_HTTP_PORT: "4000"

      TROUPE_PROVIDER: ${TROUPE_PROVIDER:-fake}
      TROUPE_MODEL: ${TROUPE_MODEL:-fake}
      TROUPE_BASE_URL: ${TROUPE_BASE_URL:-}
      TROUPE_API_KEY: ${TROUPE_API_KEY:-}
      TROUPE_FAKE_SCRIPT: /etc/troupe/fake.json

      RELEASE_DISTRIBUTION: none
      ERL_FLAGS: "+Q 65536"
    volumes:
      - worker-state:/var/lib/troupe
      - host-enrolment:/run/troupe/host:ro
      - bao-tokens:/run/troupe/bao:ro
      - ./worker/fake.json:/etc/troupe/fake.json:ro

volumes:
  postgres-data:
  minio-data:
  openbao-data:
  openbao-keys:
  bao-tokens:
  dex-data:
  dex-config:
  control-tls:
  host-enrolment:
  worker-state:
