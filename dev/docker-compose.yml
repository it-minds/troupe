# The things Troupe's plane and workers talk to, for development and tests.
#
# Deliberately on their own ports and their own project name: a developer's machine
# usually has a Postgres and a MinIO already, and neither should notice this one. In a
# real installation these are managed services or in-cluster; nothing here is a
# deployment reference.
name: troupe-dev

services:
  # A named volume is created root-owned, and PostgreSQL archives WAL as `postgres` — so
  # without this every archive_command fails silently and point-in-time recovery has
  # nothing to recover *through*. Found by `scripts/pitr-drill`, which is what a drill is
  # for.
  wal-archive-permissions:
    image: busybox:1.36
    command: sh -c "mkdir -p /wal-archive && chown 70:70 /wal-archive && chmod 700 /wal-archive"
    volumes:
      - wal-archive:/wal-archive

  postgres:
    image: postgres:16-alpine
    depends_on:
      wal-archive-permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: troupe
      POSTGRES_PASSWORD: troupe
      POSTGRES_DB: troupe_plane_dev
      # Point-in-time recovery is a done item, and it needs WAL archiving on.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
      - -c
      - archive_timeout=60
    ports:
      - "55432:5432"
      # Where `scripts/pitr-drill` brings a restored cluster up, beside the live one, so
      # a rebuild can be run against it before anything is switched over.
      - "55433:5433"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - wal-archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troupe -d troupe_plane_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  # quay.io, not Docker Hub: MinIO withdrew `minio/minio` and `minio/mc` from Docker
  # Hub, and a pull of either now fails with "pull access denied", which reads like a
  # credentials problem and is not one. The same images, same tags, are on quay.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: troupe
      MINIO_ROOT_PASSWORD: troupe-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Versioning on the bucket is required: erasure has to destroy prior versions too,
  # and a done item checks that none of them decrypt afterwards.
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set troupe http://minio:9000 troupe troupe-secret &&
      mc mb --ignore-existing troupe/troupe-sessions &&
      mc version enable troupe/troupe-sessions &&
      echo 'bucket ready'
      "

  openbao:
    image: openbao/openbao:2.4.1
    command: server -dev -dev-root-token-id=troupe-dev-root -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: troupe-dev-root
      BAO_ADDR: http://0.0.0.0:8200
    ports:
      - "58200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev mode gives us KV v2 at `secret/` and nothing else. The plane signs session
  # tokens through transit rather than holding a private key, so the engine and the
  # signing key have to exist before anything can mint one.
  openbao-setup:
    image: openbao/openbao:2.4.1
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: troupe-dev-root
    entrypoint: >
      /bin/sh -c "
      bao secrets enable -path=transit transit 2>/dev/null || true;
      bao write -f transit/keys/troupe-session-tokens type=ecdsa-p256 2>/dev/null || true;
      echo 'transit ready'
      "

volumes:
  postgres-data:
  minio-data:
  wal-archive:
