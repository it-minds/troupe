# The things Troupe's plane and workers talk to, for development and tests.
#
# Deliberately on their own ports and their own project name: a developer's machine
# usually has a Postgres and a MinIO already, and neither should notice this one.
# The host ports are below 32768, outside the range Linux (32768-60999) and Windows
# (49152-65535) hand out to outgoing connections: a port in that range can already be
# held by a checkout or an image pull, and the service then fails to start with
# "address already in use". In a real installation these are managed services or
# in-cluster; nothing here is a deployment reference.
#
# The three that stay up restart with Docker, so after the WSL VM or the machine
# restarts the stack is back once Docker is, without `scripts/dev-up`. The one-shot
# setup services do not: what they write is on a volume and survives.
name: troupe-dev

services:
  # A named volume is created root-owned, and PostgreSQL archives WAL as `postgres` — so
  # without this every archive_command fails silently and point-in-time recovery has
  # nothing to recover *through*. Found by `scripts/pitr-drill`, which is what a drill is
  # for.
  wal-archive-permissions:
    image: busybox:1.36
    command: sh -c "mkdir -p /wal-archive && chown 70:70 /wal-archive && chmod 700 /wal-archive"
    volumes:
      - wal-archive:/wal-archive

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      wal-archive-permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: troupe
      POSTGRES_PASSWORD: troupe
      POSTGRES_DB: troupe_plane_dev
      # Point-in-time recovery is a done item, and it needs WAL archiving on.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
      - -c
      - archive_timeout=60
    ports:
      - "25432:5432"
      # Where `scripts/pitr-drill` brings a restored cluster up, beside the live one, so
      # a rebuild can be run against it before anything is switched over.
      - "25433:5433"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - wal-archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troupe -d troupe_plane_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pigsty's community builds of MinIO, not MinIO's own: MinIO withdrew `minio/minio` and
  # `minio/mc` from Docker Hub, then made its quay.io copies private too (2026-09-24),
  # and each fails with a pull error that reads like a credentials problem and is not
  # one. A third party's tag can be moved, so each is pinned by digest as well.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: troupe
      MINIO_ROOT_PASSWORD: troupe-secret
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Versioning on the bucket is required: erasure has to destroy prior versions too,
  # and a done item checks that none of them decrypt afterwards.
  minio-setup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set troupe http://minio:9000 troupe troupe-secret &&
      mc mb --ignore-existing troupe/troupe-sessions &&
      mc version enable troupe/troupe-sessions &&
      echo 'bucket ready'
      "

  # Dev mode gives us KV v2 at `secret/` and nothing else, and keeps it in memory, so
  # every start is an empty OpenBao. The plane signs session tokens through transit
  # rather than holding a private key, so the engine and the signing key have to exist
  # before anything can mint one: the container writes them itself each time it starts,
  # and is healthy only once the key is there.
  openbao:
    image: openbao/openbao:2.4.1
    restart: unless-stopped
    # The image's own entrypoint, with the seeding started beside it: it waits for the
    # server, then writes the engine and the key. Started from a subshell that exits at
    # once, so it is dumb-init's to reap and not the server's. `sh` is only `$0`.
    entrypoint:
      - /usr/bin/dumb-init
      - /bin/sh
      - -c
      - |
        ( (
          export BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=troupe-dev-root
          until bao status >/dev/null 2>&1; do sleep 1; done
          bao secrets enable -path=transit transit
          bao write -f transit/keys/troupe-session-tokens type=ecdsa-p256
        ) & )
        exec /bin/sh /usr/local/bin/docker-entrypoint.sh "$$@"
      - sh
    command: server -dev -dev-root-token-id=troupe-dev-root -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: troupe-dev-root
      BAO_ADDR: http://0.0.0.0:8200
    ports:
      - "28200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "BAO_TOKEN=troupe-dev-root bao read -address=http://127.0.0.1:8200 -field=name transit/keys/troupe-session-tokens"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:
  wal-archive:
