# The things Troupe's plane and workers talk to, for development and tests.
#
# Deliberately on their own ports and their own project name: a developer's machine
# usually has a Postgres and a MinIO already, and neither should notice this one. In a
# real installation these are managed services or in-cluster; nothing here is a
# deployment reference.
name: troupe-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: troupe
      POSTGRES_PASSWORD: troupe
      POSTGRES_DB: troupe_plane_dev
      # Point-in-time recovery is a done item, and it needs WAL archiving on.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
      - -c
      - archive_timeout=60
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - wal-archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troupe -d troupe_plane_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: troupe
      MINIO_ROOT_PASSWORD: troupe-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Versioning on the bucket is required: erasure has to destroy prior versions too,
  # and a done item checks that none of them decrypt afterwards.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set troupe http://minio:9000 troupe troupe-secret &&
      mc mb --ignore-existing troupe/troupe-sessions &&
      mc version enable troupe/troupe-sessions &&
      echo 'bucket ready'
      "

  openbao:
    image: openbao/openbao:2.4.1
    command: server -dev -dev-root-token-id=troupe-dev-root -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: troupe-dev-root
      BAO_ADDR: http://0.0.0.0:8200
    ports:
      - "58200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Dev mode gives us KV v2 at `secret/` and nothing else. The plane signs session
  # tokens through transit rather than holding a private key, so the engine and the
  # signing key have to exist before anything can mint one.
  openbao-setup:
    image: openbao/openbao:2.4.1
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: troupe-dev-root
    entrypoint: >
      /bin/sh -c "
      bao secrets enable -path=transit transit 2>/dev/null || true;
      bao write -f transit/keys/troupe-session-tokens type=ecdsa-p256 2>/dev/null || true;
      echo 'transit ready'
      "

volumes:
  postgres-data:
  minio-data:
  wal-archive:
