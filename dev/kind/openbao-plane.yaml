# Generated by `mix troupe.openbao.policy` from `Troupe.KMS.Policy.plane_grants/1`.
# Do not edit: docs/admin/openbao.md is written from the same list.
#
# The kind cluster's plane logs in as its ServiceAccount under the role `troupe-plane`,
# carrying these policies and no other, as a deployment's does: the OpenBao setup Job in
# dependencies.yaml writes each policy and runs `role`. So the plane's check of its
# grants meets a role that holds what the docs say and nothing more.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-plane-policies
  namespace: troupe-system
data:
  role: |
    bao write auth/kubernetes/role/troupe-plane bound_service_account_names=troupe-plane bound_service_account_namespaces=troupe-system audience=troupe-kms token_policies=troupe-plane-session-tokens,troupe-plane-signing,troupe-plane,troupe-plane-invites,troupe-plane-github ttl=1h
  troupe-plane-session-tokens.hcl: |
    path "transit/sign/troupe-session-tokens" {
      capabilities = ["create", "update"]
    }

    path "transit/keys/troupe-session-tokens" {
      capabilities = ["read"]
    }
  troupe-plane-signing.hcl: |
    path "transit/keys/troupe-plane-signing" {
      capabilities = ["create", "read", "update"]
    }

    path "transit/keys/troupe-plane-signing/rotate" {
      capabilities = ["update"]
    }

    path "transit/sign/troupe-plane-signing" {
      capabilities = ["create", "update"]
    }
  troupe-plane.hcl: |
    path "secret/metadata/troupe/teams/+/sessions/*" {
      capabilities = ["delete", "list", "read"]
    }

    path "secret/metadata/troupe/people/+/sessions/*" {
      capabilities = ["delete", "list", "read"]
    }

    path "secret/metadata/troupe/people/+/mcp/*" {
      capabilities = ["list", "read"]
    }
  troupe-plane-invites.hcl: |
    path "secret/metadata/troupe/people/+/invited/*" {
      capabilities = ["delete"]
    }
  troupe-plane-github.hcl: |
    path "transit/wrapping_key" {
      capabilities = ["read"]
    }

    path "transit/keys/troupe-github-app" {
      capabilities = ["read", "delete"]
    }

    path "transit/keys/troupe-github-app/config" {
      capabilities = ["update"]
    }

    path "transit/keys/troupe-github-app/import" {
      capabilities = ["create", "update"]
    }

    path "transit/keys/troupe-github-app/import_version" {
      capabilities = ["create", "update"]
    }

    path "transit/sign/troupe-github-app" {
      capabilities = ["create", "update"]
    }

    path "transit/keys/troupe-github-webhook" {
      capabilities = ["read", "delete"]
    }

    path "transit/keys/troupe-github-webhook/config" {
      capabilities = ["update"]
    }

    path "transit/keys/troupe-github-webhook/import" {
      capabilities = ["create", "update"]
    }

    path "transit/keys/troupe-github-webhook/import_version" {
      capabilities = ["create", "update"]
    }

    path "transit/hmac/troupe-github-webhook/sha2-256" {
      capabilities = ["create", "update"]
    }
