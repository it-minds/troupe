# The chart, sized for one laptop.
#
# Every difference from the defaults is a development choice and is a reason not to run
# this anywhere else: one replica each, no TLS on the HTTP side, OpenBao in dev mode, and an
# identity provider with a password in a ConfigMap.

# `troupe-system` here also runs the development dependencies (`dependencies.yaml`), which
# `baseline` admits and `restricted` does not, so the chart is told the level rather than
# working it out from its own pods. `scripts/remote-up` raises it to `privileged` where the
# workers' AppArmor DaemonSet runs. The worker namespaces are the operator's to label, as
# anywhere: `privileged`, since their pods run in user namespaces.
podSecurity:
  labels: true
  level: baseline

operator:
  image: {tag: dev}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  ingressClassName: nginx
  # ingress-nginx's kind manifest runs the controller here, and the operator labels the
  # namespace `troupe.dev/ingress=true`, as it does where a deployment names its own.
  ingressNamespace: ingress-nginx
  tlsSecretName: ""
  # `scripts/remote-up` installs Cilium, because kind's default CNI enforces no policy at
  # all — so without this the operator would write a CIDR rule where the cluster can
  # enforce an FQDN one, and the egress claim would be proven against a weaker rule than
  # the one a deployment runs.
  ciliumAvailable: true
  # No certificate, and kind maps the host's 30080 onto the ingress controller's 80.
  workersScheme: ws
  workersPort: 30080

plane:
  enabled: true
  image: {tag: dev}
  # One, so the `:global` singletons need no Erlang cluster and distribution stays off
  # the network entirely.
  replicas: 1
  distribution: none
  host: plane.localtest.me
  # `localtest.me` resolves to 127.0.0.1 everywhere, and kind maps the host's 30080 onto
  # the ingress controller — so one URL works from the laptop and names the same thing
  # the plane calls itself.
  baseUrl: http://plane.localtest.me:30080
  ingressClassName: nginx
  tlsSecretName: ""
  # The control port's certificate without cert-manager, which this cluster does not run:
  # `scripts/remote-up` makes a CA and a certificate for the control Service with openssl
  # and puts them in this Secret, as cert-manager would.
  controlTls:
    certManager: false
    secretName: troupe-plane-control-tls
    # TLS only, as the chart defaults to: the operator gives the dev profile's namespace
    # the CA, its pods dial with TLS, and the cluster suite proves a plaintext dial from a
    # worker namespace is refused.
    requireTls: true
  provisioningMode: direct
  platformAdminGroup: troupe-platform-admins
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  oidc:
    issuer: http://dex.localtest.me:30080/dex
    clientId: troupe
    authorizeUrl: http://dex.localtest.me:30080/dex/auth
    deviceUrl: http://dex.localtest.me:30080/dex/device/code
    tokenUrl: http://dex.localtest.me:30080/dex/token
    # A public client runs the device flow with no secret, which is the whole reason
    # `troupe login` uses that grant.
    secretName: ""

# What a profile whose image is `release` runs here: the worker scripts/build-images
# loads into kind.
#
# And no seccomp filter on the worker container, so bubblewrap can make the user namespace
# every command's sandbox is built from. The chart's own profile, which keeps a filter, is
# installed on a node's disk by a DaemonSet; a cluster that is thrown away has no need of
# one, and the worker namespaces here are at the `privileged` Pod Security level, which
# `Unconfined` needs. Never this anywhere else. User namespaces stay on, as the chart has
# them (`worker.userNamespaces`): `scripts/kind-up` lets a user-namespaced pod reach kind's
# createContainer hook.
#
# The worker's AppArmor profile is off here, and `scripts/remote-up` turns it on where the
# kind node's kernel runs AppArmor (`scripts/kind-up` gives such a node the parser its
# runtime needs to apply profiles), as on CI's Ubuntu runner, whose kernel restricts
# unprivileged user namespaces as an Ubuntu node's does. Docker Desktop's kernel runs no
# AppArmor, and its kubelet would refuse a pod that asked for a profile.
worker:
  image: {tag: dev}
  seccomp:
    type: Unconfined
  appArmor:
    enabled: false

bao:
  address: http://openbao.troupe-system.svc:8200
  # Kubernetes auth, as a deployment has it: the plane logs in as its ServiceAccount under
  # the role `troupe-plane`, which `dependencies.yaml` makes with the policies
  # `docs/admin/openbao.md` lists and nothing more, so the plane's check of its grants
  # (`Troupe.Plane.KMSCheck`) meets the role a deployment gives it rather than a root token
  # that holds everything. OpenBao is in dev mode all the same, and its root token is the
  # cluster suite's own, for its setup.
  tokenSecretName: ""

objectStore:
  endpoint: http://minio.troupe-system.svc:9000
  bucket: troupe-sessions
  region: us-east-1
  secretName: troupe-object-store

# On, because `mix troupe.e2e` has a claim about it and a facade nobody deploys is a
# facade nobody tests. It is off by default in the chart for the opposite and equally
# good reason: a cluster with nothing calling it has no reason to run one.
# The GUI, at http://plane.localtest.me:30080/app, from the image scripts/build-images
# loads into kind.
gui:
  image: {tag: dev}
  replicas: 1

a2a:
  enabled: true
  image: {tag: dev}
  host: a2a.localtest.me
  publicUrl: http://a2a.localtest.me:30080
  ingressClassName: nginx
  tlsSecretName: ""

policy:
  install: true
  name: default
  allowedImageRepositories:
    - ghcr.io/it-minds/troupe-worker
  maxReplicas: 2
  maxSessionsPerPod: 4
  maxResources: {cpu: "2", memory: 4Gi}
  # Named, not starred: a bare `*` is not a pattern the policy accepts, and is refused —
  # a profile that could name any endpoint could send a team's code anywhere.
  allowedEgress:
    # The model gateway the dev profile calls. `scripts/remote-up` puts the host of
    # `TROUPE_GATEWAY_URL` here, by its place in the list, so it stays first; this
    # placeholder is what it is without one, and resolves nowhere.
    - llm-gw.example.test
    - github.com
    - "*.github.com"
    # The operator's cluster suite runs against whatever cluster is there and its
    # fixtures name this one. A development policy that refused it would make
    # `scripts/remote-up` and `mix check` unable to share a cluster.
    - "*.anthropic.com"
    # The cluster suite's public host for an `egress.fqdns` entry with a port: a profile
    # names it on one port, and its workers reach it there and on no other.
    - example.net
  allowedStorageClasses:
    - standard
  namespacePrefix: troupe-w-
  workersDomain: workers.localtest.me
