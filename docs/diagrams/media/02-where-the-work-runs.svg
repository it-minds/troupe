<!-- the tools -->
<rect x="250" y="690" width="230" height="110" fill="#12121C" stroke="#00C6C9" stroke-width="1.5"/>
<text class="t" x="272" y="732" font-size="24" font-weight="900" fill="#F4ECDB">Model</text>
<text class="t" x="272" y="762" font-size="15" fill="#A3A3B8">Anthropic, OpenAI,</text>
<text class="t" x="272" y="782" font-size="15" fill="#A3A3B8">or a gateway. Thinks.</text>

<rect x="540" y="690" width="230" height="110" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="t" x="562" y="732" font-size="24" font-weight="900" fill="#F4ECDB">Files</text>
<text class="t" x="562" y="762" font-size="15" fill="#A3A3B8">Reads on its own.</text>
<text class="t" x="562" y="782" font-size="15" fill="#A3A3B8">Writes with your say-so.</text>

<rect x="830" y="690" width="230" height="110" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="t" x="852" y="732" font-size="24" font-weight="900" fill="#F4ECDB">Shell</text>
<text class="t" x="852" y="762" font-size="15" fill="#A3A3B8">Commands in the</text>
<text class="t" x="852" y="782" font-size="15" fill="#A3A3B8">workspace. Sandboxed on a pod.</text>

<rect x="1120" y="690" width="230" height="110" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="t" x="1142" y="732" font-size="24" font-weight="900" fill="#F4ECDB">MCP servers</text>
