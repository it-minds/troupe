<line x1="1090" y1="320" x2="1090" y2="380" stroke="#00C6C9" stroke-width="1.5"/>
<text class="m" x="800" y="352" text-anchor="middle" font-size="13" fill="#00DBD3" letter-spacing="3">ONE PROTOCOL · SAME EVENTS EVERYWHERE</text>

<!-- the daemon, on your machine -->
<rect x="258" y="388" width="520" height="200" fill="#000353"/>
<rect x="250" y="380" width="520" height="200" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
