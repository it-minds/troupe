<text class="m" x="280" y="414" font-size="13" font-weight="500" fill="#FFBC56" letter-spacing="3">THIS MACHINE</text>
<text class="t" x="280" y="456" font-size="30" font-weight="900" fill="#F4ECDB" letter-spacing="-0.5">troupe-daemon</text>
<text class="t" x="280" y="486" font-size="17" fill="#A3A3B8">The harness, on your laptop.</text>
<use href="#mask" x="280" y="528" width="32" height="32" color="#00DBD3"/>
