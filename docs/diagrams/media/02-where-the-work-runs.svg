<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Where the work runs: daemon, worker, clients and tools</title>
<desc id="desc">Three clients at the top, a terminal UI, the desktop app and your own program, all speaking one protocol. Below them two homes for the same harness: troupe-daemon on your machine and troupe-worker in a pod on your cluster. Below those, what the harness calls: the model, files, shell and MCP servers. Files and shell ask a person first.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&amp;family=DM+Mono:wght@400;500&amp;family=VT323&amp;display=swap');
.t{font-family:Figtree,'Segoe UI',system-ui,sans-serif}
.m{font-family:'DM Mono',ui-monospace,Menlo,Consolas,monospace}
.s{font-family:VT323,'DM Mono',ui-monospace,monospace}
</style>
<defs>
  <symbol id="mask" viewBox="0 0 48 48">
    <path d="M9 15 Q9 7 24 7 Q39 7 39 15 L39 25 Q39 35 24 43 Q9 35 9 25 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M15.5 21 Q19 18.4 22.5 21 Q19 23.6 15.5 21 Z" fill="currentColor"/>
    <path d="M25.5 21 Q29 18.4 32.5 21 Q29 23.6 25.5 21 Z" fill="currentColor"/>
  </symbol>
  <symbol id="chain" viewBox="0 0 100 20">
    <rect x="1" y="2" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="17" y1="10" x2="42" y2="10" stroke="currentColor" stroke-width="2"/>
    <rect x="42" y="2" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="58" y1="10" x2="83" y2="10" stroke="currentColor" stroke-width="2"/>
    <rect x="83" y="2" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#A3A3B8"/>
  </marker>
</defs>

<rect width="1600" height="900" fill="#0B0B12"/>

<!-- header -->
<text class="s" x="80" y="78" font-size="24" fill="#00DBD3" letter-spacing="4">// ONE HARNESS, TWO HOMES</text>
<text class="t" x="80" y="134" font-size="46" font-weight="900" fill="#F4ECDB" letter-spacing="-1.5">Where the work runs</text>

<!-- clients -->
<g>
  <rect x="256" y="186" width="300" height="84" fill="#000353"/>
  <rect x="250" y="180" width="300" height="84" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <rect x="272" y="206" width="40" height="30" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text class="m" x="280" y="227" font-size="14" font-weight="500" fill="#00DBD3">&gt;_</text>
  <text class="t" x="330" y="216" font-size="22" font-weight="800" fill="#F4ECDB">Terminal UI</text>
  <text class="m" x="330" y="244" font-size="13" fill="#8A8AA0" letter-spacing="2">TROUPE</text>

  <rect x="656" y="186" width="300" height="84" fill="#000353"/>
  <rect x="650" y="180" width="300" height="84" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <rect x="672" y="206" width="40" height="30" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <line x1="672" y1="215" x2="712" y2="215" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text class="t" x="730" y="216" font-size="22" font-weight="800" fill="#F4ECDB">Desktop app</text>
  <text class="m" x="730" y="244" font-size="13" fill="#8A8AA0" letter-spacing="2">OR THE WEB APP</text>

  <rect x="1056" y="186" width="300" height="84" fill="#000353"/>
  <rect x="1050" y="180" width="300" height="84" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <rect x="1072" y="206" width="40" height="30" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text class="m" x="1092" y="227" text-anchor="middle" font-size="15" fill="#F4ECDB">{ }</text>
  <text class="t" x="1130" y="216" font-size="22" font-weight="800" fill="#F4ECDB">Your own program</text>
  <text class="m" x="1130" y="244" font-size="13" fill="#8A8AA0" letter-spacing="2">SPEAKS THE PROTOCOL</text>
</g>

<!-- one protocol -->
<line x1="400" y1="264" x2="400" y2="320" stroke="#00C6C9" stroke-width="1.5"/>
