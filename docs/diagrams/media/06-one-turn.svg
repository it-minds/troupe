<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One turn of an agent: think, act, repeat</title>
<desc id="desc">An input starts a turn. Inside a while-true loop the agent thinks, one streamed HTTP call to the model, then either has tool calls, which run at the same time with some gated by a person's approval, and thinks again with the results, or has text only and is done. Done ends the turn; the next input starts the next. Below, the agent's real states: idle, thinking, acting, compacting, done.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&amp;family=DM+Mono:wght@400;500&amp;family=VT323&amp;display=swap');
.t{font-family:Figtree,'Segoe UI',system-ui,sans-serif}
.m{font-family:'DM Mono',ui-monospace,Menlo,Consolas,monospace}
.s{font-family:VT323,'DM Mono',ui-monospace,monospace}
</style>
<defs>
  <symbol id="person" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor" font-family="Figtree,'Segoe UI',system-ui,sans-serif">AB</text>
  </symbol>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#A3A3B8"/>
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#00C6C9"/>
  </marker>
</defs>

<rect width="1600" height="900" fill="#0B0B12"/>

<!-- header -->
<text class="s" x="80" y="78" font-size="24" fill="#00DBD3" letter-spacing="4">// THINK, ACT, REPEAT</text>
<text class="t" x="80" y="134" font-size="46" font-weight="900" fill="#F4ECDB" letter-spacing="-1.5">One turn of an agent</text>

<!-- you, and the input -->
<use href="#person" x="80" y="355" width="60" height="60" color="#F4ECDB"/>
<line x1="150" y1="385" x2="250" y2="385" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="256" y="361" width="130" height="60" fill="#000353"/>
<rect x="250" y="355" width="130" height="60" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="t" x="315" y="392" text-anchor="middle" font-size="20" font-weight="800" fill="#F4ECDB">Input</text>
<line x1="380" y1="385" x2="460" y2="385" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- the loop -->
<rect x="420" y="240" width="1100" height="460" fill="none" stroke="#00C6C9" stroke-width="1.5" stroke-dasharray="8 6"/>
<text class="m" x="436" y="266" font-size="16" font-weight="500" fill="#F4ECDB">while (true) {</text>
<text class="m" x="436" y="690" font-size="16" font-weight="500" fill="#F4ECDB">}</text>

<!-- THINK -->
<rect x="468" y="308" width="310" height="170" fill="#000353"/>
<rect x="460" y="300" width="310" height="170" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<rect x="460" y="300" width="4" height="170" fill="#00C6C9"/>
<text class="t" x="484" y="340" font-size="28" font-weight="900" fill="#F4ECDB">Think</text>
<text class="t" x="484" y="366" font-size="15" fill="#A3A3B8">One HTTP call to the model.</text>
<text class="m" x="484" y="398" font-size="11" fill="#8A8AA0" letter-spacing="2">STREAMED · llm_delta</text>
<g fill="#00DBD3">
  <rect x="484" y="408" width="10" height="16" opacity=".35"/>
  <rect x="502" y="408" width="10" height="16" opacity=".45"/>
  <rect x="520" y="408" width="10" height="16" opacity=".55"/>
  <rect x="538" y="408" width="10" height="16" opacity=".65"/>
  <rect x="556" y="408" width="10" height="16" opacity=".75"/>
  <rect x="574" y="408" width="10" height="16" opacity=".85"/>
  <rect x="592" y="408" width="10" height="16" opacity=".92"/>
  <rect x="610" y="408" width="10" height="16"/>
  <rect x="628" y="408" width="10" height="16"/>
</g>
<line x1="646" y1="416" x2="668" y2="416" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="672" y="404" width="78" height="24" fill="#00C6C9"/>
<text class="m" x="711" y="420" text-anchor="middle" font-size="10" font-weight="500" fill="#0B0B12" letter-spacing="1.5">RESPONSE</text>
<text class="m" x="484" y="452" font-size="11" fill="#8A8AA0" letter-spacing="1.5">deltas shown · response logged</text>

<!-- the question -->
<line x1="770" y1="385" x2="805" y2="385" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="805" y="365" width="40" height="40" fill="#1C1C2B" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="t" x="825" y="393" text-anchor="middle" font-size="22" font-weight="900" fill="#F4ECDB">?</text>
<text class="m" x="825" y="352" text-anchor="middle" font-size="11" fill="#8A8AA0" letter-spacing="2">TOOL CALLS?</text>

<!-- yes: act -->
<line x1="845" y1="385" x2="900" y2="385" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" x="872" y="376" text-anchor="middle" font-size="11" font-weight="500" fill="#00DBD3" letter-spacing="2">YES</text>

<!-- ACT -->
<rect x="908" y="308" width="580" height="170" fill="#000353"/>
<rect x="900" y="300" width="580" height="170" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<rect x="900" y="300" width="4" height="170" fill="#00C6C9"/>
<text class="t" x="924" y="340" font-size="28" font-weight="900" fill="#F4ECDB">Act</text>
<text class="t" x="924" y="366" font-size="15" fill="#A3A3B8">Tool calls run at the same time. Results come back in call order.</text>
<g class="m" font-size="11" fill="#8A8AA0">
  <text x="924" y="409">read_file</text>
  <rect x="1010" y="398" width="110" height="16" fill="#00C6C9"/>
  <text x="924" y="433">shell</text>
  <rect x="1010" y="422" width="66" height="16" fill="#FF0080"/>
  <text x="1043" y="434" text-anchor="middle" font-size="9" font-weight="500" fill="#0B0B12" letter-spacing="1.5">ASKS</text>
  <rect x="1076" y="422" width="330" height="16" fill="#00C6C9"/>
  <text x="924" y="457">write_file</text>
  <rect x="1010" y="446" width="66" height="16" fill="#FF0080"/>
  <text x="1043" y="458" text-anchor="middle" font-size="9" font-weight="500" fill="#0B0B12" letter-spacing="1.5">ASKS</text>
  <rect x="1076" y="446" width="180" height="16" fill="#00C6C9"/>
</g>
<text class="m" x="1456" y="458" text-anchor="end" font-size="10" fill="#7B7B94" letter-spacing="1.5">TIME →</text>

<!-- results go back into the conversation: over the top -->
<polyline points="1190,300 1190,282 615,282 615,300" fill="none" stroke="#00C6C9" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<text class="m" x="900" y="276" text-anchor="middle" font-size="11" font-weight="500" fill="#00DBD3" letter-spacing="2">RESULTS APPENDED TO THE CONVERSATION · THINK AGAIN</text>

<!-- no: done -->
<line x1="825" y1="405" x2="825" y2="560" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" x="838" y="490" font-size="11" font-weight="500" fill="#A3A3B8" letter-spacing="2">NO · TEXT ONLY</text>
<rect x="766" y="566" width="120" height="56" fill="#000353"/>
<rect x="760" y="560" width="120" height="56" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="t" x="820" y="596" text-anchor="middle" font-size="20" font-weight="800" fill="#F4ECDB">Done</text>

<!-- housekeeping -->
<text class="m" x="1504" y="690" text-anchor="end" font-size="11" fill="#7B7B94" letter-spacing="1.5">COMPACTS WHEN THE PROMPT GETS LONG · ASKS WHEN THE BUDGET RUNS OUT</text>

<!-- the outer loop: the next input is the next turn -->
<polyline points="880,588 930,588 930,740 315,740 315,415" fill="none" stroke="#A3A3B8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text class="m" x="660" y="732" text-anchor="middle" font-size="11" fill="#8A8AA0" letter-spacing="2">TURN OVER · THE NEXT INPUT IS THE NEXT TURN</text>
<text class="m" x="660" y="762" text-anchor="middle" font-size="11" fill="#7B7B94" letter-spacing="1.5">/loop feeds the next input itself until the goal is met</text>

<!-- the real states -->
<text class="m" x="80" y="812" font-size="11" fill="#7B7B94" letter-spacing="2.5">THE AGENT'S STATES</text>
<g class="m" font-size="11" font-weight="500" letter-spacing="2">
  <rect x="80" y="824" width="70" height="26" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text x="115" y="842" text-anchor="middle" fill="#8A8AA0">IDLE</text>
  <rect x="162" y="824" width="100" height="26" fill="none" stroke="#008687" stroke-width="1.5"/>
  <text x="212" y="842" text-anchor="middle" fill="#00DBD3">THINKING</text>
  <rect x="274" y="824" width="86" height="26" fill="none" stroke="#008687" stroke-width="1.5"/>
  <text x="317" y="842" text-anchor="middle" fill="#00DBD3">ACTING</text>
  <rect x="372" y="824" width="118" height="26" fill="none" stroke="#4A3F86" stroke-width="1.5"/>
  <text x="431" y="842" text-anchor="middle" fill="#9C8BFF">COMPACTING</text>
  <rect x="502" y="824" width="70" height="26" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text x="537" y="842" text-anchor="middle" fill="#8A8AA0">DONE</text>
</g>

<!-- key -->
<rect x="1180" y="830" width="14" height="14" fill="#00C6C9"/>
<text class="m" x="1204" y="842" font-size="13" fill="#8A8AA0" letter-spacing="2">THE MACHINE WORKING</text>
<rect x="1430" y="830" width="14" height="14" fill="#FF0080"/>
<text class="m" x="1454" y="842" font-size="13" fill="#8A8AA0" letter-spacing="2">ASKS YOU</text>
</svg>
