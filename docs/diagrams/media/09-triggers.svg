<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Triggers: work nobody starts</title>
<desc id="desc">Three sources on the left, a schedule, a webhook and another agent, fire a trigger stored in the plane. The trigger is a template frozen as a hashed revision; firing it creates a session as a service principal, through the same call a person's client makes, with terms: a budget slice, a turn limit, a wall clock and approvals set to wait or deny, never auto. The session runs on a pod and is flagged for review until a person looks.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&amp;family=DM+Mono:wght@400;500&amp;family=VT323&amp;display=swap');
.t{font-family:Figtree,'Segoe UI',system-ui,sans-serif}
.m{font-family:'DM Mono',ui-monospace,Menlo,Consolas,monospace}
.s{font-family:VT323,'DM Mono',ui-monospace,monospace}
</style>
<defs>
  <symbol id="mask" viewBox="0 0 48 48">
    <path d="M9 15 Q9 7 24 7 Q39 7 39 15 L39 25 Q39 35 24 43 Q9 35 9 25 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M15.5 21 Q19 18.4 22.5 21 Q19 23.6 15.5 21 Z" fill="currentColor"/>
    <path d="M25.5 21 Q29 18.4 32.5 21 Q29 23.6 25.5 21 Z" fill="currentColor"/>
  </symbol>
  <symbol id="person" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor" font-family="Figtree,'Segoe UI',system-ui,sans-serif">AB</text>
  </symbol>
  <symbol id="svc" viewBox="0 0 48 48">
    <rect x="5" y="5" width="38" height="38" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="500" fill="currentColor" font-family="'DM Mono',ui-monospace,Menlo,Consolas,monospace">svc</text>
  </symbol>
  <symbol id="clock" viewBox="0 0 48 48">
    <rect x="5" y="5" width="38" height="38" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="24" y1="24" x2="24" y2="13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="24" x2="32" y2="29" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="hook" viewBox="0 0 48 48">
    <polyline points="6,14 20,14 20,34 42,34" fill="none" stroke="currentColor" stroke-width="3"/>
    <polyline points="34,26 42,34 34,42" fill="none" stroke="currentColor" stroke-width="3"/>
  </symbol>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#A3A3B8"/>
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#00C6C9"/>
  </marker>
</defs>

<rect width="1600" height="900" fill="#0B0B12"/>

<!-- header -->
<text class="s" x="80" y="78" font-size="24" fill="#00DBD3" letter-spacing="4">// WORK NOBODY STARTS</text>
<text class="t" x="80" y="134" font-size="46" font-weight="900" fill="#F4ECDB" letter-spacing="-1.5">Triggers</text>

<!-- sources -->
<text class="m" x="80" y="212" font-size="11" fill="#7B7B94" letter-spacing="2.5">WHAT FIRES IT</text>
<rect x="80" y="230" width="280" height="80" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<use href="#clock" x="98" y="248" width="44" height="44" color="#F4ECDB"/>
<text class="t" x="158" y="266" font-size="20" font-weight="800" fill="#F4ECDB">A schedule</text>
<text class="m" x="158" y="290" font-size="11" fill="#8A8AA0" letter-spacing="1.5">CRON, INSIDE THE PLANE</text>

<rect x="80" y="340" width="280" height="80" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<use href="#hook" x="98" y="358" width="44" height="44" color="#F4ECDB"/>
<text class="t" x="158" y="376" font-size="20" font-weight="800" fill="#F4ECDB">A webhook</text>
<text class="m" x="158" y="400" font-size="11" fill="#8A8AA0" letter-spacing="1.5">LANDS OUTSIDE THE PLANE</text>

<rect x="80" y="450" width="280" height="80" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<use href="#mask" x="98" y="468" width="44" height="44" color="#A3A3B8"/>
<text class="t" x="158" y="486" font-size="20" font-weight="800" fill="#F4ECDB">Another agent</text>
<text class="m" x="158" y="510" font-size="11" fill="#8A8AA0" letter-spacing="1.5">OVER A2A</text>

<line x1="360" y1="270" x2="410" y2="270" stroke="#A3A3B8" stroke-width="1.5"/>
<line x1="360" y1="380" x2="410" y2="380" stroke="#A3A3B8" stroke-width="1.5"/>
<line x1="360" y1="490" x2="410" y2="490" stroke="#A3A3B8" stroke-width="1.5"/>
<line x1="410" y1="270" x2="410" y2="490" stroke="#A3A3B8" stroke-width="1.5"/>
<line x1="410" y1="380" x2="470" y2="380" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- the trigger, in the plane -->
<rect x="478" y="308" width="300" height="164" fill="#000353"/>
<rect x="470" y="300" width="300" height="164" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="m" x="492" y="328" font-size="11" font-weight="500" fill="#00DBD3" letter-spacing="2.5">IN THE PLANE</text>
<text class="t" x="492" y="362" font-size="26" font-weight="900" fill="#F4ECDB">trigger</text>
<text class="t" x="492" y="386" font-size="14" fill="#A3A3B8">A stored template, frozen as a revision.</text>
<rect x="492" y="404" width="96" height="24" fill="#1C1C2B" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<text class="m" x="540" y="421" text-anchor="middle" font-size="11" fill="#F4ECDB" letter-spacing="1">#a1b2c3</text>
<text class="t" x="600" y="421" font-size="12" fill="#8A8AA0">edit it, old runs keep theirs</text>
<text class="m" x="492" y="452" font-size="10" fill="#7B7B94" letter-spacing="1.5">SAME KEY, SAME RUN · NEVER TWICE</text>

<!-- create the session -->
<line x1="770" y1="380" x2="880" y2="380" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" x="825" y="368" text-anchor="middle" font-size="10" fill="#8A8AA0" letter-spacing="0.5">session.create</text>
<text class="m" x="825" y="398" text-anchor="middle" font-size="10" fill="#7B7B94" letter-spacing="1">AS YOU WOULD</text>

<!-- the session, on a pod -->
<rect x="888" y="268" width="340" height="244" fill="#000353"/>
<rect x="880" y="260" width="340" height="244" fill="#12121C" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
<rect x="880" y="260" width="4" height="244" fill="#00C6C9"/>
<text class="m" x="904" y="288" font-size="11" font-weight="500" fill="#00DBD3" letter-spacing="2.5">ON A POD</text>
<use href="#svc" x="904" y="304" width="40" height="40" color="#F4ECDB"/>
<use href="#mask" x="952" y="304" width="40" height="40" color="#00DBD3"/>
<text class="t" x="1004" y="322" font-size="22" font-weight="900" fill="#F4ECDB">a session</text>
<text class="m" x="1004" y="342" font-size="11" fill="#8A8AA0" letter-spacing="1">svc:team/nightly</text>
<text class="m" x="904" y="374" font-size="10" fill="#7B7B94" letter-spacing="1.5">ORIGIN · trigger #a1b2c3</text>
<text class="m" x="904" y="404" font-size="10" fill="#8A8AA0" letter-spacing="2">TERMS</text>
<g class="m" font-size="10" font-weight="500" letter-spacing="1.5">
  <rect x="904" y="414" width="100" height="22" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text x="954" y="429" text-anchor="middle" fill="#A3A3B8">BUDGET SLICE</text>
  <rect x="1012" y="414" width="86" height="22" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text x="1055" y="429" text-anchor="middle" fill="#A3A3B8">MAX TURNS</text>
  <rect x="1106" y="414" width="94" height="22" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/>
  <text x="1153" y="429" text-anchor="middle" fill="#A3A3B8">WALL CLOCK</text>
  <rect x="904" y="444" width="170" height="22" fill="none" stroke="#FF0080" stroke-width="1.5"/>
  <text x="989" y="459" text-anchor="middle" fill="#FF0080">APPROVALS: WAIT | DENY</text>
  <text x="1084" y="459" fill="#7B7B94">never auto</text>
</g>
<text class="t" x="904" y="492" font-size="12" fill="#A3A3B8">Same log, rules and approvals as any session.</text>

<!-- review -->
<line x1="1220" y1="380" x2="1310" y2="380" stroke="#FF0080" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1318" y="328" width="200" height="104" fill="#000353"/>
<rect x="1310" y="320" width="200" height="104" fill="#FF0080"/>
<text class="m" x="1330" y="348" font-size="10" font-weight="500" fill="#0B0B12" letter-spacing="2">NEEDS REVIEW</text>
<use href="#person" x="1330" y="360" width="44" height="44" color="#0B0B12"/>
<text class="t" x="1386" y="380" font-size="18" font-weight="900" fill="#0B0B12">Flagged</text>
<text class="t" x="1386" y="400" font-size="12" fill="#0B0B12">until a person looks</text>

<!-- the shape of it -->
<line x1="80" y1="600" x2="1520" y2="600" stroke="#E8DFD0" stroke-opacity=".18" stroke-width="1.5"/>
<g class="t" font-size="15" fill="#E8DFD0">
  <text x="80" y="644" font-weight="800" fill="#F4ECDB">A trigger is a row, not a robot.</text>
  <text x="80" y="668">It cannot approve anything. It runs under a team's budget, as a credential the team owns,</text>
  <text x="80" y="690">and every run is a normal session with a normal log.</text>
  <text x="820" y="644" font-weight="800" fill="#F4ECDB">Nothing unattended is trusted by default.</text>
  <text x="820" y="668">Approvals wait for a person or are denied. A profile whose bundle says otherwise</text>
  <text x="820" y="690">is an administrator's versioned decision, not a flag on the trigger.</text>
</g>

<!-- key -->
<rect x="80" y="846" width="14" height="14" fill="#00C6C9"/>
<text class="m" x="104" y="858" font-size="13" fill="#8A8AA0" letter-spacing="2">THE MACHINE WORKING</text>
<rect x="330" y="846" width="14" height="14" fill="#FF0080"/>
<text class="m" x="354" y="858" font-size="13" fill="#8A8AA0" letter-spacing="2">A PERSON MUST DECIDE</text>
<use href="#svc" x="590" y="844" width="18" height="18" color="#A3A3B8"/>
<text class="m" x="618" y="858" font-size="13" fill="#8A8AA0" letter-spacing="2">A SERVICE PRINCIPAL: A CREDENTIAL A TEAM OWNS, NOT A MEMBER</text>
</svg>
