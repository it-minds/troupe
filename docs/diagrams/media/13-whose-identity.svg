<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Whose identity does a session act with? Issue 331</title>
<desc id="desc">Top, the problem: a shared session on a pod with three people attached. AB offers a personal tool whose token stays on AB's laptop. CD asks the agent to use it, EF approves, and the answer lands in a transcript everyone reads. A pasted file can ask for it too. Bottom, three answers for a pod's MCP call: system only, where the call carries the profile; on behalf of the person, where the plane exchanges the person's token; client-hosted, where the call goes back to the person's own machine. A strip of open questions at the foot: what is private, what sharing does, who may trigger and approve, triggers, audit, and what the person sees.</desc>
<style>
