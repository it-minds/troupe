<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Whose name a call carries</title>
<desc id="desc">Two lanes. Top: the bundle's servers are called as the profile, through a client-credentials token the pod signs for in OpenBao transit; the server sees the profile, organisation-wide. Middle: a person's own servers are offered with consent and called back on the person's machine over their own socket; the token never leaves. Crossed out: on behalf of, the plane exchanging a person's token, rejected because the plane would hold personal credentials. Below, four rules: a profile may forbid personal tools, everyone in the session sees the taint, a call whose owner left waits sixty seconds then fails once saying it may have run, and in a shared session anyone with control can steer the agent. Issue 331, closed; decisions 747, 861, 862, 879.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&amp;family=DM+Mono:wght@400;500&amp;family=VT323&amp;display=swap');
.t{font-family:Figtree,'Segoe UI',system-ui,sans-serif}
.m{font-family:'DM Mono',ui-monospace,Menlo,Consolas,monospace}
.s{font-family:VT323,'DM Mono',ui-monospace,monospace}
.tile{fill:#12121C;stroke:#E8DFD0;stroke-opacity:.42;stroke-width:1.5}
.box{fill:#1C1C2B;stroke:#E8DFD0;stroke-opacity:.42;stroke-width:1.5}
</style>
<defs>
  <symbol id="mask" viewBox="0 0 48 48">
    <path d="M9 15 Q9 7 24 7 Q39 7 39 15 L39 25 Q39 35 24 43 Q9 35 9 25 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M15.5 21 Q19 18.4 22.5 21 Q19 23.6 15.5 21 Z" fill="currentColor"/>
    <path d="M25.5 21 Q29 18.4 32.5 21 Q29 23.6 25.5 21 Z" fill="currentColor"/>
  </symbol>
  <symbol id="ab" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor" font-family="Figtree,'Segoe UI',system-ui,sans-serif">AB</text>
  </symbol>
  <symbol id="svc" viewBox="0 0 48 48">
    <rect x="5" y="5" width="38" height="38" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-size="14" font-weight="500" fill="currentColor" font-family="'DM Mono',ui-monospace,Menlo,Consolas,monospace">svc</text>
  </symbol>
  <symbol id="key" viewBox="0 0 48 48">
    <rect x="6" y="18" width="14" height="12" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="20" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="3"/>
    <line x1="34" y1="24" x2="34" y2="31" stroke="currentColor" stroke-width="3"/>
    <line x1="40" y1="24" x2="40" y2="31" stroke="currentColor" stroke-width="3"/>
  </symbol>
  <symbol id="server" viewBox="0 0 48 48">
    <rect x="6" y="8" width="36" height="14" fill="none" stroke="currentColor" stroke-width="3"/>
    <rect x="6" y="26" width="36" height="14" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="13" cy="15" r="2" fill="currentColor"/><circle cx="13" cy="33" r="2" fill="currentColor"/>
  </symbol>
  <symbol id="lock" viewBox="0 0 48 48">
    <path d="M14 22 V15 Q14 6 24 6 Q34 6 34 15 V22" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="8" y="22" width="32" height="22" fill="currentColor"/>
  </symbol>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#A3A3B8"/>
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#00C6C9"/>
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#FFBC56"/>
  </marker>
  <marker id="arrow-cream" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#F4ECDB"/>
  </marker>
</defs>

<rect width="1600" height="900" fill="#0B0B12"/>

<!-- header -->
<text class="s" x="80" y="78" font-size="24" fill="#00DBD3" letter-spacing="4">// WHO IS CALLING · DECIDED</text>
<text class="t" x="80" y="134" font-size="46" font-weight="900" fill="#F4ECDB" letter-spacing="-1.5">Whose name a call carries</text>

<!-- ===== lane 1: the bundle's servers, as the profile ===== -->
<rect x="88" y="188" width="1440" height="150" fill="#000353"/>
<rect class="tile" x="80" y="180" width="1440" height="150"/>
<rect x="80" y="180" width="4" height="150" fill="#00C6C9"/>
<text class="m" x="100" y="206" font-size="11" font-weight="500" fill="#00DBD3" letter-spacing="2.5">THE BUNDLE'S SERVERS · CALLED AS THE PROFILE</text>
<use href="#mask" x="100" y="232" width="48" height="48" color="#00DBD3"/>
<text class="m" x="100" y="304" font-size="9" fill="#7B7B94" letter-spacing="1">A POD SESSION</text>
<line x1="160" y1="256" x2="300" y2="256" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<use href="#lock" x="310" y="236" width="40" height="40" color="#F4ECDB"/>
<text class="m" x="360" y="252" font-size="11" fill="#F4ECDB">OpenBao transit</text>
<text class="m" x="360" y="268" font-size="9" fill="#8A8AA0" letter-spacing="1">SIGNS A CLIENT ASSERTION · THE KEY NEVER LEAVES</text>
<line x1="610" y1="256" x2="720" y2="256" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" x="665" y="246" text-anchor="middle" font-size="9" fill="#8A8AA0" letter-spacing="1">ONE TOKEN PER SERVER</text>
<use href="#svc" x="728" y="236" width="40" height="40" color="#F4ECDB"/>
<text class="m" x="778" y="252" font-size="11" fill="#F4ECDB">the profile's identity</text>
<text class="m" x="778" y="268" font-size="9" fill="#8A8AA0" letter-spacing="1">client_credentials · ITS OWN CERTIFICATE</text>
<line x1="1010" y1="256" x2="1120" y2="256" stroke="#00C6C9" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<use href="#server" x="1128" y="236" width="40" height="40" color="#F4ECDB"/>
<text class="m" x="1178" y="252" font-size="11" fill="#F4ECDB">the team's server</text>
<text class="m" x="1178" y="268" font-size="9" fill="#00DBD3" letter-spacing="1">SEES: caller = system · ORGANISATION-WIDE</text>
<text class="t" x="1178" y="300" font-size="12" fill="#A3A3B8">Who sees what is the grant: which teams may use the profile.</text>
<text class="m" x="100" y="320" font-size="9" fill="#7B7B94" letter-spacing="1">DECISION 747 · spec.mcpIdentities · THE SAME VIEW FOR EVERYONE ON THE PROFILE</text>

<!-- ===== lane 2: your own servers, as you, from your machine ===== -->
<rect x="88" y="366" width="1440" height="170" fill="#000353"/>
<rect class="tile" x="80" y="358" width="1440" height="170"/>
<rect x="80" y="358" width="4" height="170" fill="#FFBC56"/>
<text class="m" x="100" y="384" font-size="11" font-weight="500" fill="#FFBC56" letter-spacing="2.5">YOUR OWN SERVERS · CALLED AS YOU, ON YOUR MACHINE</text>
<use href="#mask" x="100" y="410" width="48" height="48" color="#00DBD3"/>
<text class="m" x="100" y="482" font-size="9" fill="#7B7B94" letter-spacing="1">A POD SESSION</text>
<!-- offer -->
<line x1="640" y1="424" x2="160" y2="424" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" x="400" y="414" text-anchor="middle" font-size="9" fill="#A3A3B8" letter-spacing="1">1 · tools.register · A CONSENT YOU CONFIRM</text>
<!-- invoke back -->
<line x1="160" y1="450" x2="640" y2="450" stroke="#FFBC56" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
<text class="m" x="400" y="466" text-anchor="middle" font-size="10" font-weight="500" fill="#FFBC56" letter-spacing="1.5">2 · tool.invoke · OVER YOUR SOCKET, NO OTHER</text>
<rect class="tile" x="648" y="396" width="330" height="82"/>
<rect x="648" y="396" width="4" height="82" fill="#FFBC56"/>
<use href="#ab" x="668" y="412" width="40" height="40" color="#F4ECDB"/>
<use href="#key" x="716" y="412" width="40" height="40" color="#FFBC56"/>
<text class="t" x="766" y="430" font-size="16" font-weight="800" fill="#F4ECDB">your laptop</text>
<text class="m" x="766" y="448" font-size="9" fill="#FFBC56" letter-spacing="1">THE DAEMON MAKES THE CALL · THE TOKEN NEVER LEAVES</text>
<text class="m" x="668" y="470" font-size="9" fill="#7B7B94" letter-spacing="1">NOTHING OF YOURS STAYS ON THE POD</text>
<line x1="978" y1="437" x2="1120" y2="437" stroke="#F4ECDB" stroke-width="1.5" marker-end="url(#arrow-cream)"/>
<use href="#server" x="1128" y="416" width="40" height="40" color="#F4ECDB"/>
<text class="m" x="1178" y="432" font-size="11" fill="#F4ECDB">a server you signed in to</text>
<text class="m" x="1178" y="448" font-size="9" fill="#FFBC56" letter-spacing="1">SEES: YOU · ONLY WHILE YOU ARE ATTACHED</text>
<text class="t" x="1178" y="480" font-size="12" fill="#A3A3B8">The model sees client.&lt;server&gt;.&lt;tool&gt; beside mcp.*, in one list.</text>
<text class="m" x="100" y="516" font-size="9" fill="#7B7B94" letter-spacing="1">DECISION 861 · PROTOCOL §8 · THE PLANE HOLDS NO GRANT, NO TOKEN AND NO CONSENT OF YOURS</text>

<!-- ===== not this: on behalf of ===== -->
<rect class="tile" x="80" y="556" width="1440" height="56" stroke="#FF7E6E" stroke-opacity="1"/>
<text class="m" x="100" y="580" font-size="11" font-weight="500" fill="#FF7E6E" letter-spacing="2.5">REJECTED · ON BEHALF OF YOU</text>
<use href="#ab" x="400" y="568" width="32" height="32" color="#7B7B94"/>
<line x1="440" y1="584" x2="500" y2="584" stroke="#7B7B94" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" x="510" y="588" font-size="10" fill="#7B7B94">plane exchanges your token (RFC 8693)</text>
<line x1="790" y1="584" x2="850" y2="584" stroke="#7B7B94" stroke-width="1.5" marker-end="url(#arrow)"/>
<use href="#server" x="856" y="568" width="32" height="32" color="#7B7B94"/>
<line x1="390" y1="566" x2="900" y2="602" stroke="#FF7E6E" stroke-width="2.5"/>
<line x1="390" y1="602" x2="900" y2="566" stroke="#FF7E6E" stroke-width="2.5"/>
<text class="t" x="940" y="588" font-size="13" fill="#E8DFD0">The plane would hold a person's token: refresh, revoke, audience. It holds none.</text>

<!-- ===== the rules around it ===== -->
<text class="m" x="80" y="652" font-size="10" fill="#7B7B94" letter-spacing="2">THE RULES AROUND IT</text>
<g>
  <rect class="tile" x="80" y="664" width="340" height="116"/>
  <text class="m" x="100" y="688" font-size="10" font-weight="500" fill="#F4ECDB" letter-spacing="2">A PROFILE MAY FORBID</text>
  <text class="m" x="100" y="710" font-size="11" fill="#00DBD3">personalTools: forbid</text>
  <text class="t" x="100" y="732" font-size="12" fill="#A3A3B8">Refused before any consent is asked.</text>
  <text class="t" x="100" y="750" font-size="12" fill="#A3A3B8">Allowed is the default.</text>
  <text class="m" x="100" y="770" font-size="9" fill="#7B7B94" letter-spacing="1">DECISIONS 862 · 879</text>

  <rect class="tile" x="446" y="664" width="340" height="116"/>
  <text class="m" x="466" y="688" font-size="10" font-weight="500" fill="#F4ECDB" letter-spacing="2">EVERYONE SEES IT</text>
  <rect x="466" y="698" width="110" height="20" fill="none" stroke="#FFBC56" stroke-width="1.5"/>
  <text class="m" x="521" y="712" text-anchor="middle" font-size="8" font-weight="500" fill="#FFBC56" letter-spacing="1">session_tainted</text>
  <text class="t" x="466" y="740" font-size="12" fill="#A3A3B8">Durable, in every participant's view,</text>
  <text class="t" x="466" y="758" font-size="12" fill="#A3A3B8">and it stays after your tools have gone.</text>

  <rect class="tile" x="812" y="664" width="340" height="116"/>
  <text class="m" x="832" y="688" font-size="10" font-weight="500" fill="#F4ECDB" letter-spacing="2">IF YOU LEAVE MID-CALL</text>
  <text class="t" x="832" y="712" font-size="12" fill="#A3A3B8">The call waits 60 s for you to come back,</text>
  <text class="t" x="832" y="730" font-size="12" fill="#A3A3B8">same call_id. Then it fails once, and the</text>
  <text class="t" x="832" y="748" font-size="12" fill="#A3A3B8">model is told it may already have run.</text>
  <text class="m" x="832" y="770" font-size="9" fill="#7B7B94" letter-spacing="1">DECISION 861 · A LEAVE IS A DROP</text>

  <rect class="tile" x="1178" y="664" width="342" height="116"/>
  <rect x="1178" y="664" width="4" height="116" fill="#FF0080"/>
  <text class="m" x="1198" y="688" font-size="10" font-weight="500" fill="#FF0080" letter-spacing="2">IN A SHARED SESSION</text>
  <text class="t" x="1198" y="712" font-size="12" fill="#A3A3B8">Anyone with control steers the agent, and</text>
  <text class="t" x="1198" y="730" font-size="12" fill="#A3A3B8">may answer an approval. Offering your tools</text>
  <text class="t" x="1198" y="748" font-size="12" fill="#A3A3B8">there is your choice, per attachment.</text>
  <text class="m" x="1198" y="770" font-size="9" fill="#7B7B94" letter-spacing="1">THE TAINT AND THE APPROVAL ARE THE GUARD</text>
</g>

<!-- footer -->
<text class="m" x="80" y="846" font-size="11" fill="#7B7B94" letter-spacing="2">ISSUE 331 · CLOSED 2026-10-12 · DECISIONS 747 · 861 · 862 · 879</text>
<rect x="1180" y="836" width="14" height="14" fill="#00C6C9"/>
<text class="m" x="1204" y="848" font-size="11" fill="#8A8AA0" letter-spacing="2">AS THE PROFILE</text>
<rect x="1360" y="836" width="14" height="14" fill="#FFBC56"/>
<text class="m" x="1384" y="848" font-size="11" fill="#8A8AA0" letter-spacing="2">AS YOU, AT HOME</text>
</svg>
