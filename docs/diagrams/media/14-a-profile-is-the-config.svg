  <text class="m" x="1090" y="312" font-size="8" fill="#7B7B94" letter-spacing=".5">model: its own</text>
  <text class="m" x="1090" y="324" font-size="8" fill="#7B7B94" letter-spacing=".5">approvals: its own</text>
  <text class="m" x="1090" y="336" font-size="8" fill="#7B7B94" letter-spacing=".5">tools: its own</text>

  <rect class="faint" x="1225" y="256" width="130" height="92"/>
  <use href="#laptop" x="1235" y="262" width="32" height="32" color="#A3A3B8"/>
  <text class="m" x="1273" y="282" font-size="9" fill="#A3A3B8">opencode.json</text>
  <text class="m" x="1235" y="312" font-size="8" fill="#7B7B94" letter-spacing=".5">model: another</text>
  <text class="m" x="1235" y="324" font-size="8" fill="#7B7B94" letter-spacing=".5">approvals: off</text>
  <text class="m" x="1235" y="336" font-size="8" fill="#7B7B94" letter-spacing=".5">tools: a few more</text>

  <rect class="faint" x="1370" y="256" width="130" height="92"/>
  <use href="#laptop" x="1380" y="262" width="32" height="32" color="#A3A3B8"/>
  <text class="m" x="1418" y="282" font-size="9" fill="#A3A3B8">.claude/</text>
  <text class="m" x="1380" y="312" font-size="8" fill="#7B7B94" letter-spacing=".5">model: ?</text>
  <text class="m" x="1380" y="324" font-size="8" fill="#7B7B94" letter-spacing=".5">approvals: ?</text>
  <text class="m" x="1380" y="336" font-size="8" fill="#7B7B94" letter-spacing=".5">last edited: ?</text>
</g>

<!-- the side door -->
<rect class="faint" x="1140" y="392" width="300" height="44"/>
<text class="m" x="1290" y="410" text-anchor="middle" font-size="9" fill="#A3A3B8" letter-spacing="1.5">SHARED CAPABILITIES · AN MCP SIDE-DOOR</text>
<text class="m" x="1290" y="426" text-anchor="middle" font-size="8" fill="#7B7B94" letter-spacing=".5">skills reused · settings stay the laptop's</text>
<line x1="1145" y1="392" x2="1145" y2="348" stroke="#A3A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="1290" y1="392" x2="1290" y2="348" stroke="#A3A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="1435" y1="392" x2="1435" y2="348" stroke="#A3A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<g class="t" font-size="12">
  <text x="1080" y="470" fill="#00DBD3">+ works with the agent you already have</text>
  <text x="1080" y="496" fill="#FF7E6E">− every machine decides its own model, approvals and tools</text>
  <text x="1080" y="518" fill="#FF7E6E">− nothing pins a run to a version of anything</text>
  <text x="1080" y="540" fill="#FF7E6E">− a ceiling is advice the laptop can edit out</text>
  <text x="1080" y="562" fill="#FF7E6E">− "what did it run with?" means asking the laptop</text>
</g>

<!-- ===== what you get ===== -->
<g class="m" font-size="10" font-weight="500" letter-spacing="1.5">
  <rect x="80" y="630" width="220" height="32" fill="none" stroke="#008687" stroke-width="1.5"/>
  <text x="190" y="650" text-anchor="middle" fill="#00DBD3">ONE TRUTH PER TEAM</text>
  <rect x="316" y="630" width="260" height="32" fill="none" stroke="#008687" stroke-width="1.5"/>
  <text x="446" y="650" text-anchor="middle" fill="#00DBD3">VERSIONED · HASHED · PINNED</text>
  <rect x="592" y="630" width="250" height="32" fill="none" stroke="#008687" stroke-width="1.5"/>
  <text x="717" y="650" text-anchor="middle" fill="#00DBD3">CEILINGS HOLD AT THE POD</text>
  <rect x="858" y="630" width="290" height="32" fill="none" stroke="#008687" stroke-width="1.5"/>
  <text x="1003" y="650" text-anchor="middle" fill="#00DBD3">EVERY RUN SAYS WHICH VERSION</text>
  <rect x="1164" y="630" width="356" height="32" fill="none" stroke="#A37734" stroke-width="1.5"/>
  <text x="1342" y="650" text-anchor="middle" fill="#FFBC56">YOUR LAPTOP STILL GETS ITS OWN LAYERS</text>
</g>

<!-- the point -->
<line x1="80" y1="710" x2="1520" y2="710" stroke="#E8DFD0" stroke-opacity=".18" stroke-width="1.5"/>
<text class="t" x="80" y="756" font-size="22" font-weight="800" fill="#F4ECDB">Configuration is a fact about the session, not about whose laptop it ran on.</text>
<text class="t" x="80" y="786" font-size="15" fill="#A3A3B8">The team publishes a version. The pod enforces it. The session records it. You still layer your own on top at home,</text>
<text class="t" x="80" y="808" font-size="15" fill="#A3A3B8">and a repository's risky keys wait until you say you trust it.</text>
</svg>
