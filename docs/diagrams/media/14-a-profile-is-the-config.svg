  <text x="420" y="404" fill="#8A8AA0" letter-spacing="1.5">EGRESS</text><text x="520" y="404" fill="#E8DFD0">3 hosts</text>
</g>
<line x1="420" y1="420" x2="700" y2="420" stroke="#E8DFD0" stroke-opacity=".18" stroke-width="1.5"/>
<g class="m" font-size="9" font-weight="500" letter-spacing="1">
  <rect x="420" y="432" width="34" height="20" fill="none" stroke="#E8DFD0" stroke-opacity=".18" stroke-width="1.5"/><text x="437" y="446" text-anchor="middle" fill="#7B7B94">v1</text>
  <rect x="460" y="432" width="34" height="20" fill="none" stroke="#E8DFD0" stroke-opacity=".18" stroke-width="1.5"/><text x="477" y="446" text-anchor="middle" fill="#7B7B94">v2</text>
  <rect x="500" y="432" width="34" height="20" fill="#00C6C9"/><text x="517" y="446" text-anchor="middle" fill="#0B0B12">v3</text>
</g>
<text class="m" x="546" y="446" font-size="9" fill="#8A8AA0" letter-spacing="1">APPEND-ONLY · ROLLBACK = v4</text>
<text class="t" x="420" y="466" font-size="11" fill="#A3A3B8">The bundle is one hashed, immutable document per version.</text>

<!-- ===== local layers ===== -->
<rect class="tile" x="400" y="492" width="320" height="108"/>
<text class="m" x="416" y="512" font-size="9" fill="#7B7B94" letter-spacing="2">ON A LAPTOP: THE SAME, UNDER YOUR LAYERS</text>
<g class="m" font-size="8" letter-spacing=".5">
  <rect class="box" x="416" y="522" width="52" height="20"/><text x="442" y="536" text-anchor="middle" fill="#A3A3B8">built-in</text>
  <rect class="box" x="472" y="522" width="48" height="20"/><text x="496" y="536" text-anchor="middle" fill="#00DBD3">bundle</text>
  <rect class="box" x="524" y="522" width="40" height="20"/><text x="544" y="536" text-anchor="middle" fill="#FFBC56">you</text>
  <rect class="box" x="568" y="522" width="40" height="20"/><text x="588" y="536" text-anchor="middle" fill="#A3A3B8">repo</text>
  <rect class="box" x="612" y="522" width="40" height="20"/><text x="632" y="536" text-anchor="middle" fill="#A3A3B8">.local</text>
  <rect class="box" x="656" y="522" width="26" height="20"/><text x="669" y="536" text-anchor="middle" fill="#A3A3B8">env</text>
  <rect class="box" x="686" y="522" width="22" height="20"/><text x="697" y="536" text-anchor="middle" fill="#A3A3B8">cli</text>
</g>
<text class="m" x="416" y="560" font-size="9" fill="#8A8AA0" letter-spacing="1">LATER WINS · MAPS MERGE BY KEY</text>
<text class="m" x="416" y="574" font-size="9" fill="#8A8AA0" letter-spacing="1">null REMOVES · A LIST REPLACES</text>
<text class="m" x="416" y="590" font-size="9" fill="#7B7B94" letter-spacing="1">config show: every value and its file</text>

<!-- ===== where it lands ===== -->
<line x1="720" y1="300" x2="780" y2="300" stroke="#00C6C9" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<line x1="720" y1="420" x2="780" y2="420" stroke="#00C6C9" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

<rect x="788" y="254" width="232" height="100" fill="#000353"/>
<rect class="tile" x="780" y="246" width="232" height="100"/>
<text class="m" x="796" y="268" font-size="9" font-weight="500" fill="#00DBD3" letter-spacing="2">THE POD ENFORCES IT</text>
<use href="#mask" x="796" y="280" width="30" height="30" color="#00DBD3"/>
<text class="t" x="836" y="292" font-size="11" fill="#E8DFD0">NetworkPolicy from egress</text>
<text class="t" x="836" y="308" font-size="11" fill="#E8DFD0">secrets injected, never in the doc</text>
<text class="t" x="836" y="324" font-size="11" fill="#E8DFD0">tool allowlist at discovery</text>
<text class="t" x="836" y="340" font-size="11" fill="#E8DFD0">bundle hash verified before use</text>

<rect x="788" y="374" width="232" height="100" fill="#000353"/>
<rect class="tile" x="780" y="366" width="232" height="100"/>
<text class="m" x="796" y="388" font-size="9" font-weight="500" fill="#00DBD3" letter-spacing="2">THE SESSION REMEMBERS IT</text>
<text class="m" x="796" y="410" font-size="10" fill="#F4ECDB">session 42 · bundle v3 · 9f2c…</text>
<text class="t" x="796" y="430" font-size="11" fill="#A3A3B8">A new version is for new sessions.</text>
<text class="t" x="796" y="446" font-size="11" fill="#A3A3B8">Retire v3 and it moves at its next</text>
<text class="t" x="796" y="462" font-size="11" fill="#A3A3B8">wake, with a config_upgraded event.</text>

<text class="m" x="780" y="512" font-size="9" fill="#7B7B94" letter-spacing="1">A GRANT MAY NARROW IT: ENTITLEMENTS</text>
<text class="m" x="780" y="526" font-size="9" fill="#7B7B94" letter-spacing="1">which agents, skills, servers</text>
<text class="m" x="780" y="552" font-size="9" fill="#7B7B94" letter-spacing="1">GITOPS OPTIONAL · PROFILE AS A COMMIT</text>
<text class="m" x="780" y="566" font-size="9" fill="#7B7B94" letter-spacing="1">pending until the resource catches up</text>

<!-- ===== the usual way ===== -->
<rect class="faint" x="1060" y="196" width="460" height="386"/>
<text class="m" x="1080" y="220" font-size="10" fill="#8A8AA0" letter-spacing="2">THE USUAL WAY · CONFIG ON EVERY LAPTOP</text>
<text class="m" x="1080" y="236" font-size="9" fill="#7B7B94" letter-spacing="1">OpenWork over opencode.json · .claude/ · .cursor/ …</text>

<g>
