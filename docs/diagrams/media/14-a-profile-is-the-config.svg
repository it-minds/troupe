<!-- ===== the ceiling ===== -->
<rect x="400" y="196" width="320" height="38" fill="none" stroke="#FF7E6E" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="m" x="416" y="219" font-size="10" font-weight="500" fill="#FF7E6E" letter-spacing="2">CEILING · NOTHING BELOW MAY EXCEED IT</text>

<!-- ===== the profile ===== -->
<rect x="408" y="254" width="320" height="226" fill="#000353"/>
<rect class="tile" x="400" y="246" width="320" height="226"/>
<rect x="400" y="246" width="4" height="226" fill="#00C6C9"/>
<text class="m" x="420" y="270" font-size="10" font-weight="500" fill="#00DBD3" letter-spacing="2">PROFILE · build</text>
<g class="m" font-size="11">
  <text x="420" y="300" fill="#8A8AA0" letter-spacing="1.5">IMAGE</text><text x="520" y="300" fill="#E8DFD0">release</text>
  <text x="420" y="326" fill="#8A8AA0" letter-spacing="1.5">MODEL</text><text x="520" y="326" fill="#E8DFD0">gateway/glm-5.2</text>
