<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A profile is the configuration</title>
<desc id="desc">Left: four authors, a cluster admin, a team admin, the repository and you, each write their own layer. The cluster admin's TroupePolicy is a ceiling. The team admin's profile carries image, model, a versioned hashed bundle, storage and egress. The repository and your own files are local layers that merge by key, with risky keys counting only once a workspace is trusted. The profile lands in two places: the pod enforces it, and the session remembers which version it ran. Right, the usual way: configuration on every laptop, with capabilities shared through an MCP side-door, so each machine still decides its own model, approvals and tools, and no run is pinned to a version.</desc>
