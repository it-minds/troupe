<text class="t" x="96" y="418" font-size="16" font-weight="800" fill="#F4ECDB">.troupe/</text>
<text class="m" x="96" y="436" font-size="9" fill="#8A8AA0" letter-spacing="1">CONFIG · AGENTS · SKILLS · AGENTS.md</text>
<use href="#lock" x="298" y="394" width="20" height="20" color="#FFBC56"/>

<rect class="tile" x="80" y="466" width="250" height="70"/>
<rect x="80" y="466" width="4" height="70" fill="#FFBC56"/>
<text class="m" x="96" y="486" font-size="9" font-weight="500" fill="#FFBC56" letter-spacing="2">YOU</text>
<text class="t" x="96" y="508" font-size="16" font-weight="800" fill="#F4ECDB">~/.config/troupe</text>
<text class="m" x="96" y="526" font-size="9" fill="#8A8AA0" letter-spacing="1">CONFIG · MCP · SKILLS · COMMANDS</text>

<text class="m" x="80" y="562" font-size="9" fill="#FFBC56" letter-spacing="1">LOCK: A REPO'S RISKY KEYS COUNT</text>
<text class="m" x="80" y="576" font-size="9" fill="#FFBC56" letter-spacing="1">ONLY ONCE YOU TRUST IT</text>
<text class="m" x="80" y="592" font-size="9" fill="#7B7B94" letter-spacing="1">approvals · endpoints · keys · mcp · paths</text>

