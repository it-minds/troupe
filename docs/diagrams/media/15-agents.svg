<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Agents: a markdown file, where it lives, how it runs</title>
<desc id="desc">Left: an agent is one markdown file, YAML frontmatter then prose: description, mode primary or subagent, model as a role, tools, permissions, budget share, skills. Middle: four layers searched lowest to highest, built-ins, the profile's bundle, your config directory, the workspace's .troupe folder; a higher file with the same name replaces the lower; a bundle replaces a built-in only with override true; entitlements filter after the merge. Right: one root agent per session, named at session.create, delegating to subagents with a budget share, and a branch as a session of its own. On the plane the pod reads the agent from the pinned bundle version; a trigger names principal, profile and agent and makes the same call as a service principal.</desc>
