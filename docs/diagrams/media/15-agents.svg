<use href="#mask" x="1250" y="212" width="44" height="44" color="#00DBD3"/>
<text class="m" x="1302" y="232" font-size="11" fill="#F4ECDB">root · reviewer</text>
<text class="m" x="1302" y="248" font-size="9" fill="#7B7B94" letter-spacing="1">THE ONE THAT TALKS TO YOU</text>
<line x1="1272" y1="256" x2="1272" y2="300" stroke="#A3A3B8" stroke-width="1.5"/>
<line x1="1272" y1="300" x2="1250" y2="300" stroke="#A3A3B8" stroke-width="1.5"/>
<line x1="1272" y1="300" x2="1380" y2="300" stroke="#A3A3B8" stroke-width="1.5"/>
