<line x1="1380" y1="300" x2="1380" y2="318" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<use href="#mask" x="1218" y="322" width="32" height="32" color="#00DBD3"/>
<text class="m" x="1256" y="336" font-size="10" fill="#E8DFD0">explore</text>
<text class="m" x="1256" y="350" font-size="8" fill="#7B7B94" letter-spacing=".5">reads · share 0.4</text>
<use href="#mask" x="1348" y="322" width="32" height="32" color="#00DBD3"/>
<text class="m" x="1386" y="336" font-size="10" fill="#E8DFD0">general</text>
<text class="m" x="1386" y="350" font-size="8" fill="#7B7B94" letter-spacing=".5">edits · share 0.4</text>
<text class="m" x="1008" y="376" font-size="9" fill="#7B7B94" letter-spacing="1">delegate · max_depth 3 · a child stops once it reports</text>
<!-- a branch -->
<use href="#mask" x="1470" y="212" width="32" height="32" color="#A3A3B8"/>
<text class="m" x="1486" y="262" text-anchor="middle" font-size="8" fill="#7B7B94" letter-spacing=".5">/plan …</text>
<text class="m" x="1486" y="274" text-anchor="middle" font-size="8" fill="#7B7B94" letter-spacing=".5">a branch:</text>
<text class="m" x="1486" y="286" text-anchor="middle" font-size="8" fill="#7B7B94" letter-spacing=".5">own session,</text>
<text class="m" x="1486" y="298" text-anchor="middle" font-size="8" fill="#7B7B94" letter-spacing=".5">a parent</text>

<!-- ===== on the plane, and from a trigger ===== -->
<text class="m" x="990" y="420" font-size="10" fill="#7B7B94" letter-spacing="2">ON THE PLANE · THE SAME CALL, TWO CALLERS</text>
<rect class="tile" x="990" y="432" width="530" height="190"/>

<use href="#person" x="1008" y="452" width="34" height="34" color="#F4ECDB"/>
<text class="m" x="1016" y="508" font-size="8" fill="#7B7B94" letter-spacing=".5">a person</text>
<use href="#clock" x="1008" y="530" width="34" height="34" color="#F4ECDB"/>
<use href="#svc" x="1048" y="530" width="34" height="34" color="#F4ECDB"/>
<text class="m" x="1016" y="586" font-size="8" fill="#7B7B94" letter-spacing=".5">a trigger · svc</text>

<line x1="1050" y1="469" x2="1130" y2="500" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1090" y1="547" x2="1130" y2="520" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="box" x="1134" y="480" width="150" height="56"/>
<text class="m" x="1148" y="500" font-size="10" fill="#F4ECDB">session.create</text>
<text class="m" x="1148" y="516" font-size="9" fill="#00DBD3">profile: standard</text>
<text class="m" x="1148" y="530" font-size="9" fill="#00DBD3">agent: reviewer</text>

<line x1="1284" y1="508" x2="1330" y2="508" stroke="#00C6C9" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

<rect class="box" x="1334" y="462" width="170" height="92"/>
<text class="m" x="1348" y="482" font-size="9" fill="#8A8AA0" letter-spacing="1.5">A POD · BUNDLE v3</text>
<use href="#mask" x="1348" y="492" width="30" height="30" color="#00DBD3"/>
<text class="m" x="1386" y="506" font-size="9" fill="#F4ECDB">bundles/9f2c…/</text>
<text class="m" x="1386" y="520" font-size="9" fill="#F4ECDB">agents/reviewer.md</text>
<text class="m" x="1348" y="544" font-size="8" fill="#7B7B94" letter-spacing=".5">pinned to its version</text>

<text class="m" x="1120" y="572" font-size="9" fill="#7B7B94" letter-spacing="1">TRIGGER: principal · profile · agent · cron · terms</text>
<text class="m" x="1120" y="588" font-size="9" fill="#FF0080" letter-spacing="1">approvals: wait | deny · review: required · never auto</text>
<text class="m" x="1120" y="604" font-size="9" fill="#7B7B94" letter-spacing="1">A PERSON'S GRANT AND A TRIGGER'S TERMS BOTH APPLY. SAME LOG.</text>

<!-- ===== legend of keys ===== -->
<line x1="80" y1="660" x2="1520" y2="660" stroke="#E8DFD0" stroke-opacity=".18" stroke-width="1.5"/>
<g class="m" font-size="10" letter-spacing="1.5">
  <text x="80" y="690" fill="#00DBD3" font-weight="500">mode</text><text x="80" y="706" fill="#8A8AA0">primary: may be a root</text><text x="80" y="720" fill="#8A8AA0">subagent: only delegated to</text>
  <text x="340" y="690" fill="#00DBD3" font-weight="500">model</text><text x="340" y="706" fill="#8A8AA0">cheap · default · expensive</text><text x="340" y="720" fill="#8A8AA0">the profile maps roles to ids</text>
  <text x="600" y="690" fill="#00DBD3" font-weight="500">tools · permissions</text><text x="600" y="706" fill="#8A8AA0">an allowlist, and deny / ask / auto per tool</text><text x="600" y="720" fill="#8A8AA0">a definition may only tighten a server's rule</text>
  <text x="960" y="690" fill="#00DBD3" font-weight="500">budget_share</text><text x="960" y="706" fill="#8A8AA0">a child's slice of the parent's</text><text x="960" y="720" fill="#8A8AA0">tokens and time left</text>
  <text x="1240" y="690" fill="#00DBD3" font-weight="500">skills</text><text x="1240" y="706" fill="#8A8AA0">only ones the bundle has</text><text x="1240" y="720" fill="#8A8AA0">disclosed one line at a time</text>
</g>

<!-- the point -->
<text class="t" x="80" y="790" font-size="22" font-weight="800" fill="#F4ECDB">The cast is files. The team publishes a version of it; a session is pinned to one; a trigger names one by name.</text>
<text class="t" x="80" y="820" font-size="15" fill="#A3A3B8">Whoever starts the session, a person or a schedule, the same agent file runs under the same log and the same approvals.</text>
</svg>
