<rect width="1600" height="900" fill="#0B0B12"/>

<!-- header -->
<text class="s" x="80" y="78" font-size="24" fill="#00DBD3" letter-spacing="4">// WHO PLAYS WHOM</text>
<text class="t" x="80" y="134" font-size="46" font-weight="900" fill="#F4ECDB" letter-spacing="-1.5">An agent is a markdown file</text>

<!-- ===== the file ===== -->
<text class="m" x="80" y="184" font-size="10" fill="#7B7B94" letter-spacing="2">ONE FILE · reviewer.md</text>
<rect x="88" y="204" width="400" height="356" fill="#000353"/>
<rect class="tile" x="80" y="196" width="400" height="356"/>
<g class="m" font-size="11">
  <text x="100" y="222" fill="#7B7B94">---</text>
  <text x="100" y="242" fill="#8A8AA0">description:</text><text x="204" y="242" fill="#E8DFD0">Reviews a change before it merges.</text>
  <text x="100" y="262" fill="#8A8AA0">mode:</text><text x="204" y="262" fill="#00DBD3">primary</text><text x="276" y="262" fill="#7B7B94"># or subagent</text>
  <text x="100" y="282" fill="#8A8AA0">model:</text><text x="204" y="282" fill="#00DBD3">expensive</text><text x="290" y="282" fill="#7B7B94"># a role, not an id</text>
  <text x="100" y="302" fill="#8A8AA0">tools:</text><text x="204" y="302" fill="#E8DFD0">[read_file, grep, shell]</text>
  <text x="100" y="322" fill="#8A8AA0">permissions:</text>
  <text x="120" y="340" fill="#8A8AA0">write_file:</text><text x="220" y="340" fill="#FF7E6E">deny</text>
  <text x="120" y="358" fill="#8A8AA0">shell:</text><text x="220" y="358" fill="#FF0080">ask</text>
  <text x="100" y="378" fill="#8A8AA0">budget_share:</text><text x="204" y="378" fill="#E8DFD0">0.5</text><text x="240" y="378" fill="#7B7B94"># of what the parent has left</text>
  <text x="100" y="398" fill="#8A8AA0">skills:</text><text x="204" y="398" fill="#E8DFD0">[review-checklist]</text>
  <text x="100" y="418" fill="#7B7B94">---</text>
</g>
<g class="t" font-size="13" fill="#E8DFD0">
  <text x="100" y="448">You review pull requests for this team.</text>
  <text x="100" y="468">Read the diff, run the tests, say what</text>
  <text x="100" y="488">would break. Never edit.</text>
</g>
<text class="m" x="100" y="532" font-size="10" fill="#8A8AA0" letter-spacing="1.5">FRONTMATTER = THE CONTRACT · PROSE = THE ROLE</text>
<text class="t" x="80" y="590" font-size="14" fill="#A3A3B8">No code, no plugin. A role, written down, in the repo</text>
<text class="t" x="80" y="610" font-size="14" fill="#A3A3B8">next to the code it works on. The model picks it like a tool.</text>

<!-- ===== where it lives: the search order ===== -->
<text class="m" x="540" y="184" font-size="10" fill="#7B7B94" letter-spacing="2">WHERE IT LIVES · LOWEST TO HIGHEST</text>

<rect class="tile" x="540" y="196" width="380" height="76"/>
<rect x="540" y="196" width="4" height="76" fill="#A3A3B8"/>
<text class="m" x="560" y="218" font-size="10" font-weight="500" fill="#A3A3B8" letter-spacing="2">4 · THE WORKSPACE</text>
<text class="m" x="560" y="240" font-size="12" fill="#F4ECDB">&lt;workspace&gt;/.troupe/agents/*.md</text>
<text class="t" x="560" y="260" font-size="11" fill="#8A8AA0">this repository's own cast</text>

<rect class="tile" x="540" y="282" width="380" height="76"/>
<rect x="540" y="282" width="4" height="76" fill="#FFBC56"/>
<text class="m" x="560" y="304" font-size="10" font-weight="500" fill="#FFBC56" letter-spacing="2">3 · YOU</text>
<text class="m" x="560" y="326" font-size="12" fill="#F4ECDB">~/.config/troupe/agents/*.md</text>
<text class="t" x="560" y="346" font-size="11" fill="#8A8AA0">yours, on every workspace of this machine</text>

<rect class="tile" x="540" y="368" width="380" height="76"/>
<rect x="540" y="368" width="4" height="76" fill="#00C6C9"/>
<text class="m" x="560" y="390" font-size="10" font-weight="500" fill="#00DBD3" letter-spacing="2">2 · THE PROFILE'S BUNDLE</text>
<text class="m" x="560" y="412" font-size="12" fill="#F4ECDB">bundles/&lt;hash&gt;/agents/*.md</text>
<text class="t" x="560" y="432" font-size="11" fill="#8A8AA0">the team's, versioned; what a pod has</text>

<rect class="tile" x="540" y="454" width="380" height="98"/>
<text class="m" x="560" y="476" font-size="10" font-weight="500" fill="#8A8AA0" letter-spacing="2">1 · BUILT IN</text>
<g color="#7B7B94">
  <use href="#mask" x="560" y="486" width="22" height="22"/><use href="#mask" x="586" y="486" width="22" height="22"/><use href="#mask" x="612" y="486" width="22" height="22"/><use href="#mask" x="638" y="486" width="22" height="22"/><use href="#mask" x="664" y="486" width="22" height="22"/><use href="#mask" x="690" y="486" width="22" height="22"/><use href="#mask" x="716" y="486" width="22" height="22"/><use href="#mask" x="742" y="486" width="22" height="22"/><use href="#mask" x="768" y="486" width="22" height="22"/><use href="#mask" x="794" y="486" width="22" height="22"/><use href="#mask" x="820" y="486" width="22" height="22"/>
</g>
<text class="m" x="560" y="524" font-size="9" fill="#8A8AA0" letter-spacing=".5">build · plan · explore · general · reviewer · librarian</text>
<text class="m" x="560" y="540" font-size="9" fill="#8A8AA0" letter-spacing=".5">implementer · quick · ask · answer · workflow</text>

<!-- the arrow up -->
<line x1="936" y1="540" x2="936" y2="210" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" transform="translate(950 375) rotate(-90)" text-anchor="middle" font-size="9" fill="#8A8AA0" letter-spacing="2">SAME NAME · HIGHER WINS</text>

<text class="m" x="540" y="580" font-size="9" fill="#7B7B94" letter-spacing="1">A BUNDLE REPLACES A BUILT-IN ONLY WITH override: true</text>
<text class="m" x="540" y="596" font-size="9" fill="#7B7B94" letter-spacing="1">ENTITLEMENTS FILTER AFTER THE MERGE: A TEAM GETS ITS SHARE</text>
<text class="m" x="540" y="612" font-size="9" fill="#7B7B94" letter-spacing="1">SKILLS: ONE LINE EACH IN THE PROMPT, THE BODY ON DEMAND</text>

<!-- ===== how it runs ===== -->
<text class="m" x="990" y="184" font-size="10" fill="#7B7B94" letter-spacing="2">HOW IT RUNS · ONE ROOT PER SESSION</text>
<rect class="tile" x="990" y="196" width="530" height="190"/>
<use href="#person" x="1008" y="222" width="40" height="40" color="#F4ECDB"/>
<text class="m" x="1058" y="236" font-size="10" fill="#8A8AA0">troupe --agent reviewer</text>
<text class="m" x="1058" y="252" font-size="10" fill="#8A8AA0">or the launcher's pick</text>
<line x1="1058" y1="268" x2="1200" y2="268" stroke="#A3A3B8" stroke-width="1" stroke-dasharray="2 3"/>
<text class="m" x="1058" y="284" font-size="9" fill="#7B7B94" letter-spacing="1">default: build · plan for a proposal first</text>

