<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MCP tools: your tools follow you to the pod</title>
<desc id="desc">Top: MCP in one breath. An agent talks to a server over JSON-RPC: initialize, tools/list to learn what exists, tools/call to run one. Main scene: your laptop with a client, the daemon and your own MCP servers whose tokens stay there; a pod session whose tool list holds built-ins, the bundle's servers and your client-hosted tools side by side; the team's servers on the pod's side. Numbered flow: attach, offer with a consent round trip, the model discovers one list, and a call to your tool goes back over your own connection as tool.invoke and returns a result that is logged like any other. Rules: only the registering connection is asked, a disconnect takes the tools away, a call in flight waits sixty seconds, same allowlists and approvals, and the session is visibly tainted.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&amp;family=DM+Mono:wght@400;500&amp;family=VT323&amp;display=swap');
.t{font-family:Figtree,'Segoe UI',system-ui,sans-serif}
.m{font-family:'DM Mono',ui-monospace,Menlo,Consolas,monospace}
.s{font-family:VT323,'DM Mono',ui-monospace,monospace}
.tile{fill:#12121C;stroke:#E8DFD0;stroke-opacity:.42;stroke-width:1.5}
.box{fill:#1C1C2B;stroke:#E8DFD0;stroke-opacity:.42;stroke-width:1.5}
</style>
<defs>
  <symbol id="mask" viewBox="0 0 48 48">
    <path d="M9 15 Q9 7 24 7 Q39 7 39 15 L39 25 Q39 35 24 43 Q9 35 9 25 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M15.5 21 Q19 18.4 22.5 21 Q19 23.6 15.5 21 Z" fill="currentColor"/>
    <path d="M25.5 21 Q29 18.4 32.5 21 Q29 23.6 25.5 21 Z" fill="currentColor"/>
  </symbol>
  <symbol id="person" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor" font-family="Figtree,'Segoe UI',system-ui,sans-serif">AB</text>
  </symbol>
  <symbol id="server" viewBox="0 0 48 48">
    <rect x="6" y="8" width="36" height="14" fill="none" stroke="currentColor" stroke-width="3"/>
    <rect x="6" y="26" width="36" height="14" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="13" cy="15" r="2" fill="currentColor"/><circle cx="13" cy="33" r="2" fill="currentColor"/>
  </symbol>
  <symbol id="key" viewBox="0 0 48 48">
    <rect x="6" y="18" width="14" height="12" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="20" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="3"/>
    <line x1="34" y1="24" x2="34" y2="31" stroke="currentColor" stroke-width="3"/>
    <line x1="40" y1="24" x2="40" y2="31" stroke="currentColor" stroke-width="3"/>
  </symbol>
  <symbol id="plug" viewBox="0 0 48 48">
    <rect x="14" y="18" width="20" height="16" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="20" y1="18" x2="20" y2="8" stroke="currentColor" stroke-width="3"/>
    <line x1="28" y1="18" x2="28" y2="8" stroke="currentColor" stroke-width="3"/>
    <line x1="24" y1="34" x2="24" y2="42" stroke="currentColor" stroke-width="3"/>
  </symbol>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#A3A3B8"/>
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#00C6C9"/>
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#FFBC56"/>
  </marker>
  <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#FF0080"/>
  </marker>
