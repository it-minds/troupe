<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Code stays home. Only the name travels.</title>
<desc id="desc">Five stages. Implemented: a tool is a function that lives in the harness or on your laptop and never moves. Described: each tool is described once as a name and a schema, and that description is all that leaves. Permitted: the agent file picks which descriptions the model gets and marks which must ask. Chosen: the model reads the menu and orders by name; it holds no code and runs nothing. Checked, then run: the name comes back to the harness, the rules are checked where the code is, a person says yes where needed, and only then does the function run. A profile's deny stops it whatever the model wanted.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&amp;family=DM+Mono:wght@400;500&amp;family=VT323&amp;display=swap');
.t{font-family:Figtree,'Segoe UI',system-ui,sans-serif}
.m{font-family:'DM Mono',ui-monospace,Menlo,Consolas,monospace}
.s{font-family:VT323,'DM Mono',ui-monospace,monospace}
.tile{fill:#12121C;stroke:#E8DFD0;stroke-opacity:.42;stroke-width:1.5}
.box{fill:#1C1C2B;stroke:#E8DFD0;stroke-opacity:.42;stroke-width:1.5}
</style>
<defs>
  <symbol id="mask" viewBox="0 0 48 48">
    <path d="M9 15 Q9 7 24 7 Q39 7 39 15 L39 25 Q39 35 24 43 Q9 35 9 25 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M15.5 21 Q19 18.4 22.5 21 Q19 23.6 15.5 21 Z" fill="currentColor"/>
    <path d="M25.5 21 Q29 18.4 32.5 21 Q29 23.6 25.5 21 Z" fill="currentColor"/>
  </symbol>
  <symbol id="ab" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor" font-family="Figtree,'Segoe UI',system-ui,sans-serif">AB</text>
  </symbol>
  <symbol id="lock" viewBox="0 0 48 48">
    <path d="M14 22 V15 Q14 6 24 6 Q34 6 34 15 V22" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="8" y="22" width="32" height="22" fill="currentColor"/>
  </symbol>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#A3A3B8"/>
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#00C6C9"/>
  </marker>
</defs>

<rect width="1600" height="900" fill="#0B0B12"/>

<!-- header -->
<text class="s" x="80" y="78" font-size="24" fill="#00DBD3" letter-spacing="4">// WHERE A TOOL LIVES, AND WHAT TRAVELS</text>
<text class="t" x="80" y="134" font-size="46" font-weight="900" fill="#F4ECDB" letter-spacing="-1.5">Code stays home. Only the name travels.</text>

<!-- ===== 1 · implemented ===== -->
<text class="m" x="80" y="196" font-size="11" font-weight="500" fill="#8A8AA0" letter-spacing="3">1 · IMPLEMENTED</text>
<rect x="88" y="216" width="300" height="200" fill="#000353"/>
<rect class="tile" x="80" y="208" width="300" height="200"/>
<rect x="80" y="208" width="4" height="200" fill="#00C6C9"/>
<!-- a function, as code -->
<rect class="box" x="100" y="228" width="260" height="96"/>
<g class="m" font-size="12">
  <text x="116" y="252" fill="#00DBD3">shell</text><text x="156" y="252" fill="#8A8AA0">(command) {</text>
  <text x="132" y="272" fill="#E8DFD0">run it under the reaper</text>
  <text x="132" y="292" fill="#E8DFD0">cut the output, keep the rest</text>
  <text x="116" y="312" fill="#8A8AA0">}</text>
</g>
<text class="m" x="100" y="346" font-size="10" fill="#8A8AA0" letter-spacing="1.5">HERE, OR FOR YOUR OWN, ON YOUR LAPTOP</text>
<use href="#mask" x="100" y="360" width="30" height="30" color="#00DBD3"/>
<use href="#ab" x="140" y="360" width="30" height="30" color="#FFBC56"/>
<text class="t" x="182" y="381" font-size="12" fill="#A3A3B8">a function, and it never moves</text>

<text class="t" x="80" y="440" font-size="14" fill="#E8DFD0">A tool is a function. It lives where it</text>
<text class="t" x="80" y="460" font-size="14" fill="#E8DFD0">was written, in the harness, in an MCP</text>
<text class="t" x="80" y="480" font-size="14" fill="#E8DFD0">server, or on your machine.</text>

<!-- arrow: described -->
<line x1="380" y1="300" x2="440" y2="300" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ===== 2 · described ===== -->
<text class="m" x="440" y="196" font-size="11" font-weight="500" fill="#8A8AA0" letter-spacing="3">2 · DESCRIBED</text>
<rect class="tile" x="440" y="208" width="240" height="200"/>
<!-- a menu card -->
<rect class="box" x="460" y="228" width="200" height="140"/>
<text class="m" x="476" y="252" font-size="12" font-weight="500" fill="#F4ECDB">shell</text>
<text class="t" x="476" y="274" font-size="12" fill="#A3A3B8">Runs a command in</text>
<text class="t" x="476" y="292" font-size="12" fill="#A3A3B8">the workspace.</text>
<text class="m" x="476" y="318" font-size="10" fill="#8A8AA0" letter-spacing="1">command: string</text>
<text class="m" x="476" y="336" font-size="10" fill="#8A8AA0" letter-spacing="1">timeout: number</text>
<line x1="476" y1="350" x2="640" y2="350" stroke="#E8DFD0" stroke-opacity=".18" stroke-width="1.5"/>
<text class="m" x="460" y="394" font-size="10" fill="#8A8AA0" letter-spacing="1.5">A NAME AND A SCHEMA. NO CODE.</text>

<text class="t" x="440" y="440" font-size="14" fill="#E8DFD0">Each tool is described once, like a</text>
<text class="t" x="440" y="460" font-size="14" fill="#E8DFD0">line on a menu. The description is</text>
<text class="t" x="440" y="480" font-size="14" fill="#E8DFD0">all that ever leaves.</text>

<!-- arrow: permitted -->
<line x1="680" y1="300" x2="740" y2="300" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ===== 3 · permitted ===== -->
<text class="m" x="740" y="196" font-size="11" font-weight="500" fill="#8A8AA0" letter-spacing="3">3 · PERMITTED</text>
<rect class="tile" x="740" y="208" width="300" height="200"/>
<use href="#mask" x="760" y="226" width="40" height="40" color="#00DBD3"/>
<text class="t" x="810" y="244" font-size="16" font-weight="800" fill="#F4ECDB">the agent file</text>
<text class="m" x="810" y="260" font-size="9" fill="#7B7B94" letter-spacing="1">reviewer.md</text>
<!-- the menu, with some lines struck -->
<g class="m" font-size="11">
  <text x="760" y="296" fill="#E8DFD0">read_file</text>
  <text x="760" y="316" fill="#E8DFD0">grep</text>
  <text x="760" y="336" fill="#E8DFD0">shell</text><text x="820" y="336" fill="#FF0080" letter-spacing="1">· ASKS</text>
  <text x="760" y="356" fill="#7B7B94">write_file</text><line x1="760" y1="352" x2="834" y2="352" stroke="#FF7E6E" stroke-width="1.5"/>
  <text x="760" y="376" fill="#7B7B94">web_fetch</text><line x1="760" y1="372" x2="827" y2="372" stroke="#FF7E6E" stroke-width="1.5"/>
  <text x="900" y="296" fill="#E8DFD0">mcp.jira.search</text>
  <text x="900" y="316" fill="#7B7B94">mcp.jira.delete</text><line x1="900" y1="312" x2="1010" y2="312" stroke="#FF7E6E" stroke-width="1.5"/>
  <text x="900" y="336" fill="#E8DFD0">client.notes.*</text><text x="1000" y="336" fill="#FFBC56" letter-spacing="1">· YOURS</text>
</g>
<text class="m" x="760" y="396" font-size="10" fill="#8A8AA0" letter-spacing="1.5">tools: · permissions: deny / ask</text>

<text class="t" x="740" y="440" font-size="14" fill="#E8DFD0">The agent file picks which lines go</text>
<text class="t" x="740" y="460" font-size="14" fill="#E8DFD0">on the model's menu, and marks the</text>
<text class="t" x="740" y="480" font-size="14" fill="#E8DFD0">ones that must ask first.</text>

<!-- arrow: chosen -->
<line x1="1040" y1="300" x2="1100" y2="300" stroke="#A3A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="m" x="1070" y="290" text-anchor="middle" font-size="9" fill="#8A8AA0" letter-spacing="1">THE MENU</text>

<!-- ===== 4 · chosen ===== -->
<text class="m" x="1100" y="196" font-size="11" font-weight="500" fill="#8A8AA0" letter-spacing="3">4 · CHOSEN</text>
<rect x="1108" y="216" width="412" height="200" fill="#000353"/>
<rect class="tile" x="1100" y="208" width="412" height="200"/>
<rect x="1120" y="228" width="120" height="120" fill="#00C6C9"/>
<text class="t" x="1180" y="296" text-anchor="middle" font-size="30" font-weight="900" fill="#0B0B12" letter-spacing="-1">LLM</text>
<text class="m" x="1180" y="320" text-anchor="middle" font-size="9" fill="#0B0B12" opacity=".75" letter-spacing="2">READS THE MENU</text>
<!-- the order -->
<rect class="box" x="1264" y="250" width="228" height="76"/>
<text class="m" x="1280" y="272" font-size="9" fill="#8A8AA0" letter-spacing="1.5">ITS WHOLE ANSWER</text>
<text class="m" x="1280" y="294" font-size="12" fill="#F4ECDB">shell</text>
<text class="m" x="1280" y="312" font-size="11" fill="#00DBD3">{ "command": "mix test" }</text>
<text class="m" x="1120" y="394" font-size="10" fill="#8A8AA0" letter-spacing="1.5">A NAME AND ARGUMENTS. IT HOLDS NO CODE AND RUNS NOTHING.</text>

<text class="t" x="1100" y="440" font-size="14" fill="#E8DFD0">The model orders by name. That is the</text>
<text class="t" x="1100" y="460" font-size="14" fill="#E8DFD0">whole of what it can do with a tool.</text>

<!-- ===== 5 · checked, then run: the way back ===== -->
<polyline points="1378,408 1378,560 1100,560" fill="none" stroke="#00C6C9" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
<text class="m" x="1392" y="500" font-size="10" fill="#00DBD3" letter-spacing="1.5">THE NAME COMES BACK</text>

<text class="m" x="80" y="540" font-size="11" font-weight="500" fill="#8A8AA0" letter-spacing="3">5 · CHECKED, THEN RUN · BACK WHERE THE CODE IS</text>
<rect x="88" y="560" width="1012" height="160" fill="#000353"/>
<rect class="tile" x="80" y="552" width="1012" height="160"/>
<rect x="80" y="552" width="4" height="160" fill="#00C6C9"/>

<!-- the gate -->
<use href="#lock" x="100" y="578" width="44" height="44" color="#F4ECDB"/>
<text class="t" x="156" y="598" font-size="16" font-weight="800" fill="#F4ECDB">the rules, where the code is</text>
<g class="m" font-size="10" letter-spacing="1.5">
  <rect x="156" y="612" width="98" height="22" fill="none" stroke="#FF7E6E" stroke-width="1.5"/><text x="205" y="627" text-anchor="middle" fill="#FF7E6E">THE PROFILE</text>
  <rect x="262" y="612" width="128" height="22" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/><text x="326" y="627" text-anchor="middle" fill="#A3A3B8">THE ORGANISATION</text>
  <rect x="398" y="612" width="60" height="22" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/><text x="428" y="627" text-anchor="middle" fill="#A3A3B8">YOURS</text>
  <rect x="466" y="612" width="110" height="22" fill="none" stroke="#E8DFD0" stroke-opacity=".42" stroke-width="1.5"/><text x="521" y="627" text-anchor="middle" fill="#A3A3B8">THE REPOSITORY</text>
</g>
<text class="m" x="156" y="658" font-size="10" fill="#FF7E6E" letter-spacing="1.5">deny  BEATS  ask  BEATS  allow · A PROFILE'S deny ENDS IT HERE, WHATEVER THE MODEL WANTED</text>
<text class="t" x="156" y="690" font-size="13" fill="#A3A3B8">Then: is it on this session's menu at all? does the agent file allow it?</text>

<!-- a person -->
<line x1="600" y1="586" x2="660" y2="586" stroke="#FF0080" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="664" y="568" width="150" height="36" fill="#FF0080"/>
<text class="m" x="739" y="591" text-anchor="middle" font-size="11" font-weight="500" fill="#0B0B12" letter-spacing="1.5">SOMEONE SAYS YES?</text>
<text class="t" x="664" y="624" font-size="12" fill="#A3A3B8">when the tool, the agent or a rule asks</text>

<!-- the run -->
<line x1="830" y1="586" x2="890" y2="586" stroke="#00C6C9" stroke-width="2" marker-end="url(#arrow-cyan)"/>
<rect class="box" x="896" y="568" width="176" height="96"/>
<g class="m" font-size="11">
  <text x="912" y="592" fill="#00DBD3">shell</text><text x="952" y="592" fill="#8A8AA0">("mix test")</text>
  <text x="912" y="612" fill="#E8DFD0">… runs, at last</text>
  <text x="912" y="636" fill="#8A8AA0">→ result, to the</text>
  <text x="912" y="652" fill="#8A8AA0">  model and the log</text>
</g>
<text class="m" x="896" y="690" font-size="9" fill="#7B7B94" letter-spacing="1">HERE, OR OVER YOUR SOCKET FOR client.*</text>

<!-- the point -->
<text class="t" x="80" y="780" font-size="22" font-weight="800" fill="#F4ECDB">The agent carries the menu to the model. The harness keeps the code, and the rules sit next to it.</text>
<text class="t" x="80" y="810" font-size="15" fill="#A3A3B8">So a profile that denies a tool makes every order for it fail at the gate, on every pod of that profile, whatever the model, the agent file or the repository would like.</text>

<!-- key -->
<rect x="80" y="846" width="14" height="14" fill="#00C6C9"/>
<text class="m" x="104" y="858" font-size="11" fill="#8A8AA0" letter-spacing="2">THE MACHINE</text>
<rect x="250" y="846" width="14" height="14" fill="#FFBC56"/>
<text class="m" x="274" y="858" font-size="11" fill="#8A8AA0" letter-spacing="2">YOUR MACHINE</text>
<rect x="430" y="846" width="14" height="14" fill="#FF7E6E"/>
<text class="m" x="454" y="858" font-size="11" fill="#8A8AA0" letter-spacing="2">REFUSED</text>
<rect x="580" y="846" width="14" height="14" fill="#FF0080"/>
<text class="m" x="604" y="858" font-size="11" fill="#8A8AA0" letter-spacing="2">A PERSON MUST DECIDE</text>
</svg>
