# The documentation site: `docs/`, plus the documents elsewhere in the repository the nav
# names by their path from the root (docs/overrides/hooks.py puts those on the site).
# Built on every pull request and published from `main` to GitHub Pages by
# .github/workflows/pages.yml; `strict` makes a broken link or a nav entry to a missing
# page a failed build. Locally: `pip install -r docs/requirements.txt`, `mkdocs serve`.
site_name: Troupe
site_description: A coding-agent harness that runs on Kubernetes and on your own machine.
site_url: https://it-minds.github.io/troupe/
repo_url: https://github.com/it-minds/troupe
repo_name: it-minds/troupe
edit_uri: ""

docs_dir: docs
strict: true
exclude_docs: |
  /overrides/
  /requirements.txt
# A decision is a page of its own and is reached from its log's index, which the nav names
# and the hook fills in; three hundred of them in the nav would be a list nobody reads. The
# known defects' pages are reached the same way, from the table in developer/defects.md.
not_in_nav: |
  /decisions/**/[0-9]*.md
  /developer/defects/*.md

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light

hooks:
  - docs/overrides/hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  # Markdown inside the front page's `<div markdown>` sections (docs/overrides/landing.html).
  - md_in_html
  - tables
  # Heading anchors spelt as GitHub spells them, so a `#fragment` works in both places.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
    anchors: warn

